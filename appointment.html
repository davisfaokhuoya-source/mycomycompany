    <div class="container py-5">

                    <div class="appointment-header">

                    </div>
                    <div class="card-body p-5">
                        <form id="appointmentForm">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" id="name" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email Address <span class="text-danger">*</span></label>

                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone Number <span class="text-danger">*</span></label>

                                </div>
                                <div class="col-md-6">

                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Preferred Date <span class="text-danger">*</span></label>
                                    <input type="date" id="date" class="form-control" min="" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Preferred Time <span class="text-danger">*</span></label>

                                </div>
                                <div class="col-12">

                                        <option value="CAC Registration & Corporate Compliance">CAC Registration & Corporate Compliance</option>
                                        <option value="Proposal & Project Development">Proposal & Project Development</option>
                                        <option value="Professional CV & Portfolio">Professional CV & Portfolio</option>
                                        <option value="Company Profile & Business Plan">Company Profile & Business Plan</option>
                                        <option value="General Contracting & Administrative Support">General Contracting & Administrative Support</option>
                                        <option value="Ethical Training / Anti-Corruption Programme">Ethical Training / Anti-Corruption Programme</option>
                                        <option value="Business Consultation / Strategy">Business Consultation / Strategy</option>
                                        <option value="Other">Other (please specify in message)</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Additional Message / Requirements</label>
                                    <textarea id="message" class="form-control" rows="4" placeholder="Tell us more about your needs, timeline, or any specific questions..." required></textarea>
                                </div>
                            </div>

    <!-- ====================== APPOINTMENT FORM SCRIPT ====================== -->
    <script>
        // Set minimum date to today
        document.getElementById('date').min = new Date().toISOString().split('T')[0];

        // Auto-fill service from URL parameter (?service=...) – this is how other pages send data to this appointment page
        const urlParams = new URLSearchParams(window.location.search);
        const prefillService = urlParams.get('service');
        if (prefillService) {
            const serviceSelect = document.getElementById('service');
            let exists = Array.from(serviceSelect.options).some(opt => opt.value === prefillService);
            if (!exists) {
                const newOption = new Option(prefillService, prefillService);
                serviceSelect.add(newOption);
            }
            serviceSelect.value = prefillService;
        }

        // Production-ready submission (CORS-friendly + better error handling)
        document.getElementById('appointmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Submitting...';
            status.innerHTML = '';

            const formDataObj = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                company: document.getElementById('company').value.trim() || '',
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                service: document.getElementById('service').value,
                message: document.getElementById('message').value.trim() || ''
            };

            try {
                // Your production Apps Script URL (this replaces the old google.script.run method)
                const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbWunC7KreTvjuhRbkBQLy4yOFTsXGXEKsG3-bVDMaJae1SRycTUa65bL20OcpRzl5bg/exec";

                const payload = new URLSearchParams();
                payload.append("parameters", JSON.stringify(formDataObj));

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload.toString()
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const resultText = await response.text();

                if (resultText.includes("Success") || resultText.toLowerCase().includes("submitted")) {
                    status.innerHTML = '<span class="text-success">✓ Request submitted successfully! We will contact you soon.</span>';
                    document.getElementById('appointmentForm').reset();
                } else {
                    throw new Error(resultText || 'Submission failed');
                }
            } catch (err) {
                console.error("Form submission error:", err);
                status.innerHTML = `<span class="text-danger">Error: ${err.message || 'Please try again later.'}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Request';
            }
        });
    </script>
