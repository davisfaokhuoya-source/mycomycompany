<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Syne:wght@400;600;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ── TOKENS ────────────────────────────────────────── */
        :root {
            --h: #0d0d14;
            /* header bg    */
            --ht: #f0f0fa;
            /* header text  */
            --f: #E07410;
            /* accent/footer*/
            --bg: #09090f;
            --s1: #0f0f1a;
            --s2: #141420;
            --card: #17172a;
            --bdr: rgba(255, 255, 255, .07);
            --txt: rgba(240, 240, 250, .82);
            --txt2: rgba(240, 240, 250, .48);
            --r: 16px;
            --tr: .35s cubic-bezier(.4, 0, .2, 1);
            font-size: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            display: block;
            max-width: 100%
        }

        a {
            color: var(--f);
            text-decoration: none
        }

        /* ── LOADER ─────────────────────────────────────────── */
        #lp-loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            transition: opacity .5s;
        }

        #lp-loader.out {
            opacity: 0;
            pointer-events: none
        }

        .ld-ring {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(224, 116, 16, .15);
            border-top-color: var(--f);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .ld-txt {
            font-family: "Syne", sans-serif;
            font-size: .7rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--txt2);
        }

        /* ── NAV ─────────────────────────────────────────────── */
        #lp-root {
            display: none
        }

        .lp-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 500;
            height: 68px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 15, .85);
            backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 1px solid var(--bdr);
            transition: box-shadow var(--tr);
        }

        .lp-nav.scrolled {
            box-shadow: 0 4px 40px rgba(0, 0, 0, .5)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer
        }

        .brand img {
            height: 40px;
            width: 40px;
            border-radius: 10px;
            object-fit: contain;
            border: 1.5px solid rgba(224, 116, 16, .4);
            background: #111;
        }

        .brand-name {
            font-family: "Syne", sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.1;
        }

        .brand-name small {
            display: block;
            font-size: .65rem;
            font-weight: 400;
            color: var(--f);
            letter-spacing: .15em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 4px;
            list-style: none
        }

        .nav-links a {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: .875rem;
            font-weight: 500;
            color: var(--txt2);
            transition: color var(--tr), background var(--tr);
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: rgba(255, 255, 255, .07)
        }

        .nav-cta {
            padding: 9px 22px;
            border-radius: 8px;
            background: var(--f);
            color: #fff;
            font-weight: 600;
            font-size: .875rem;
            transition: transform var(--tr), opacity var(--tr);
        }

        .nav-cta:hover {
            opacity: .88;
            transform: translateY(-1px)
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
        }

        /* ── HERO ────────────────────────────────────────────── */
        .lp-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: var(--h);
            padding: 120px 40px 80px;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .hero-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .25;
        }

        .glow-1 {
            width: 600px;
            height: 600px;
            background: var(--f);
            top: -200px;
            right: -100px;
        }

        .glow-2 {
            width: 400px;
            height: 400px;
            background: #6b21a8;
            bottom: -100px;
            left: -100px;
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            max-width: 680px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(224, 116, 16, .35);
            background: rgba(224, 116, 16, .1);
            font-size: .75rem;
            font-weight: 600;
            color: var(--f);
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .hero-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--f);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .3
            }
        }

        .hero-h1 {
            font-family: "Syne", sans-serif;
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 800;
            line-height: 1.08;
            color: #fff;
            margin-bottom: 20px;
            letter-spacing: -.02em;
        }

        .hero-h1 em {
            font-style: normal;
            color: var(--f);
        }

        .hero-sub {
            font-size: 1.1rem;
            font-weight: 300;
            color: var(--txt2);
            line-height: 1.7;
            max-width: 540px;
            margin-bottom: 40px;
        }

        .hero-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 26px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .9375rem;
            cursor: pointer;
            border: none;
            transition: all var(--tr);
        }

        .btn-primary {
            background: var(--f);
            color: #fff
        }

        .btn-primary:hover {
            background: #c96508;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(224, 116, 16, .4);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, .06);
            color: #fff;
            border: 1px solid var(--bdr);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, .12);
            transform: translateY(-2px)
        }

        /* HERO SCROLL HINT */
        .scroll-hint {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: var(--txt2);
            font-size: .7rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            z-index: 1;
            cursor: pointer;
        }

        .scroll-hint-arrow {
            width: 22px;
            height: 22px;
            border-right: 2px solid var(--f);
            border-bottom: 2px solid var(--f);
            transform: rotate(45deg);
            animation: bounce 1.6s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: rotate(45deg) translateY(0)
            }

            50% {
                transform: rotate(45deg) translateY(6px)
            }
        }

        /* HERO PEEK CARDS (teasers visible from homepage) */
        .hero-peek {
            position: absolute;
            z-index: 1;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 300px;
        }

        .peek-card {
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 14px;
            padding: 18px 20px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all var(--tr);
            overflow: hidden;
        }

        .peek-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(224, 116, 16, .1), transparent);
            opacity: 0;
            transition: opacity var(--tr);
        }

        .peek-card:hover::before {
            opacity: 1
        }

        .peek-card:hover {
            border-color: rgba(224, 116, 16, .4);
            transform: translateX(-6px);
        }

        .peek-card h4 {
            font-size: .9rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .peek-card p {
            font-size: .78rem;
            color: var(--txt2);
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .peek-card .peek-icon {
            font-size: 1.2rem;
            color: var(--f);
            margin-bottom: 10px;
        }

        .peek-label {
            font-size: .62rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--f);
            margin-bottom: 4px;
            font-weight: 700;
        }

        /* ── SECTION REVEAL SYSTEM ───────────────────────────── */
        /* Sections hidden, revealed on nav click or scroll       */
        .page-section {
            display: none;
            /* hidden by default */
            min-height: 100vh;
            padding: 100px 40px 80px;
            position: relative;
        }

        .page-section.active {
            display: block;
            animation: sectionIn .5s cubic-bezier(.4, 0, .2, 1) both;
        }

        @keyframes sectionIn {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* ── SECTION HEADERS ─────────────────────────────────── */
        .sec-eyebrow {
            font-size: .7rem;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--f);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .sec-title {
            font-family: "Syne", sans-serif;
            font-size: clamp(2rem, 4.5vw, 3rem);
            font-weight: 800;
            color: #fff;
            letter-spacing: -.025em;
            margin-bottom: 12px;
        }

        .sec-lead {
            font-size: 1.05rem;
            color: var(--txt2);
            max-width: 560px;
            line-height: 1.7;
            margin-bottom: 60px;
        }

        .sec-divider {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, var(--f), transparent);
            border-radius: 2px;
            margin-bottom: 16px;
        }

        /* ── GRID SYSTEMS ────────────────────────────────────── */
        .grid-3 {
            display: grid;
            gap: 28px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .grid-4 {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        }

        /* ── SERVICE CARD ────────────────────────────────────── */
        .svc-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            overflow: hidden;
            transition: all var(--tr);
            position: relative;
        }

        .svc-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--f), transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--tr);
        }

        .svc-card:hover::after {
            transform: scaleX(1)
        }

        .svc-card:hover {
            border-color: rgba(224, 116, 16, .3);
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .svc-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .svc-img-ph {
            width: 100%;
            height: 200px;
            background: var(--s2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: rgba(224, 116, 16, .3);
        }

        .svc-body {
            padding: 24px
        }

        .svc-body h3 {
            font-family: "Syne", sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .svc-body p {
            font-size: .875rem;
            color: var(--txt2);
            line-height: 1.65;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .svc-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            font-size: .8rem;
            font-weight: 600;
            color: var(--f);
            cursor: pointer;
        }

        .svc-link i {
            font-size: .65rem;
            transition: transform var(--tr)
        }

        .svc-link:hover i {
            transform: translateX(4px)
        }

        /* ── ITEM CARD ───────────────────────────────────────── */
        .item-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            overflow: hidden;
            transition: all var(--tr);
            position: relative;
        }

        .item-card:hover {
            border-color: rgba(224, 116, 16, .3);
            transform: translateY(-5px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, .5);
        }

        .item-img {
            width: 100%;
            height: 180px;
            object-fit: cover
        }

        .item-img-ph {
            width: 100%;
            height: 180px;
            background: var(--s2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255, 255, 255, .1);
        }

        .item-body {
            padding: 20px
        }

        .item-name {
            font-weight: 700;
            font-size: .95rem;
            color: #fff;
            margin-bottom: 6px;
        }

        .item-price {
            font-family: "Syne", sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--f);
            margin-bottom: 6px;
        }

        .item-desc {
            font-size: .8rem;
            color: var(--txt2);
            line-height: 1.55;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* ITEMS PAGINATION */
        .pager {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 48px;
            flex-wrap: wrap;
        }

        .pager-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid var(--bdr);
            background: transparent;
            color: var(--txt2);
            font-size: .875rem;
            cursor: pointer;
            transition: all var(--tr);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pager-btn:hover,
        .pager-btn.active {
            background: var(--f);
            border-color: var(--f);
            color: #fff;
        }

        .pager-btn.nav-arrow {
            width: auto;
            padding: 0 14px;
            gap: 6px;
            font-size: .8rem
        }

        /* ── CONTACT ─────────────────────────────────────────── */
        .contact-wrap {
            display: grid;
            gap: 40px;
            grid-template-columns: 1fr 1fr;
        }

        .contact-info-grid {
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .ci-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: 14px;
            padding: 20px 24px;
            transition: all var(--tr);
        }

        .ci-card:hover {
            border-color: rgba(224, 116, 16, .3)
        }

        .ci-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--f);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .ci-label {
            font-size: .72rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--txt2);
            margin-bottom: 3px;
        }

        .ci-value {
            font-size: .95rem;
            font-weight: 500;
            color: #fff
        }

        .ci-value a {
            color: #fff
        }

        .contact-map-ph {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            min-height: 320px;
            color: var(--txt2);
            font-size: 3rem;
        }

        .contact-map-ph p {
            font-size: .85rem
        }

        /* ── FOOTER ──────────────────────────────────────────── */
        .lp-footer {
            background: linear-gradient(180deg, var(--s1), #06060f);
            border-top: 1px solid var(--bdr);
            padding: 64px 40px 32px;
        }

        .footer-top {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 48px;
            margin-bottom: 48px;
        }

        .footer-brand-name {
            font-family: "Syne", sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
        }

        .footer-desc {
            font-size: .875rem;
            color: var(--txt2);
            line-height: 1.7;
            max-width: 300px;
        }

        .footer-col h5 {
            font-size: .75rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--f);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .footer-col ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .footer-col ul li a {
            font-size: .875rem;
            color: var(--txt2);
            transition: color var(--tr);
        }

        .footer-col ul li a:hover {
            color: #fff
        }

        .footer-bottom {
            border-top: 1px solid var(--bdr);
            padding-top: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-legal {
            font-size: .8rem;
            color: var(--txt2)
        }

        .powered-by {
            font-size: .75rem;
            color: var(--txt2);
        }

        .powered-by a {
            color: var(--f)
        }

        /* ── ABOUT SECTION ───────────────────────────────────── */
        .about-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 64px;
            align-items: center;
        }

        .about-img-wrap {
            position: relative
        }

        .about-img {
            width: 100%;
            aspect-ratio: 4/5;
            object-fit: cover;
            border-radius: 20px;
        }

        .about-img-ph {
            width: 100%;
            aspect-ratio: 4/5;
            background: var(--card);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: rgba(224, 116, 16, .2);
            border: 1px solid var(--bdr);
        }

        .about-stat-row {
            display: flex;
            gap: 24px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            min-width: 120px;
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-num {
            font-family: "Syne", sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--f);
        }

        .stat-lbl {
            font-size: .75rem;
            color: var(--txt2);
            margin-top: 4px
        }

        /* ── MOBILE ──────────────────────────────────────────── */
        @media(max-width:900px) {
            .hero-peek {
                display: none
            }

            .hero-h1 {
                font-size: 2.4rem
            }

            .contact-wrap {
                grid-template-columns: 1fr
            }

            .footer-top {
                grid-template-columns: 1fr 1fr
            }

            .about-wrap {
                grid-template-columns: 1fr
            }
        }

        @media(max-width:640px) {
            .lp-nav {
                padding: 0 20px
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: fixed;
                top: 68px;
                left: 0;
                right: 0;
                background: rgba(9, 9, 15, .98);
                padding: 20px;
                gap: 4px;
                border-bottom: 1px solid var(--bdr);
            }

            .nav-links.open {
                display: flex
            }

            .nav-cta {
                display: none
            }

            .nav-toggle {
                display: block
            }

            .lp-hero {
                padding: 100px 20px 60px
            }

            .page-section {
                padding: 90px 20px 60px
            }

            .footer-top {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>

    <div id="lp-loader">
        <div class="ld-ring"></div>
        <span class="ld-txt">Loading experience</span>
    </div>

    <div id="lp-root"></div>

    <script>
        // ── CONFIG ───────────────────────────────────────────
        var GW = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";

        // ── GLOBALS ──────────────────────────────────────────
        var D = null;           // page data
        var ITEMS_PAGE = 1;     // current items page
        var ITEMS_PER = 10;     // paid items per page
        var ALL_ITEMS = [];     // built item objects

        // ── BOOT ─────────────────────────────────────────────
        (function () {
            var slug = getSlug();
            if (!slug) { showError("No business page found."); return; }
            fetch(GW, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getLandingPage", slug: slug })
            })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.success && res.data) { boot(res.data); }
                    else { showError(res.message || "Page not found."); }
                })
                .catch(function () { showError("Connection error. Please try again."); });
        })();

        function getSlug() {
            var p = new URLSearchParams(window.location.search);
            return (p.get("slug") || p.get("page") || "").toUpperCase();
        }

        // ── BOOT THE PAGE ────────────────────────────────────
        function boot(d) {
            D = d;
            var root = document.documentElement;
            var h = d.colourHeader || "#0d0d14";
            var ht = d.colourHeaderText || "#f0f0fa";
            var f = d.colourFooter || "#E07410";
            root.style.setProperty("--h", h);
            root.style.setProperty("--ht", ht);
            root.style.setProperty("--f", f);
            // derive bg from h
            root.style.setProperty("--bg", darken(h, .3));
            root.style.setProperty("--s1", mix(h, "#000", .7));
            root.style.setProperty("--s2", mix(h, "#000", .5));
            root.style.setProperty("--card", mix(h, "#0a0a0a", .55));

            document.title = d.name + " | Business";

            var maxSvc = d.isPaid ? 8 : 2;
            var maxItem = d.isPaid ? 30 : 6;
            ITEMS_PER = d.isPaid ? 10 : 6;

            var svcs = buildSvc(d.servicesImages || [], d.servicesDescrip || [], maxSvc);
            ALL_ITEMS = buildItem(d.itemsImages || [], d.itemsDescrip || [], maxItem);

            var r = document.getElementById("lp-root");
            r.innerHTML = buildPage(d, svcs);
            r.style.display = "block";

            // loader out
            var ldr = document.getElementById("lp-loader");
            ldr.classList.add("out");
            setTimeout(function () { ldr.style.display = "none"; }, 500);

            initNav();
            initScroll();
            renderItems();   // render first page of items
            showSection("home");
        }

        // ── PAGE SKELETON ─────────────────────────────────────
        function buildPage(d, svcs) {
            return [
                buildNav(d),
                buildHomeSection(d, svcs),
                buildServicesSection(svcs),
                buildItemsSection(),
                buildContactSection(d),
                buildAboutSection(d),
                buildFooter(d)
            ].join("");
        }

        // ── NAV ───────────────────────────────────────────────
        function buildNav(d) {
            var waLink = d.whatsapp
                ? "<a href='https://wa.me/" + d.whatsapp.replace(/\D/g, "") + "' class='nav-cta btn'><i class='fa-brands fa-whatsapp'></i> Chat</a>"
                : (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='nav-cta btn'><i class='fa-solid fa-phone'></i> Call</a>" : "");
            return "<nav class='lp-nav' id='lp-nav'>" +
                "<div class='brand' onclick='showSection(\"home\")'>" +
                (d.logo ? "<img src='" + esc(d.logo) + "' alt='logo'>" : "<div style='width:40px;height:40px;border-radius:10px;background:var(--f);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-family:Syne,sans-serif;'>" + esc(d.name[0]) + "</div>") +
                "<div class='brand-name'>" + esc(d.name) + "<small>Official Page</small></div>" +
                "</div>" +
                "<button class='nav-toggle' id='nav-toggle' aria-label='Menu' onclick='toggleMenu()'><i class='fa-solid fa-bars'></i></button>" +
                "<ul class='nav-links' id='nav-links'>" +
                "<li><a href='#' onclick='navTo(\"home\")' data-sec='home' class='active'>Home</a></li>" +
                "<li><a href='#' onclick='navTo(\"services\")' data-sec='services'>Services</a></li>" +
                "<li><a href='#' onclick='navTo(\"items\")' data-sec='items'>Products</a></li>" +
                "<li><a href='#' onclick='navTo(\"about\")' data-sec='about'>About</a></li>" +
                "<li><a href='#' onclick='navTo(\"contact\")' data-sec='contact'>Contact</a></li>" +
                "</ul>" +
                waLink +
                "</nav>";
        }

        // ── HOME SECTION ──────────────────────────────────────
        function buildHomeSection(d, svcs) {
            // teaser peek cards for services + items
            var peekCards = "";
            svcs.slice(0, 3).forEach(function (s) {
                peekCards += "<div class='peek-card' onclick='navTo(\"services\")'>" +
                    "<div class='peek-icon'><i class='fa-solid fa-star'></i></div>" +
                    "<div class='peek-label'>Service</div>" +
                    "<h4>" + esc(s.title) + "</h4>" +
                    "<p>" + esc(s.desc) + "</p>" +
                    "</div>";
            });
            if (peekCards && ALL_ITEMS.length) {
                peekCards += "<div class='peek-card' onclick='navTo(\"items\")'>" +
                    "<div class='peek-icon'><i class='fa-solid fa-box-open'></i></div>" +
                    "<div class='peek-label'>Products</div>" +
                    "<h4>" + ALL_ITEMS.length + " Items Available</h4>" +
                    "<p>Browse our full product catalogue</p>" +
                    "</div>";
            }

            return "<section id='sec-home' class='page-section active' style='padding:0;min-height:unset;'>" +
                "<div class='lp-hero'>" +
                "<div class='hero-bg'>" +
                "<div class='hero-glow glow-1'></div>" +
                "<div class='hero-glow glow-2'></div>" +
                "</div>" +
                "<div class='hero-inner'>" +
                "<div class='hero-badge'>Official Business</div>" +
                "<h1 class='hero-h1'>" + buildH1(d) + "</h1>" +
                "<p class='hero-sub'>" + esc(d.address || "") + (d.regNo ? " &nbsp;·&nbsp; RC: " + esc(d.regNo) : "") + "</p>" +
                "<div class='hero-btns'>" +
                (d.whatsapp ? "<a href='https://wa.me/" + d.whatsapp.replace(/\D/g, "") + "' class='btn btn-primary'><i class='fa-brands fa-whatsapp'></i> WhatsApp Us</a>" : "") +
                (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-ghost'><i class='fa-solid fa-phone'></i> Call</a>" : "") +
                (!d.whatsapp && !d.phone && d.email ? "<a href='mailto:" + esc(d.email) + "' class='btn btn-primary'><i class='fa-solid fa-envelope'></i> Email Us</a>" : "") +
                "</div>" +
                "</div>" +
                (peekCards ? "<div class='hero-peek'>" + peekCards + "</div>" : "") +
                "<div class='scroll-hint' onclick='navTo(\"services\")'>" +
                "<span>Explore</span><div class='scroll-hint-arrow'></div>" +
                "</div>" +
                "</div>" +
                "</section>";
        }

        function buildH1(d) {
            var words = d.name.split(" ");
            if (words.length < 2) return "<em>" + esc(d.name) + "</em>";
            return esc(words.slice(0, -1).join(" ")) + " <em>" + esc(words[words.length - 1]) + "</em>";
        }

        // ── SERVICES SECTION ──────────────────────────────────
        function buildServicesSection(svcs) {
            if (!svcs.length) return "";
            var cards = svcs.map(function (s) {
                return "<div class='svc-card'>" +
                    (s.image ? "<img class='svc-img' src='" + esc(s.image) + "' alt='" + esc(s.title) + "' loading='lazy'>" :
                        "<div class='svc-img-ph'><i class='fa-solid fa-gear'></i></div>") +
                    "<div class='svc-body'>" +
                    "<h3>" + esc(s.title) + "</h3>" +
                    "<p>" + esc(s.desc) + "</p>" +
                    (s.desc ? "<span class='svc-link' onclick='expandDesc(this)'>Read more <i class='fa-solid fa-arrow-right'></i></span>" : "") +
                    "</div></div>";
            }).join("");
            return "<section id='sec-services' class='page-section'>" +
                "<div class='sec-eyebrow'>What We Offer</div>" +
                "<div class='sec-divider'></div>" +
                "<div class='sec-title'>Our Services</div>" +
                "<div class='sec-lead'>Explore the range of professional services we provide.</div>" +
                "<div class='grid-3'>" + cards + "</div>" +
                "</section>";
        }

        // ── ITEMS SECTION ─────────────────────────────────────
        function buildItemsSection() {
            return "<section id='sec-items' class='page-section'>" +
                "<div class='sec-eyebrow'>Our Collection</div>" +
                "<div class='sec-divider'></div>" +
                "<div class='sec-title'>Products &amp; Items</div>" +
                "<div class='sec-lead'>Browse everything we have available.</div>" +
                "<div class='grid-4' id='items-grid'></div>" +
                "<div class='pager' id='items-pager'></div>" +
                "</section>";
        }

        // ── RENDER ITEMS (paginated) ──────────────────────────
        function renderItems() {
            var grid = document.getElementById("items-grid");
            var pager = document.getElementById("items-pager");
            if (!grid || !pager) return;

            var total = Math.ceil(ALL_ITEMS.length / ITEMS_PER);
            ITEMS_PAGE = Math.max(1, Math.min(ITEMS_PAGE, total || 1));
            var start = (ITEMS_PAGE - 1) * ITEMS_PER;
            var page = ALL_ITEMS.slice(start, start + ITEMS_PER);

            if (!page.length) {
                grid.innerHTML = "<p style='color:var(--txt2);grid-column:1/-1'>No items yet.</p>";
                pager.innerHTML = "";
                return;
            }

            grid.innerHTML = page.map(function (it) {
                return "<div class='item-card'>" +
                    (it.image ? "<img class='item-img' src='" + esc(it.image) + "' alt='" + esc(it.name) + "' loading='lazy'>" :
                        "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>") +
                    "<div class='item-body'>" +
                    "<div class='item-name'>" + esc(it.name) + "</div>" +
                    (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") +
                    (it.desc ? "<div class='item-desc'>" + esc(it.desc) + "</div>" : "") +
                    "</div></div>";
            }).join("");

            // Pager
            if (total <= 1) { pager.innerHTML = ""; return; }
            var btns = "";
            if (ITEMS_PAGE > 1) btns += "<button class='pager-btn nav-arrow' onclick='changePage(" + (ITEMS_PAGE - 1) + ")'><i class='fa-solid fa-chevron-left'></i> Prev</button>";
            for (var i = 1; i <= total; i++) {
                btns += "<button class='pager-btn" + (i === ITEMS_PAGE ? " active" : "") + "' onclick='changePage(" + i + ")'>" + i + "</button>";
            }
            if (ITEMS_PAGE < total) btns += "<button class='pager-btn nav-arrow' onclick='changePage(" + (ITEMS_PAGE + 1) + ")'> Next <i class='fa-solid fa-chevron-right'></i></button>";
            pager.innerHTML = btns;
        }

        function changePage(n) {
            ITEMS_PAGE = n;
            renderItems();
            document.getElementById("sec-items").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        // ── CONTACT SECTION ───────────────────────────────────
        function buildContactSection(d) {
            var rows = [];
            if (d.phone) rows.push({ icon: "fa-phone", label: "Phone", val: d.phone, href: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ icon: "fa-brands fa-whatsapp", label: "WhatsApp", val: d.whatsapp, href: "https://wa.me/" + d.whatsapp.replace(/\D/g, "") });
            if (d.email) rows.push({ icon: "fa-envelope", label: "Email", val: d.email, href: "mailto:" + d.email });
            if (d.address) rows.push({ icon: "fa-location-dot", label: "Address", val: d.address, href: null });
            if (d.url) rows.push({ icon: "fa-globe", label: "Website", val: d.url, href: d.url });

            var cards = rows.map(function (r) {
                var v = r.href ? "<a href='" + esc(r.href) + "' target='_blank' style='color:#fff'>" + esc(r.val) + "</a>" : esc(r.val);
                var icon = r.icon.indexOf("fa-brands") !== -1
                    ? "<i class='" + esc(r.icon) + "'></i>"
                    : "<i class='fa-solid " + esc(r.icon) + "'></i>";
                return "<div class='ci-card'>" +
                    "<div class='ci-icon'>" + icon + "</div>" +
                    "<div><div class='ci-label'>" + r.label + "</div><div class='ci-value'>" + v + "</div></div>" +
                    "</div>";
            }).join("");

            return "<section id='sec-contact' class='page-section'>" +
                "<div class='sec-eyebrow'>Get In Touch</div>" +
                "<div class='sec-divider'></div>" +
                "<div class='sec-title'>Contact Us</div>" +
                "<div class='sec-lead'>We'd love to hear from you.</div>" +
                "<div class='contact-wrap'>" +
                "<div class='contact-info-grid'>" + cards + "</div>" +
                "<div class='contact-map-ph'><i class='fa-solid fa-map-location-dot'></i><p>" + esc(d.address || d.name) + "</p></div>" +
                "</div>" +
                "</section>";
        }

        // ── ABOUT SECTION ─────────────────────────────────────
        function buildAboutSection(d) {
            return "<section id='sec-about' class='page-section'>" +
                "<div class='sec-eyebrow'>Who We Are</div>" +
                "<div class='sec-divider'></div>" +
                "<div class='about-wrap'>" +
                "<div>" +
                "<div class='sec-title'>About " + esc(d.name) + "</div>" +
                "<div class='sec-lead' style='margin-bottom:32px'>" +
                (d.address || "A trusted business dedicated to delivering excellence and value to every client we serve.") +
                "</div>" +
                (d.regNo ? "<p style='font-size:.85rem;color:var(--txt2);margin-bottom:32px'><strong style='color:#fff'>Registration No:</strong> " + esc(d.regNo) + "</p>" : "") +
                "<div class='about-stat-row'>" +
                "<div class='stat-box'><div class='stat-num'>" + ((D && D.isPaid) ? "8" : "2") + "</div><div class='stat-lbl'>Services</div></div>" +
                "<div class='stat-box'><div class='stat-num'>" + ALL_ITEMS.length + "</div><div class='stat-lbl'>Products</div></div>" +
                "<div class='stat-box'><div class='stat-num'>24/7</div><div class='stat-lbl'>Available</div></div>" +
                "</div></div>" +
                (d.logo ?
                    "<div class='about-img-wrap'><img class='about-img' src='" + esc(d.logo) + "' alt='" + esc(d.name) + "'></div>" :
                    "<div class='about-img-wrap'><div class='about-img-ph'><i class='fa-solid fa-building'></i></div></div>") +
                "</div>" +
                "</section>";
        }

        // ── FOOTER ────────────────────────────────────────────
        function buildFooter(d) {
            return "<footer class='lp-footer'>" +
                "<div class='footer-top'>" +
                "<div>" +
                "<div class='footer-brand-name'>" + esc(d.name) + "</div>" +
                "<p class='footer-desc'>" + esc(d.address || "Providing quality services and products with integrity and excellence.") + "</p>" +
                (d.regNo ? "<p style='margin-top:12px;font-size:.78rem;color:var(--txt2)'>RC: " + esc(d.regNo) + "</p>" : "") +
                "</div>" +
                "<div class='footer-col'><h5>Navigation</h5><ul>" +
                "<li><a href='#' onclick='navTo(\"home\")'>Home</a></li>" +
                "<li><a href='#' onclick='navTo(\"services\")'>Services</a></li>" +
                "<li><a href='#' onclick='navTo(\"items\")'>Products</a></li>" +
                "<li><a href='#' onclick='navTo(\"about\")'>About</a></li>" +
                "<li><a href='#' onclick='navTo(\"contact\")'>Contact</a></li>" +
                "</ul></div>" +
                "<div class='footer-col'><h5>Contact</h5><ul>" +
                (d.phone ? "<li><a href='tel:" + esc(d.phone) + "'>" + esc(d.phone) + "</a></li>" : "") +
                (d.email ? "<li><a href='mailto:" + esc(d.email) + "'>" + esc(d.email) + "</a></li>" : "") +
                (d.whatsapp ? "<li><a href='https://wa.me/" + d.whatsapp.replace(/\D/g, "") + "'>WhatsApp</a></li>" : "") +
                "</ul></div>" +
                "</div>" +
                "<div class='footer-bottom'>" +
                "<span class='footer-legal'>&copy; " + new Date().getFullYear() + " " + esc(d.name) + ". All rights reserved.</span>" +
                "<span class='powered-by'>Powered by <a href='https://thevictorias.com.ng' target='_blank'>The Victorias Ltd</a></span>" +
                "</div>" +
                "</footer>";
        }

        // ── SECTION NAVIGATION ────────────────────────────────
        function navTo(id) {
            // prevent default link behavior
            event && event.preventDefault && event.preventDefault();
            showSection(id);
            // close mobile menu
            var nl = document.getElementById("nav-links");
            if (nl) nl.classList.remove("open");
            // scroll to top
            window.scrollTo({ top: 0, behavior: "smooth" });
            return false;
        }

        function showSection(id) {
            // hide all sections
            document.querySelectorAll(".page-section").forEach(function (s) {
                s.classList.remove("active");
            });
            // show target
            var sec = document.getElementById("sec-" + id);
            if (sec) { sec.classList.add("active"); }

            // update nav
            document.querySelectorAll(".nav-links a").forEach(function (a) {
                a.classList.toggle("active", a.dataset.sec === id);
            });

            // re-render items if switching to items tab
            if (id === "items") renderItems();
        }

        // ── NAV BEHAVIOUR ─────────────────────────────────────
        function initNav() {
            window.addEventListener("scroll", function () {
                var nav = document.getElementById("lp-nav");
                if (nav) nav.classList.toggle("scrolled", window.scrollY > 40);
            });
        }

        function toggleMenu() {
            var nl = document.getElementById("nav-links");
            var ic = document.querySelector("#nav-toggle i");
            if (!nl) return;
            nl.classList.toggle("open");
            if (ic) ic.className = nl.classList.contains("open")
                ? "fa-solid fa-xmark"
                : "fa-solid fa-bars";
        }

        // ── SCROLL REVEAL ─────────────────────────────────────
        function initScroll() {
            // sections are shown on click, not scroll
            // but items within sections fade in
            var obs = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) {
                    if (e.isIntersecting) e.target.style.opacity = "1";
                });
            }, { threshold: .15 });
            document.querySelectorAll(".svc-card,.item-card,.ci-card,.stat-box,.peek-card")
                .forEach(function (el) {
                    el.style.opacity = "0";
                    el.style.transition = "opacity .6s ease, transform var(--tr)";
                    obs.observe(el);
                });
        }

        // ── EXPAND DESC ───────────────────────────────────────
        function expandDesc(btn) {
            var p = btn.previousElementSibling;
            if (!p) return;
            var clamped = p.style.webkitLineClamp !== "unset";
            p.style.webkitLineClamp = clamped ? "unset" : "";
            p.style.display = clamped ? "block" : "";
            btn.innerHTML = clamped
                ? "Show less <i class='fa-solid fa-arrow-up'></i>"
                : "Read more <i class='fa-solid fa-arrow-right'></i>";
        }

        // ── DATA BUILDERS ─────────────────────────────────────
        function buildSvc(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit);
            var out = [];
            for (var i = 0; i < n; i++) {
                var p = (descs[i] || "").split("::");
                out.push({ image: imgs[i] || "", title: p[0] || "Service " + (i + 1), desc: p[1] || "" });
            }
            return out;
        }

        function buildItem(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit);
            var out = [];
            for (var i = 0; i < n; i++) {
                var p = (descs[i] || "").split("::");
                out.push({ image: imgs[i] || "", name: p[0] || "Item " + (i + 1), price: p[1] || "", desc: p[2] || "" });
            }
            return out;
        }

        // ── COLOUR HELPERS ────────────────────────────────────
        function hexToRgb(h) {
            h = h.replace("#", "");
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
        }
        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(function (v) {
                return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
            }).join("");
        }
        function darken(hex, t) {
            var c = hexToRgb(hex);
            return rgbToHex(c.r * t, c.g * t, c.b * t);
        }
        function mix(a, b, t) {
            var ca = hexToRgb(a), cb = hexToRgb(b);
            return rgbToHex(ca.r * t + cb.r * (1 - t), ca.g * t + cb.g * (1 - t), ca.b * t + cb.b * (1 - t));
        }

        // ── UTILS ─────────────────────────────────────────────
        function showError(msg) {
            var ldr = document.getElementById("lp-loader");
            if (ldr) ldr.style.display = "none";
            var r = document.getElementById("lp-root");
            r.style.display = "block";
            r.innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'>" +
                "<div><div style='font-size:4rem;margin-bottom:20px;color:rgba(255,255,255,.1)'>404</div>" +
                "<h2 style='font-family:Syne,sans-serif;color:#fff;margin-bottom:12px'>Page Not Found</h2>" +
                "<p style='color:rgba(255,255,255,.4);margin-bottom:32px'>" + esc(msg) + "</p>" +
                "<a href='https://thevictorias.com.ng' style='color:#E07410;font-size:.875rem'>← The Victorias Ltd</a>" +
                "</div></div>" +
                "<div class='powered-by' style='position:fixed;bottom:0;left:0;right:0;background:#000;padding:10px;font-size:.75rem;color:rgba(255,255,255,.3);text-align:center;'>" +
                "Powered by <a href='https://thevictorias.com.ng' target='_blank' style='color:#E07410'>thevictorias.com.ng</a></div>";
        }

        function esc(s) {
            return String(s || "")
                .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }
    </script>
</body>

</html>
