<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #09090f;
            --ink2: #111118;
            --ink3: #1a1a24;
            --amber: #E07410;
            --amber2: #f88c20;
            --cream: #f0f0fa;
            --muted: rgba(240, 240, 250, .56);
            --faint: rgba(240, 240, 250, .24);
            --border: rgba(255, 255, 255, .08);
            --a-soft: rgba(224, 116, 16, .10);
            --a-mid: rgba(224, 116, 16, .32);
            --a-glow: rgba(224, 116, 16, .18);
            --radius: 14px;
            --nav-h: 68px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000;
            color: var(--cream);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--amber);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ── LOADER ── */
        #lp-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .5s;
        }

        #lp-loader.out {
            opacity: 0;
            pointer-events: none;
        }

        .ld-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .08);
            border-top-color: var(--amber);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ld-txt {
            font-size: .75rem;
            color: var(--muted);
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        #lp-root {
            display: none;
        }

        /* ── PAGE ── */
        .lp-page {
            width: 100%;
            background: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── NAV ── */
        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 400;
            height: var(--nav-h);
            background: rgba(9, 9, 15, .92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 48px;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            height: 36px;
            width: 36px;
            border-radius: 9px;
            object-fit: contain;
            border: 1.5px solid var(--a-mid);
        }

        .brand-fallback {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--amber);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: .95rem;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: .9rem;
            color: var(--cream);
        }

        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none;
        }

        .nav-links a {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 500;
            color: var(--muted);
            transition: .2s;
        }

        .nav-links a:hover {
            color: var(--cream);
            background: rgba(255, 255, 255, .06);
            text-decoration: none;
        }

        .nav-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 22px;
            border-radius: 10px;
            font-size: .83rem;
            font-weight: 600;
            background: var(--amber);
            color: #fff;
            transition: .25s;
            white-space: nowrap;
        }

        .nav-cta:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
        }

        @media(max-width:768px) {
            .lp-nav {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-h);
                left: 0;
                right: 0;
                background: var(--ink2);
                flex-direction: column;
                padding: 12px 20px;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-toggle {
                display: block;
            }
        }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .86rem;
            cursor: pointer;
            border: none;
            transition: all .28s;
            white-space: nowrap;
            font-family: 'Outfit', sans-serif;
        }

        .btn-p {
            background: var(--amber);
            color: #fff;
            box-shadow: 0 8px 28px var(--a-mid);
        }

        .btn-p:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 36px rgba(224, 116, 16, .4);
            text-decoration: none;
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .22);
            color: var(--cream);
        }

        .btn-o:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .btn-g {
            background: rgba(255, 255, 255, .06);
            color: var(--cream);
            border: 1px solid var(--border);
        }

        .btn-g:hover {
            background: rgba(255, 255, 255, .1);
            transform: translateY(-2px);
            text-decoration: none;
        }

        /* ── SECTION LABELS ── */
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--amber);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .eyebrow::before {
            content: '';
            width: 20px;
            height: 1.5px;
            background: var(--amber);
        }

        .eyebrow.ctr::before {
            display: none;
        }

        /* ── CONTENT WRAP — services & items only ── */
        .content-wrap {
            width: 60%;
            margin: 0 auto;
        }

        @media(max-width:1200px) {
            .content-wrap {
                width: 80%;
            }
        }

        @media(max-width:768px) {
            .content-wrap {
                width: 100%;
                padding: 0 20px;
            }
        }

        /* ── SECTION ── */
        .sec {
            padding: 96px 0;
        }

        @media(max-width:768px) {
            .sec {
                padding: 64px 0;
            }
        }

        .sec-hdr {
            margin-bottom: 52px;
        }

        .h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            color: var(--cream);
            letter-spacing: -.02em;
            line-height: 1.08;
            margin-bottom: 12px;
        }

        .lead {
            font-size: .94rem;
            color: var(--muted);
            line-height: 1.78;
        }

        /* ── SERVICES GRID: always 3 columns, centered ── */
        .svc-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(3, 1fr);
            justify-items: center;
        }

        @media(max-width:900px) {
            .svc-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:580px) {
            .svc-grid {
                grid-template-columns: 1fr;
            }
        }

        .svc-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            width: 100%;
            transition: transform .32s, border-color .32s, box-shadow .32s;
        }

        .svc-card:hover {
            transform: translateY(-6px);
            border-color: rgba(224, 116, 16, .3);
            box-shadow: 0 20px 48px -16px rgba(0, 0, 0, .6);
        }

        .svc-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .svc-img-ph {
            width: 100%;
            height: 180px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--a-mid);
        }

        .svc-body {
            padding: 22px 24px 26px;
        }

        .svc-body h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 9px;
        }

        .svc-body p {
            font-size: .83rem;
            color: var(--muted);
            line-height: 1.65;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            font-size: .77rem;
            font-weight: 600;
            color: var(--amber);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        /* ── ITEMS GRID ── */
        .item-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }

        @media(max-width:640px) {
            .item-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        @media(max-width:420px) {
            .item-grid {
                grid-template-columns: 1fr;
            }
        }

        .item-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .3s, border-color .3s;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(224, 116, 16, .26);
        }

        .item-img {
            width: 100%;
            height: 158px;
            object-fit: cover;
        }

        .item-img-ph {
            width: 100%;
            height: 158px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--faint);
        }

        .item-body {
            padding: 14px 16px 18px;
        }

        .item-name {
            font-weight: 600;
            font-size: .86rem;
            color: var(--cream);
            margin-bottom: 5px;
        }

        .item-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: .98rem;
            color: var(--amber);
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: .75rem;
            color: var(--muted);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* ── PAGER ── */
        .pager {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 42px;
            flex-wrap: wrap;
        }

        .pg-btn {
            padding: 9px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            background: var(--ink2);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: .2s;
            font-family: 'Outfit', sans-serif;
        }

        .pg-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .pg-btn.pg-active {
            background: var(--amber);
            border-color: var(--amber);
            color: #fff;
        }

        /* ── CONTACT — full width, no container ── */
        .contact-section {
            padding: 96px 48px;
            background: var(--ink);
        }

        @media(max-width:768px) {
            .contact-section {
                padding: 64px 20px;
            }
        }

        .contact-inner {
            max-width: 960px;
            margin: 0 auto;
        }

        .ci-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(3, 1fr);
        }

        @media(max-width:900px) {
            .ci-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:540px) {
            .ci-grid {
                grid-template-columns: 1fr;
            }
        }

        .ci-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: .25s;
            min-width: 0;
        }

        .ci-card:hover {
            border-color: rgba(224, 116, 16, .28);
        }

        .ci-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber);
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .ci-lbl {
            font-size: .66rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .ci-val {
            font-size: .88rem;
            font-weight: 600;
            color: var(--cream);
            word-break: break-all;
            line-height: 1.4;
        }

        /* ── FOOTER — full width ── */
        .lp-footer {
            background: #000;
            border-top: 1px solid rgba(255, 255, 255, .05);
            padding: 52px 48px 30px;
            text-align: center;
        }

        @media(max-width:768px) {
            .lp-footer {
                padding: 40px 20px 24px;
            }
        }

        .foot-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--amber);
            margin-bottom: 8px;
        }

        .foot-meta {
            font-size: .76rem;
            color: var(--faint);
            margin-bottom: 3px;
        }

        .foot-copy {
            font-size: .72rem;
            color: var(--faint);
            margin-top: 16px;
        }

        .pwby {
            background: #000;
            color: rgba(255, 255, 255, .3);
            text-align: center;
            padding: 14px 24px;
            font-size: .71rem;
        }

        .pwby a {
            color: var(--amber);
        }

        /* ── AD BOX ── */
        .adbox {
            border: 1.5px dashed rgba(255, 255, 255, .1);
            border-radius: 13px;
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: .83rem;
            margin: 0 48px 44px;
        }

        @media(max-width:768px) {
            .adbox {
                margin: 0 20px 40px;
            }
        }

        .adbox span {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        /* ── EXPIRED ── */
        .expnotice {
            background: rgba(255, 193, 7, .08);
            border: 1px solid rgba(255, 193, 7, .28);
            border-radius: 10px;
            padding: 12px 48px;
            text-align: center;
            color: #ffc107;
            font-size: .83rem;
        }

        @media(max-width:768px) {
            .expnotice {
                padding: 12px 20px;
            }
        }

        /* ── SCROLL REVEAL ── */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .5s, transform .5s;
        }

        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* ── MODAL ── */
        #lpModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lpModal>div {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 18px;
            max-width: 520px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 34px;
            position: relative;
        }

        #lpmEy {
            font-size: .63rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 10px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        #lpmT {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--cream);
            margin-bottom: 8px;
            padding-right: 30px;
            line-height: 1.3;
        }

        #lpmP {
            color: var(--amber);
            font-size: 1.08rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        #lpmB {
            color: var(--muted);
            line-height: 1.78;
            font-size: .87rem;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, .07);
            border: none;
            color: var(--cream);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* ════════════════════════════════
       TEMPLATE-SPECIFIC HERO STYLES
    ════════════════════════════════ */

        /* FREE1 — "Pulse" — centered, radial amber glow, diagonal stripes */
        .hero-free1 {
            min-height: 92vh;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-free1::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(-55deg, transparent 0, transparent 30px, rgba(255, 255, 255, .018) 30px, rgba(255, 255, 255, .018) 31px);
            pointer-events: none;
        }

        .hero-free1 .glow-orb {
            position: absolute;
            bottom: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(224, 116, 16, .22) 0%, transparent 65%);
            pointer-events: none;
        }

        .hero-free1 .ticker {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: rgba(224, 116, 16, .1);
            border: 1px solid rgba(224, 116, 16, .28);
            border-radius: 50px;
            padding: 6px 18px;
            margin-bottom: 30px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .66rem;
            color: var(--amber);
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        .hero-free1 .ticker .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 8px var(--amber);
            animation: pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        .hero-free1 h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 6.5vw, 4.8rem);
            font-weight: 900;
            line-height: .97;
            color: var(--cream);
            letter-spacing: -.03em;
            margin-bottom: 14px;
        }

        .hero-free1 .divider {
            width: 56px;
            height: 3px;
            background: linear-gradient(90deg, var(--amber), transparent);
            margin: 20px auto;
        }

        .hero-free1 .sub {
            font-size: 1rem;
            color: var(--muted);
            max-width: 480px;
            margin: 0 auto 38px;
            line-height: 1.75;
        }

        .hero-free1 .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* FREE2 — "Prism Split" — left text, right gradient panel */
        .hero-free2 {
            min-height: 92vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--ink);
            position: relative;
        }

        .hero-free2 .left {
            padding: 80px 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .hero-free2 .right {
            background: linear-gradient(145deg, rgba(224, 116, 16, .15) 0%, rgba(224, 116, 16, .03) 60%, transparent 100%);
            border-left: 1px solid rgba(224, 116, 16, .14);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .hero-free2 .right::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(224, 116, 16, .3) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            opacity: .4;
        }

        .hero-free2 .right-logo {
            position: relative;
            z-index: 1;
            max-height: 200px;
            max-width: 70%;
            object-fit: contain;
        }

        .hero-free2 .tag {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(224, 116, 16, .12);
            border: 1px solid rgba(224, 116, 16, .25);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem;
            color: var(--amber);
            letter-spacing: .18em;
            text-transform: uppercase;

        function darken(h, t) { return mix(h, "#000000", 1 - t); }
        function lighten(h, t) { return mix(h, "#ffffff", t); }
        function rgba(h, a) { var c = hexRgb(h); return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }

                + "</div></div>";

        function buildSvc(imgs, descs, limit) { var n = Math.min(Math.max(imgs.length, descs.length), limit), o = []; for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); o.push({ image: imgs[i] || "", title: (p[0] || "Service " + (i + 1)).trim(), desc: (p[1] || "").trim() }); } return o; }
        function buildItem(imgs, descs, limit) { var n = Math.min(Math.max(imgs.length, descs.length), limit), o = []; for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); o.push({ image: imgs[i] || "", name: (p[0] || "Item " + (i + 1)).trim(), price: (p[1] || "").trim(), desc: (p[2] || "").trim() }); } return o; }
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
        function escA(s) { return String(s || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, " "); }
        function initModal() { var m = document.getElementById("lpModal"); if (m) m.addEventListener("click", function (e) { if (e.target === this) closeLpModal(); }); }
        function openLpModal(ey, t, p, b) { document.getElementById("lpmEy").textContent = ey || ""; document.getElementById("lpmT").textContent = t || ""; document.getElementById("lpmP").textContent = p || ""; document.getElementById("lpmB").textContent = b || ""; var m = document.getElementById("lpModal"); m.style.display = "flex"; document.body.style.overflow = "hidden"; }
        function closeLpModal() { var m = document.getElementById("lpModal"); if (m) { m.style.display = "none"; document.body.style.overflow = ""; } }
        function initScrollReveal() { var obs = new IntersectionObserver(function (e) { e.forEach(function (x) { if (x.isIntersecting) x.target.classList.add("in"); }); }, { threshold: .1 }); document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { obs.observe(el); }); }
        function initNavScroll() { window.addEventListener("scroll", function () { var nav = document.querySelector(".lp-nav"); if (nav) nav.style.borderBottomColor = window.scrollY > 40 ? "rgba(224,116,16,.18)" : "rgba(255,255,255,.08)"; }); }
        function showError(msg) { document.getElementById("lp-loader").style.display = "none"; document.getElementById("lp-root").style.display = "block"; document.getElementById("lp-page").innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'><div><div style='font-family:Playfair Display,serif;font-size:3.5rem;color:rgba(255,255,255,.06);font-weight:900;'>404</div><p style='color:var(--muted);margin:16px 0 28px;'>" + esc(msg) + "</p><a href='https://thevictorias.com.ng' style='color:var(--amber);font-size:.875rem;'>&larr; The Victorias Ltd</a></div></div>" + poweredBy(); }
    </script>
</body>

</html>
