<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading&hellip;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --h: #0d0d14;
            --ht: #f0f0fa;
            --f: #E07410;
            --bg: #09090f;
            --surf: #15151f;
            --surf2: #1c1c2a;
            --border: rgba(255, 255, 255, .08);
            --text: rgba(240, 240, 250, .92);
            --text-soft: rgba(240, 240, 250, .6);
            --text-faint: rgba(240, 240, 250, .35);
            --f-soft: rgba(224, 116, 16, .12);
            --f-mid: rgba(224, 116, 16, .32);
            --f-strong: rgba(224, 116, 16, .55);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--f);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .lp-page {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg);
            box-shadow: 0 0 80px rgba(0, 0, 0, .35);
            position: relative;
            min-height: 100vh;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .7rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--f);
            font-weight: 700;
            margin-bottom: 18px;
        }

        .eyebrow::before {
            content: '';
            width: 18px;
            height: 1.5px;
            background: var(--f);
        }

        .eyebrow.ctr::before {
            display: none;
        }

        .h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: clamp(1.85rem, 3.6vw, 2.6rem);
            color: var(--text);
            letter-spacing: -.02em;
            line-height: 1.12;
            margin-bottom: 14px;
        }

        .lead {
            font-size: .96rem;
            color: var(--text-soft);
            max-width: 540px;
            line-height: 1.75;
            margin-bottom: 54px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 26px;
            border-radius: 10px;
            font-weight: 700;
            font-size: .86rem;
            cursor: pointer;
            border: none;
            transition: all .3s;
            white-space: nowrap;
        }

        .btn-p {
            background: var(--f);
            color: #fff;
            box-shadow: 0 8px 24px var(--f-mid);
        }

        .btn-p:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px var(--f-strong);
            text-decoration: none;
            filter: brightness(1.06);
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .22);
            color: var(--text);
        }

        .btn-o:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .btn-g {
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-g:hover {
            transform: translateY(-2px);
            text-decoration: none;
            background: rgba(255, 255, 255, .09);
        }

        .sec {
            padding: 96px 48px;
        }

        .sec-hdr {
            margin-bottom: 54px;
        }

        .pwby {
            background: #000;
            color: rgba(255, 255, 255, .4);
            text-align: center;
            padding: 14px 24px;
            font-size: .74rem;
        }

        .pwby a {
            color: var(--f);
        }

        .adbox {
            border: 1.5px dashed var(--border);
            border-radius: 13px;
            padding: 36px 20px;
            text-align: center;
            color: var(--text-soft);
            font-size: .84rem;
            margin: 0 48px 44px;
        }

        .adbox span {
            display: block;
            font-size: 1.7rem;
            margin-bottom: 6px;
        }

        .expnotice {
            background: rgba(255, 193, 7, .1);
            border: 1px solid rgba(255, 193, 7, .35);
            border-radius: 11px;
            padding: 13px 24px;
            text-align: center;
            color: #ffc107;
            font-size: .85rem;
            margin: 18px 48px;
        }

        /* ==================== MAIN GRID STYLES ==================== */
        .svc-grid {
            display: grid;
            gap: 28px;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        }

        .item-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        .svc-card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform .35s, border-color .35s, box-shadow .35s;
        }

        .svc-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, .18);
            box-shadow: 0 22px 46px -16px rgba(0, 0, 0, .55);
        }

        .svc-img {
            width: 100%;
            height: 185px;
            object-fit: cover;
        }

        .svc-img-ph {
            width: 100%;
            height: 185px;
            background: var(--surf2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            color: var(--f-mid);
        }

        .svc-body {
            padding: 24px;
        }

        .svc-body h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 9px;
            letter-spacing: -.01em;
        }

        .svc-body p {
            font-size: .85rem;
            color: var(--text-soft);
            line-height: 1.65;
        }

        /* Items */
        .item-card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 13px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .35s, border-color .35s;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, .18);
        }

        .item-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .item-img-ph {
            width: 100%;
            height: 160px;
            background: var(--surf2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text-faint);
        }

        .item-body {
            padding: 16px;
        }

        .item-name {
            font-weight: 700;
            font-size: .88rem;
            color: var(--text);
            margin-bottom: 5px;
        }

        .item-price {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: var(--f);
            margin-bottom: 5px;
        }

        .item-desc {
            font-size: .77rem;
            color: var(--text-soft);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* Modal Fix */
        #lpModal>div {
            overflow-x: hidden;
        }

        #lpmB {
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.75;
        }

        /* Mobile - 1 column for both Services and Items */
        @media(max-width: 640px) {
            .sec {
                padding: 64px 22px;
            }

            .svc-grid,
            .item-grid {
                grid-template-columns: 1fr !important;
                gap: 20px;
            }

            .adbox,
            .expnotice {
                margin-left: 22px;
                margin-right: 22px;
            }

            .lp-footer {
                padding-left: 22px;
                padding-right: 22px;
            }

            .lp-nav {
                padding: 0 20px;
            }
        }

        /* Service Tabs */
        @media(max-width:900px) {
            .svc-panel {
                grid-template-columns: 1fr !important;
            }
        }

        /* Other existing styles */
        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 13px;
            font-size: .78rem;
            font-weight: 700;
            color: var(--f);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .svc-list-row {
            display: flex;
            gap: 28px;
            padding: 32px 0;
            border-bottom: 1px solid var(--border);
            align-items: flex-start;
        }

        .svc-list-row:last-child {
            border-bottom: none;
        }

        .svc-list-row:hover {
            padding-left: 8px;
        }

        .svc-num {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--f);
            min-width: 78px;
            line-height: 1;
            opacity: 0.9;
        }

        .svc-list-row:hover .svc-num {
            -webkit-text-stroke-color: var(--f);
            color: var(--f);
            transform: scale(1.05);
        }

        .item-table {
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            background: var(--surf);
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background .25s;
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-row:hover {
            background: var(--surf2);
        }

        .ci-grid {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
        }

        .lp-footer {
            background: #000;
            border-top: 1px solid var(--border);
            padding: 48px 48px 28px;
            text-align: center;
        }

        .foot-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--f);
            margin-bottom: 8px;
        }

        .foot-meta {
            font-size: .78rem;
            color: var(--text-faint);
            margin-bottom: 3px;
        }

        .foot-copy {
            font-size: .76rem;
            color: var(--text-faint);
            margin-top: 16px;
        }

        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 400;
            height: 72px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(22px) saturate(160%);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .brand img {
            height: 38px;
            width: 38px;
            border-radius: 10px;
            object-fit: contain;
            border: 1.5px solid var(--f-mid);
        }

        .brand-fallback {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: .95rem;
            color: var(--text);
        }

        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none;
        }

        .nav-links a {
            padding: 9px 15px;
            border-radius: 8px;
            font-size: .83rem;
            font-weight: 500;
            color: var(--text-soft);
            transition: .25s;
        }

        .nav-links a:hover {
            color: var(--text);
            background: rgba(255, 255, 255, .06);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div id="lp-loader">
        <div class="ld-ring"></div>
        <span class="ld-txt">Loading</span>
    </div>
    <div id="lp-root">
        <div class="lp-page" id="lp-page"></div>
    </div>

    <script>
        var GW = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";
        var FREE_PER_PAGE = 6;
        var PAID_PER_PAGE = 10;
        var ITEMS_PAGE = 1;
        var ALL_ITEMS = [];
        var D = null;
        var SVC_TAB_REGISTRY = {};

        (function () {
            var slug = getSlug();
            if (!slug) { showError("No business page specified."); return; }
            ITEMS_PAGE = getPageNum();
            fetch(GW, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getLandingPage", slug: slug })
            })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.success && res.data) boot(res.data);
                    else showError(res.message || "Page not found.");
                })
                .catch(function () { showError("Connection error. Please try again."); });
        })();

        function getSlug() {
            var p = new URLSearchParams(window.location.search);
            return (p.get("slug") || p.get("page") || "").toUpperCase();
        }
        function getPageNum() {
            return parseInt(new URLSearchParams(window.location.search).get("p")) || 1;
        }

        function hexRgb(h) {
            h = String(h || "#0d0d14").replace("#", "");
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            if (h.length !== 6 || /[^0-9a-f]/i.test(h)) h = "0d0d14";
            return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
        }
        function rgbHex(r, g, b) {
            return "#" + [r, g, b].map(function (v) { return ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join("");
        }
        function mix(a, b, t) { var ca = hexRgb(a), cb = hexRgb(b); return rgbHex(ca.r * t + cb.r * (1 - t), ca.g * t + cb.g * (1 - t), ca.b * t + cb.b * (1 - t)); }
        function darken(h, t) { return mix(h, "#000000", 1 - t); }
        function lighten(h, t) { return mix(h, "#ffffff", t); }
        function rgba(h, a) { var c = hexRgb(h); return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }
        function waLink(num) { return "https://wa.me/" + String(num || "").replace(/\D/g, ""); }

        function applyPalette(h, ht, f) {
            var r = document.documentElement.style;
            r.setProperty("--h", h);
            r.setProperty("--ht", ht);
            r.setProperty("--f", f);
            r.setProperty("--bg", darken(h, .55));
            r.setProperty("--surf", darken(h, .42));
            r.setProperty("--surf2", darken(h, .3));
            r.setProperty("--border", rgba(lighten(h, .3), .14));
            r.setProperty("--text", rgba(ht, .92));
            r.setProperty("--text-soft", rgba(ht, .6));
            r.setProperty("--text-faint", rgba(ht, .35));
            r.setProperty("--f-soft", rgba(f, .12));
            r.setProperty("--f-mid", rgba(f, .32));
            r.setProperty("--f-strong", rgba(f, .55));
        }

        function boot(d) {
            D = d;
            var h = d.colorPrimary || "#0d0d14";
            var ht = d.colorPrimaryText || "#f0f0fa";
            var f = d.isPaid ? (d.colorAccent || "#E07410") : (d.colorAccent || "#E07410");
            if (!d.isPaid) { h = "#0d0d14"; ht = "#f0f0fa"; }
            applyPalette(h, ht, f);
            document.title = d.name + " | Business";

            var maxSvc = d.isPaid ? 8 : 4, maxItem = d.isPaid ? 40 : 15;
            var svcs = buildSvc(d.servicesImages || [], d.servicesDescrip || [], maxSvc);
            svcs.forEach(function (s, i) { s.__id = (d.isPaid ? "p" : "f") + i; });
            ALL_ITEMS = buildItem(d.itemsImages || [], d.itemsDescrip || [], maxItem);

            var tpl = (d.template || (d.isPaid ? "neo" : "free1")).toLowerCase();
            var notice = d.expired ? expiredBanner() : "";
            var html = d.isPaid ? renderPaid(tpl, d, svcs) : renderFree(tpl, d, svcs, notice);

            var page = document.getElementById("lp-page");
            page.innerHTML = html + modalHTML();
            document.getElementById("lp-root").style.display = "block";
            var ldr = document.getElementById("lp-loader");
            ldr.classList.add("out");
            setTimeout(function () { ldr.style.display = "none"; }, 500);

            var itemsTarget = document.getElementById("items-target");
            if (itemsTarget) renderItems();
            initScrollReveal();
            initNavScroll();
            initModal();
        }

        function renderFree(tpl, d, svcs, notice) {
            switch (tpl) {
                case "free2": return free2(d, svcs, notice);
                case "free3": return free3(d, svcs, notice);
                case "free4": return free4(d, svcs, notice);
                case "free5": return free5(d, svcs, notice);
                default: return free1(d, svcs, notice);
            }
        }
        function renderPaid(tpl, d, svcs) {
            var nav = navBar(d);
            switch (tpl) {
                case "cyber": return nav + paidCyber(d, svcs);
                case "quantum": return nav + paidQuantum(d, svcs);
                case "prism": return nav + paidPrism(d, svcs);
                case "matrix": return nav + paidMatrix(d, svcs);
                default: return nav + paidNeo(d, svcs);
            }
        }

        function free1(d, svcs, notice) {
            var hero = "<section id='home' style='min-height:88vh;background:var(--h);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 40px;text-align:center;position:relative;overflow:hidden;'>"
                + "<div style='position:absolute;inset:0;background:radial-gradient(ellipse 55% 42% at 50% 58%,var(--f-soft) 0%,transparent 72%);pointer-events:none;'></div>"
                + logoBlock(d, 78)
                + "<div class='eyebrow ctr'>Official Business</div>"
                + "<h1 style='font-family:Space Grotesk,sans-serif;font-size:clamp(2.4rem,7.5vw,4.6rem);font-weight:800;line-height:.98;color:var(--text);letter-spacing:-.04em;margin-bottom:22px;'>" + esc(d.name) + "</h1>"
                + "<div style='width:64px;height:2px;background:var(--f);margin:0 auto 22px;'></div>"
                + (d.address ? "<p style='max-width:460px;color:var(--text-soft);margin-bottom:36px;'>" + esc(d.address) + "</p>" : "")
                + ctaRow(d, "center")
                + "</section>";
            return hero + notice + svcGrid(svcs) + "<div id='items-target'></div>" + contactSec(d) + adBox() + footerSec(d) + poweredBy();
        }
        function free2(d, svcs, notice) {
            var hero = "<section id='home' style='min-height:88vh;display:grid;grid-template-columns:1fr 1fr;background:var(--h);'>"
                + "<div style='padding:70px 48px;display:flex;flex-direction:column;justify-content:center;'>"
                + logoBlock(d, 62)
                + "<div class='eyebrow'>Professional Services</div>"
                + "<h1 style='font-family:Space Grotesk,sans-serif;font-size:clamp(2.1rem,4.6vw,3.2rem);font-weight:800;line-height:1.05;color:var(--text);letter-spacing:-.02em;margin-bottom:18px;'>" + esc(d.name) + "</h1>"
                + (d.address ? "<p style='color:var(--text-soft);max-width:400px;margin-bottom:32px;'>" + esc(d.address) + "</p>" : "")
                + ctaRow(d, "flex-start") + "</div>"
                + "<div style='background:linear-gradient(160deg,var(--f-soft),var(--surf2));display:flex;align-items:center;justify-content:center;'>"
                + (d.logo ? "<img src='" + esc(d.logo) + "' style='max-height:230px;max-width:68%;object-fit:contain;' onerror=\"this.style.display='none'\">" : "<div style='font-size:90px;opacity:.1;color:var(--text);'>&#9733;</div>")
                + "</div></section>";
            return "<style>@media(max-width:768px){#home{grid-template-columns:1fr!important;}#home>div:last-child{display:none;}}</style>"
                + hero + notice + svcList(svcs) + "<div id='items-target' data-style='grid'></div>" + contactSec(d) + adBox() + footerSec(d) + poweredBy();
        }
        function free3(d, svcs, notice) {
            var hero = "<section id='home' style='min-height:88vh;background:#fdfdfd;display:flex;align-items:center;padding:70px 40px;border-bottom:3px solid var(--f);'>"
                + "<div style='max-width:1080px;margin:0 auto;text-align:center;'>"
                + (d.logo ? "<img src='" + esc(d.logo) + "' style='height:80px;width:80px;border-radius:14px;object-fit:contain;margin:0 auto 30px;box-shadow:0 10px 30px rgba(0,0,0,.1);' onerror=\"this.style.display='none'\">" : "")
                + "<div style='font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--f);font-weight:700;margin-bottom:14px;'>Official Business Page</div>"
                + "<h1 style='font-family:Space Grotesk,sans-serif;font-size:clamp(2.2rem,6.5vw,4.2rem);font-weight:800;color:#111;letter-spacing:-.03em;line-height:1.05;margin-bottom:20px;'>" + esc(d.name) + "</h1>"
                + (d.address ? "<p style='color:#555;max-width:460px;margin:0 auto 34px;'>" + esc(d.address) + "</p>" : "")
                + "<div style='display:flex;gap:12px;justify-content:center;flex-wrap:wrap;'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn' style='background:var(--f);color:#fff;'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn' style='background:#111;color:#fff;'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + "</div></div></section>";

        }

        function renderItems() {
            var target = document.getElementById("items-target");
            if (!target || !ALL_ITEMS.length) {
                if (target) target.remove();
                return;
            }

            // Force grid layout by default
            var style = (target.dataset.style || "grid").toLowerCase();

            var per = D.isPaid ? PAID_PER_PAGE : FREE_PER_PAGE;
            var tot = Math.ceil(ALL_ITEMS.length / per);
            ITEMS_PAGE = Math.max(1, Math.min(ITEMS_PAGE, tot || 1));
            var vis = ALL_ITEMS.slice((ITEMS_PAGE - 1) * per, ITEMS_PAGE * per);

            var inner = "";
            if (style === "table") {
                inner = itemsTableInner(vis);
            } else if (style === "carousel") {
                inner = itemsCarouselInner(vis);
            } else {
                inner = itemsGridInner(vis);   // Default to Grid
            }

            var pager = pagerHtml(tot);

            target.outerHTML =
                "<section class='sec' id='sec-items'>" +
                "<div class='sec-hdr'>" +
                "<div class='eyebrow'>Browse</div>" +
                "<div class='h2'>Products &amp; Items</div>" +
                "<div class='lead'>Tap any item to view full details.</div>" +
                "</div>" +
                inner +
                pager +
                "</section>";

            // Re-attach pagination click handlers
            document.querySelectorAll("[data-pg]").forEach(function (btn) {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    ITEMS_PAGE = parseInt(this.dataset.pg);
                    var url = new URL(window.location);
                    url.searchParams.set("p", ITEMS_PAGE);
                    history.replaceState({}, "", url);
                    reinsertItemsTarget(style);
                    renderItems();
                    document.getElementById("sec-items").scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                });
            });

            initScrollReveal();
        }

        function reinsertItemsTarget(style) {
            var sec = document.getElementById("sec-items");
            if (sec) sec.outerHTML = "<div id='items-target' data-style='" + (style || "grid") + "'></div>";
        }

        function itemsGridInner(items) {
            var cards = items.map(function (it) {
                var short = it.desc.length > 72 ? it.desc.substring(0, 70) + "&hellip;" : it.desc;
                var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                return "<div class='item-card reveal' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + (short ? "<div class='item-desc'>" + esc(short) + "</div>" : "") + "</div></div>";
            }).join("");
            return "<div class='item-grid'>" + cards + "</div>";
        }
        function itemsTableInner(items) {
            var rows = items.map(function (it) {
                var img = it.image ? "<img class='item-row-thumb' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-row-thumb-ph></div>'\">" : "<div class='item-row-thumb-ph'></div>";
                return "<div class='item-row' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div style='flex:1;min-width:0;'><div style='font-weight:700;font-size:.88rem;color:var(--text);'>" + esc(it.name) + "</div><div style='font-size:.76rem;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" + esc(it.desc) + "</div></div>" + (it.price ? "<div style='font-family:Space Grotesk,sans-serif;font-weight:800;color:var(--f);font-size:.95rem;flex-shrink:0;'>" + esc(it.price) + "</div>" : "") + "</div>";
            }).join("");
            return "<div class='item-table'>" + rows + "</div>";
        }
        function itemsCarouselInner(items) {
            var cards = items.map(function (it) {
                var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                return "<div class='item-card' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + "</div></div>";
            }).join("");
            return "<div class='item-carousel'>" + cards + "</div>";
        }
        function pagerHtml(tot) {
            if (tot <= 1) return "";
            var btns = "";
            if (ITEMS_PAGE > 1) btns += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE - 1) + "'>&larr; Prev</button>";
            for (var i = 1; i <= tot; i++) btns += "<button class='pg-btn" + (i === ITEMS_PAGE ? " pg-active" : "") + "' data-pg='" + i + "'>" + i + "</button>";
            if (ITEMS_PAGE < tot) btns += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE + 1) + "'>Next &rarr;</button>";
            return "<div class='pager'>" + btns + "</div>";
        }

        function contactSec(d) {
            var rows = [];
            if (d.phone) rows.push({ ic: "fa-phone", lb: "Phone", v: d.phone, hr: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ ic: "fa-brands fa-whatsapp", lb: "WhatsApp", v: d.whatsapp, hr: waLink(d.whatsapp) });
            if (d.email) rows.push({ ic: "fa-envelope", lb: "Email", v: d.email, hr: "mailto:" + d.email });
            if (d.address) rows.push({ ic: "fa-location-dot", lb: "Address", v: d.address, hr: null });
            if (d.url) rows.push({ ic: "fa-globe", lb: "Website", v: d.url, hr: d.url });
            if (!rows.length) return "";
            var cards = rows.map(function (r) {
                var cls = r.ic.indexOf("fa-brands") !== -1 ? r.ic : "fa-solid " + r.ic;
                var v = r.hr ? "<a href='" + esc(r.hr) + "' target='_blank'>" + esc(r.v) + "</a>" : esc(r.v);
                return "<div class='ci-card reveal'><div class='ci-icon'><i class='" + cls + "'></i></div><div><div class='ci-lbl'>" + r.lb + "</div><div class='ci-val'>" + v + "</div></div></div>";
            }).join("");
            return "<section class='sec' id='sec-contact'><div class='sec-hdr'><div class='eyebrow'>Get In Touch</div><div class='h2'>Contact Us</div><div class='lead'>We&rsquo;re here to help.</div></div><div class='ci-grid'>" + cards + "</div></section>";
        }
        function footerSec(d) {
            return "<footer class='lp-footer'><div class='foot-name'>" + esc(d.name) + "</div>"
                + (d.regNo ? "<div class='foot-meta'>RC: " + esc(d.regNo) + "</div>" : "")
                + (d.address ? "<div class='foot-meta'>" + esc(d.address) + "</div>" : "")
                + "<div class='foot-copy'>&copy; " + new Date().getFullYear() + " " + esc(d.name) + ". All rights reserved.</div></footer>";
        }
        function adBox() { return "<div class='adbox'><span>&#128226;</span>Advertisement Space<br><small>Contact <a href='https://thevictorias.com.ng'>thevictorias.com.ng</a></small></div>"; }
        function expiredBanner() { return "<div class='expnotice'>&#9888; Paid plan expired &mdash; showing free version. <a href='https://thevictorias.com.ng/contact.html' style='color:#ffc107;'>Upgrade &rarr;</a></div>"; }
        function poweredBy() { return "<div class='pwby'>Powered by <a href='https://thevictorias.com.ng' target='_blank'>thevictorias.com.ng</a> &nbsp;|&nbsp; <a href='https://thevictorias.com.ng/contact.html' target='_blank'>Get your own page</a></div>"; }

        function modalHTML() {
            return "<div id='lpModal' style='display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;'>"
                + "<div style='background:var(--surf);border:1px solid var(--border);border-radius:16px;max-width:540px;width:100%;max-height:80vh;overflow-y:auto;padding:34px;position:relative;overflow-x:hidden;'>"
                + "<button onclick='closeLpModal()' style='position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:none;color:var(--text);border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:1rem;'>&times;</button>"
                + "<div id='lpmEy' style='font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--f);margin-bottom:8px;font-weight:700;'></div>"
                + "<h3 id='lpmT' style='font-family:Space Grotesk,sans-serif;font-size:1.2rem;color:var(--text);margin-bottom:8px;padding-right:30px;'></h3>"
                + "<div id='lpmP' style='color:var(--f);font-size:1.1rem;font-weight:800;margin-bottom:12px;'></div>"
                + "<p id='lpmB' style='color:var(--text-soft);line-height:1.75;font-size:.87rem;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;'></p></div></div>";
        }

        function svcList(svcs) {
            if (!svcs.length) return "";

            var rows = svcs.map(function (s, i) {
                var short = s.desc.length > 160
                    ? s.desc.substring(0, 157) + "..."
                    : s.desc;

                var more = s.desc.length > 160
                    ? "<span onclick=\"openLpModal('Service','" + escA(s.title) + "','','" + escA(s.desc) + "')\" style='color:var(--f);font-weight:700;cursor:pointer;'> Read more →</span>"
                    : "";

                var img = s.image
                    ? "<img src='" + esc(s.image) + "' style='width:88px;height:88px;border-radius:12px;object-fit:cover;flex-shrink:0;' loading='lazy' onerror=\"this.style.display='none'\">"
                    : "";

                return "<div class='svc-list-row reveal'>" +
                    "<div class='svc-num'>" + String(i + 1).padStart(2, "0") + "</div>" +
                    "<div style='flex:1; min-width:0; padding-right:16px;'>" +
                    "<h3 style='font-family:Space Grotesk,sans-serif;font-size:1.18rem;font-weight:700;color:var(--text);margin-bottom:10px;'>" +
                    esc(s.title) +
                    "</h3>" +
                    "<p style='font-size:0.88rem;color:var(--text-soft);line-height:1.65;'>" +
                    esc(short) + " " + more +
                    "</p>" +
                    "</div>" +
                    img +
                    "</div>";
            }).join("");

            return "<section class='sec' id='sec-services'>" +
                "<div class='sec-hdr'>" +
                "<div class='eyebrow'>Capabilities</div>" +
                "<div class='h2'>What We Do</div>" +
                "<div class='lead'>A closer look at our core service lines.</div>" +
                "</div>" +
                rows +
                "</section>";
        }

        function initModal() {
            var m = document.getElementById("lpModal");
            if (m) m.addEventListener("click", function (e) { if (e.target === this) closeLpModal(); });
        }
        function openLpModal(ey, t, p, b) {
            document.getElementById("lpmEy").textContent = ey || "";
            document.getElementById("lpmT").textContent = t || "";
            document.getElementById("lpmP").textContent = p || "";
            document.getElementById("lpmB").textContent = b || "";
            var m = document.getElementById("lpModal");
            m.style.display = "flex";
            document.body.style.overflow = "hidden";
        }
        function closeLpModal() {
            var m = document.getElementById("lpModal");
            if (m) { m.style.display = "none"; document.body.style.overflow = ""; }
        }

        function initScrollReveal() {
            var obs = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("in"); });
            }, { threshold: .12 });
            document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { obs.observe(el); });
        }
        function initNavScroll() {
            window.addEventListener("scroll", function () {
                var nav = document.getElementById("lp-nav");
                if (nav) nav.classList.toggle("scrolled", window.scrollY > 30);
            });
        }

        function buildSvc(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), out = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); out.push({ image: imgs[i] || "", title: (p[0] || "Service " + (i + 1)).trim(), desc: (p[1] || "").trim() }); }
            return out;
        }
        function buildItem(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), out = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); out.push({ image: imgs[i] || "", name: (p[0] || "Item " + (i + 1)).trim(), price: (p[1] || "").trim(), desc: (p[2] || "").trim() }); }
            return out;
        }
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
        function escA(s) { return String(s || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, " "); }

        function showError(msg) {
            var ldr = document.getElementById("lp-loader");
            if (ldr) ldr.style.display = "none";
            var r = document.getElementById("lp-root");
            r.style.display = "block";
            document.getElementById("lp-page").innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'><div><div style='font-family:Space Grotesk,sans-serif;font-size:3.6rem;color:rgba(255,255,255,.1);font-weight:800;'>404</div><p style='color:var(--text-soft);margin:16px 0 28px;'>" + esc(msg) + "</p><a href='https://thevictorias.com.ng' style='color:var(--f);font-size:.875rem;'>&larr; The Victorias Ltd</a></div></div>" + poweredBy();
        }
    </script>
</body>

</html>
