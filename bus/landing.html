<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Business Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ── LOADER ── */
        #lp-loader {
            position: fixed;
            inset: 0;
            background: #050510;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 16px;
        }

        .lp-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(0, 212, 255, .15);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #lp-loader p {
            color: rgba(255, 255, 255, .35);
            font-size: .85rem;
            font-family: Inter, sans-serif;
            letter-spacing: 1px;
        }

        #lp-root {
            display: none;
        }

        /* ── RESET ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            color: #e0e0ff;
            overflow-x: hidden;
            background: #050510;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--color-f, #00d4ff);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ── MODAL ── */
        #lp-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lp-modal.open {
            display: flex;
        }

        #lp-modal-box {
            background: #0f0f2e;
            border: 1px solid rgba(0, 212, 255, .3);
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 32px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 212, 255, .12);
        }

        #lp-modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1.1rem;
            cursor: pointer;
            line-height: 1;
        }

        #lp-modal-title {
            color: #fff;
            margin-bottom: 12px;
            font-size: 1.2rem;
            padding-right: 40px;
            font-family: "Space Grotesk", sans-serif;
        }

        #lp-modal-body {
            color: rgba(255, 255, 255, .75);
            line-height: 1.7;
            font-size: .9rem;
            white-space: pre-line;
        }

        #lp-modal-extra {
            margin-top: 16px;
        }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: .9rem;
            cursor: pointer;
            border: none;
            transition: all .25s;
            font-family: Inter, sans-serif;
            text-decoration: none !important;
        }

        .btn-primary {
            background: var(--color-f, #00d4ff);
            color: #000;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--color-ht, #e0e0ff);
            color: var(--color-ht, #e0e0ff);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, .08);
            color: var(--color-ht, #e0e0ff);
            border: 1px solid rgba(255, 255, 255, .15);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 212, 255, .4);
        }

        .cta-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        /* ── NAV ── */
        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 5, 20, .88);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(0, 212, 255, .12);
        }

        .lp-nav .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .lp-nav .brand img {
            height: 38px;
            width: 38px;
            object-fit: contain;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 212, 255, .4);
        }

        .lp-nav .brand span {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 600;
            font-size: 1rem;
            color: var(--color-ht, #e0e0ff);
        }

        .lp-nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .lp-nav-links a {
            color: rgba(224, 224, 255, .7);
            font-size: .875rem;
            letter-spacing: .3px;
            transition: color .2s;
            text-decoration: none !important;
        }

        .lp-nav-links a:hover {
            color: var(--color-f, #00d4ff);
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--color-ht, #e0e0ff);
            font-size: 1.4rem;
            cursor: pointer;
        }

        /* ── SECTIONS ── */
        .lp-section {
            padding: 72px 32px;
            max-width: 1140px;
            margin: 0 auto;
        }

        .section-eyebrow {
            font-size: .72rem;
            color: rgba(255, 255, 255, .3);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .section-title {
            font-family: "Orbitron", sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--color-f, #00d4ff);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .section-divider {
            width: 40px;
            height: 2px;
            background: var(--color-f, #00d4ff);
            border-radius: 1px;
            margin-bottom: 40px;
            box-shadow: 0 0 8px var(--color-f, #00d4ff);
        }

        /* ── SERVICE CARDS ── */
        .services-grid {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .svc-card {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(0, 212, 255, .12);
            border-radius: 14px;
            overflow: hidden;
            transition: all .3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
        }

        .svc-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 212, 255, .4);
            box-shadow: 0 0 30px rgba(0, 212, 255, .12);
        }

        .svc-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .svc-card-ph {
            width: 100%;
            height: 190px;
            background: linear-gradient(135deg, rgba(0, 212, 255, .1), rgba(100, 0, 255, .1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--color-f, #00d4ff);
        }

        .svc-card-body {
            padding: 20px;
        }

        .svc-card-body h3 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .svc-card-body p {
            font-size: .82rem;
            color: rgba(255, 255, 255, .55);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more-btn {
            background: none;
            border: none;
            color: var(--color-f, #00d4ff);
            font-size: .78rem;
            cursor: pointer;
            padding: 0;
            margin-top: 8px;
            font-family: Inter, sans-serif;
        }

        .read-more-btn:hover {
            text-decoration: underline;
        }

        /* ── ITEM CARDS ── */
        .items-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }

        .item-card {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(0, 212, 255, .1);
            border-radius: 12px;
            overflow: hidden;
            transition: all .3s;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 212, 255, .35);
            box-shadow: 0 0 24px rgba(0, 212, 255, .1);
        }

        .item-card img {
            width: 100%;
            height: 165px;
            object-fit: cover;
        }

        .item-card-ph {
            width: 100%;
            height: 165px;
            background: linear-gradient(135deg, rgba(0, 212, 255, .08), rgba(120, 0, 255, .08));
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .2);
            font-size: 2rem;
        }

        .item-card-body {
            padding: 14px;
        }

        .item-name {
            font-weight: 600;
            font-size: .875rem;
            color: #fff;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price {
            color: var(--color-f, #00d4ff);
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(0, 212, 255, .4);
        }

        .item-desc-short {
            font-size: .78rem;
            color: rgba(255, 255, 255, .4);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── PAGINATION ── */
        .pagination {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, .3);
            color: var(--color-f, #00d4ff);
            background: rgba(0, 212, 255, .05);
            cursor: pointer;
            font-size: .85rem;
            transition: all .2s;
            font-family: Inter, sans-serif;
        }

        .page-btn.active,
        .page-btn:hover {
            background: var(--color-f, #00d4ff);
            color: #000;
            box-shadow: 0 0 16px rgba(0, 212, 255, .4);
        }

        /* ── CONTACT ── */
        .contact-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        }

        .contact-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            background: rgba(0, 212, 255, .05);
            border: 1px solid rgba(0, 212, 255, .1);
            padding: 18px;
            border-radius: 12px;
            transition: border-color .2s;
        }

        .contact-item:hover {
            border-color: rgba(0, 212, 255, .3);
        }

        .contact-item i {
            color: var(--color-f, #00d4ff);
            font-size: 1.1rem;
            margin-top: 3px;
            min-width: 18px;
        }

        .ci-label {
            font-size: .7rem;
            color: rgba(255, 255, 255, .3);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 3px;
        }

        .ci-value {
            font-size: .9rem;
            color: rgba(255, 255, 255, .8);
            word-break: break-word;
        }

        /* ── FOOTER ── */
        .lp-footer {
            padding: 40px 32px;
            text-align: center;
            border-top: 1px solid rgba(0, 212, 255, .1);
        }

        .lp-footer .foot-name {
            font-family: "Orbitron", sans-serif;
            font-size: 1.1rem;
            color: var(--color-f, #00d4ff);
            margin-bottom: 12px;
        }

        .lp-footer p {
            font-size: .85rem;
            color: rgba(255, 255, 255, .4);
            margin-top: 4px;
            line-height: 1.6;
        }

        .lp-footer a {
            color: var(--color-f, #00d4ff);
        }

        /* ── POWERED BY ── */
        .powered-by {
            background: #000;
            color: rgba(255, 255, 255, .25);
            text-align: center;
            padding: 10px 24px;
            font-size: .75rem;
        }

        .powered-by a {
            color: var(--color-f, #00d4ff);
        }

        /* ── AD BOX ── */
        .ad-box {
            border: 1px dashed rgba(255, 255, 255, .1);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            color: rgba(255, 255, 255, .2);
            font-size: .82rem;
            margin: 32px 24px;
        }

        .ad-box a {
            color: rgba(0, 212, 255, .4);
        }

        /* ── EXPIRED ── */
        .expired-notice {
            background: rgba(255, 193, 7, .1);
            border: 1px solid rgba(255, 193, 7, .3);
            border-radius: 10px;
            padding: 16px 24px;
            text-align: center;
            margin: 24px;
            font-size: .9rem;
            color: #ffc107;
        }

        /* ── ERROR ── */
        .lp-error {
            text-align: center;
            padding: 80px 24px;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .lp-error .err-code {
            font-family: Orbitron, sans-serif;
            font-size: 6rem;
            color: rgba(0, 212, 255, .15);
            font-weight: 800;
            line-height: 1;
        }

        .lp-error p {
            color: rgba(255, 255, 255, .4);
            margin: 16px 0 24px;
        }

        /* ════════════════════════════════════════
       FREE HERO TEMPLATES
    ════════════════════════════════════════ */
        .lp-hero {
            position: relative;
            overflow: hidden;
            background: var(--color-h, #0a0a1a);
        }

        .hero-logo-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
        }

        .hero-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, .4);
        }

        .hero-eyebrow {
            font-family: Orbitron, sans-serif;
            font-size: .65rem;
            color: rgba(0, 212, 255, .7);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* FREE 1 — NEURAL GLOW */
        .hero-neural {
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-h1-glitch {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(0, 212, 255, .5);
        }

        /* FREE 2 — TERMINAL */
        .hero-terminal {
            background: #000;
            min-height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanline {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .15), rgba(0, 0, 0, .15) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
            z-index: 1;
        }

        .terminal-prefix {
            color: rgba(0, 212, 255, .6);
            font-family: Orbitron, sans-serif;
            font-size: .75rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .terminal-suffix {
            color: rgba(0, 255, 150, .6);
            font-family: Orbitron, sans-serif;
            font-size: .75rem;
            letter-spacing: 2px;
            margin-top: 12px;
        }

        .hero-h1-type {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: #fff;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(0, 212, 255, .4);
        }

        /* FREE 3 — HOLOGRAM RING */
        .hero-holo {
            background: radial-gradient(ellipse at center, #0a0a2e, #000);
            min-height: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .holo-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 212, 255, .2);
            animation: ring-spin linear infinite;
        }

        .r1 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 20s;
        }

        .r2 {
            width: 460px;
            height: 460px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 30s;
            border-color: rgba(120, 0, 255, .2);
        }

        .r3 {
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 45s;
            border-color: rgba(0, 212, 255, .08);
        }

        @keyframes ring-spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .hero-h1-holo {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: #fff;
            font-weight: 800;
            text-shadow: 0 0 40px rgba(0, 212, 255, .6), 0 0 80px rgba(120, 0, 255, .3);
        }

        /* FREE 4 — DATA GRID */
        .hero-grid {
            background: #050510;
            min-height: 520px;
            display: flex;
            align-items: center;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(0, 212, 255, .04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, .04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        .hero-h1-grid {
            font-family: Orbitron, sans-serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: #fff;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(0, 212, 255, .3);
        }

        /* FREE 5 — AURORA */
        .hero-aurora {
            background: #04040f;
            min-height: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .aurora-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: aurora-float ease-in-out infinite;
        }

        .ao1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 212, 255, .25);
            top: -100px;
            left: -80px;
            animation-duration: 10s;
        }

        .ao2 {
            width: 350px;
            height: 350px;
            background: rgba(120, 0, 255, .2);
            bottom: -100px;
            right: -60px;
            animation-duration: 13s;
        }

        .ao3 {
            width: 280px;
            height: 280px;
            background: rgba(0, 255, 180, .15);
            top: 50%;
            left: 50%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        @keyframes aurora-float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-30px) scale(1.05);
            }
        }

        .hero-h1-aurora {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(2rem, 5.5vw, 3.2rem);
            color: #fff;
            font-weight: 700;
            text-shadow: 0 2px 20px rgba(0, 212, 255, .3);
        }

        /* ════════════════════════════════════════
       PAID HERO TEMPLATES
    ════════════════════════════════════════ */

        /* PAID 1 — NEO GLASS */
        .hero-neo {
            min-height: 560px;
            background: var(--color-h, #0a0a1a);
            display: flex;
            align-items: center;
        }

        .neo-glass {
            background: rgba(255, 255, 255, .04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 212, 255, .2);
            border-radius: 24px;
            box-shadow: 0 0 60px rgba(0, 212, 255, .08), inset 0 0 40px rgba(0, 0, 0, .3);
        }

        .neo-logo-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--color-f, #00d4ff), transparent);
        }

        .neo-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: #0a0a1a;
        }

        .neo-h1 {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            color: #fff;
            font-weight: 800;
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(0, 212, 255, .5);
        }

        /* PAID 2 — CYBER SPLIT */
        .hero-cyber {
            background: var(--color-h, #0a0a1a);
            min-height: 500px;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .cyber-left {
            padding: 70px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cyber-tag {
            font-family: Orbitron, sans-serif;
            font-size: .65rem;
            letter-spacing: 3px;
            color: var(--color-f, #00d4ff);
            border: 1px solid var(--color-f, #00d4ff);
            border-radius: 4px;
            padding: 4px 12px;
            display: inline-block;
            margin-bottom: 20px;
            text-shadow: 0 0 8px var(--color-f, #00d4ff);
        }

        .cyber-h1 {
            font-family: Orbitron, sans-serif;
            font-size: clamp(2rem, 4.5vw, 3.2rem);
            color: #fff;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 var(--color-f, #00d4ff);
        }

        .cyber-reg {
            font-family: Orbitron, sans-serif;
            font-size: .7rem;
            color: rgba(255, 255, 255, .3);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .cyber-right {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(0, 212, 255, .08), rgba(100, 0, 255, .08));
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cyber-logo {
            max-height: 240px;
            max-width: 80%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px var(--color-f, #00d4ff));
        }

        .cyber-placeholder {
            font-size: 6rem;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: .4;
            }

            50% {
                opacity: .9;
            }
        }

        .cyber-scan-lines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .06), rgba(0, 0, 0, .06) 1px, transparent 1px, transparent 3px);
            pointer-events: none;
        }

        /* PAID 3 — QUANTUM */
        .hero-quantum {
            background: var(--color-h, #0a0a1a);
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .q-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            animation: aurora-float ease-in-out infinite;
        }

        .q1 {
            width: 500px;
            height: 500px;
            background: rgba(0, 212, 255, .18);
            top: -150px;
            left: -100px;
            animation-duration: 14s;
        }

        .q2 {
            width: 400px;
            height: 400px;
            background: rgba(120, 0, 255, .15);
            bottom: -120px;
            right: -80px;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .q3 {
            width: 300px;
            height: 300px;
            background: rgba(0, 255, 200, .1);
            top: 50%;
            left: 50%;
            animation-duration: 9s;
        }

        .q-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(0, 212, 255, .03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, .03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .q-logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, .4);
            overflow: hidden;
        }

        .q-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .q-badge {
            display: inline-block;
            background: rgba(0, 212, 255, .1);
            border: 1px solid rgba(0, 212, 255, .3);
            border-radius: 30px;
            padding: 6px 20px;
            font-family: Orbitron, sans-serif;
            font-size: .65rem;
            letter-spacing: 2px;
            color: var(--color-f, #00d4ff);
            margin-bottom: 16px;
        }

        .q-h1 {
            font-family: Orbitron, sans-serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            color: #fff;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 0 40px rgba(0, 212, 255, .4);
        }

        /* PAID 4 — PRISM */
        .hero-prism {
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prism-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #0a001f, #001a2e, #0a0a1a);
        }

        .prism-logo {
            height: 88px;
            width: 88px;
            object-fit: contain;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, .1), 0 0 40px rgba(0, 212, 255, .3);
        }

        .prism-h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(2rem, 5.5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.15;
            background: linear-gradient(135deg, #fff, var(--color-f, #00d4ff), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* PAID 5 — MATRIX */
        .hero-matrix {
            background: #000;
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .matrix-logo-ring {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 100, .4);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 100, .2);
        }

        .matrix-logo-ring img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .matrix-h1 {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: #00ff64;
            font-weight: 800;
            text-shadow: 0 0 20px rgba(0, 255, 100, .5);
            margin-bottom: 8px;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content,
        .neo-glass {
            animation: fadeInUp .8s ease both;
        }

        /* ── MOBILE ── */
        @media(max-width:640px) {
            .lp-nav-links {
                display: none;
                flex-direction: column;
                position: fixed;
                top: 64px;
                left: 0;
                right: 0;
                background: rgba(5, 5, 20, .97);
                backdrop-filter: blur(20px);
                padding: 24px 32px;
                gap: 20px;
                border-bottom: 1px solid rgba(0, 212, 255, .15);
            }

            .lp-nav-links.open {
                display: flex;
            }

            .nav-toggle {
                display: block;
            }

            .lp-section {
                padding: 48px 20px;
            }

            .lp-nav {
                padding: 0 20px;
            }

            .hero-cyber {
                grid-template-columns: 1fr !important;
            }

            .cyber-right {
                display: none !important;
            }

            .cyber-left {
                padding: 50px 24px !important;
            }
        }
    </style>
</head>

<body>

    <!-- LOADER -->
    <div id="lp-loader">
        <div class="lp-spinner"></div>
        <p>LOADING PAGE…</p>
    </div>

    <!-- MODAL -->
    <div id="lp-modal">
        <div id="lp-modal-box">
            <button id="lp-modal-close">✕</button>
            <h3 id="lp-modal-title"></h3>
            <p id="lp-modal-body"></p>
            <div id="lp-modal-extra"></div>
        </div>
    </div>

    <!-- PAGE ROOT -->
    <div id="lp-root"></div>

    <script>
        // ── CONFIG ─────────────────────────────────────────────────
        var GATEWAY_URL = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";
        var FREE_MAX_SVC = 2;
        var FREE_MAX_ITEMS = 6;
        var PAID_MAX_SVC = 8;
        var PAID_MAX_ITEMS = 30;
        var PAID_PER_PAGE = 10;

        // ── MODAL ──────────────────────────────────────────────────
        document.getElementById("lp-modal-close").onclick = closeModal;
        document.getElementById("lp-modal").addEventListener("click", function (e) {
            if (e.target === this) closeModal();
        });
        function openModal(title, body, extraHtml) {
            document.getElementById("lp-modal-title").textContent = title;
            document.getElementById("lp-modal-body").textContent = body;
            document.getElementById("lp-modal-extra").innerHTML = extraHtml || "";
            document.getElementById("lp-modal").classList.add("open");
            document.body.style.overflow = "hidden";
        }
        function closeModal() {
            document.getElementById("lp-modal").classList.remove("open");
            document.body.style.overflow = "";
        }

        // ── SLUG / PAGE FROM URL ────────────────────────────────────
        function getSlug() {
            var p = new URLSearchParams(window.location.search);
            var s = p.get("slug") || p.get("business") || p.get("page");
            if (!s && window.location.hash) s = window.location.hash.replace(/^#\/?/, "");
            return s ? s.toUpperCase() : "";
        }
        function getPageNum() {
            return parseInt(new URLSearchParams(window.location.search).get("p")) || 1;
        }

        // ── INIT ───────────────────────────────────────────────────
        (function () {
            var slug = getSlug();
            if (!slug) { renderError("No business page specified."); return; }
            fetchPage(slug, getPageNum());
        })();

        function fetchPage(slug, page) {
            fetch(GATEWAY_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getLandingPage", slug: slug, page: page })
            })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.success && res.data) renderPage(res.data, page);
                    else renderError(res.message || "Page not found.");
                })
                .catch(function () { renderError("Connection error. Please try again."); });
        }

        // ── RENDER ────────────────────────────────────────────────
        function renderPage(d, page) {
            // Apply CSS vars
            var h = (d.colourHeader || d.colours && d.colours[0]) || "#0a0a1a";
            var ht = (d.colourHeaderText || d.colours && d.colours[1]) || "#e0e0ff";
            var f = (d.colourFooter || d.colours && d.colours[2]) || "#00d4ff";

            if (!d.isPaid) { h = "#0a0a1a"; ht = "#e0e0ff"; f = "#00d4ff"; }

            var root = document.documentElement;
            root.style.setProperty("--color-h", h);
            root.style.setProperty("--color-ht", ht);
            root.style.setProperty("--color-f", f);

            document.title = d.name + " | Business Page";

            var maxSvc = d.isPaid ? PAID_MAX_SVC : FREE_MAX_SVC;
            var maxItem = d.isPaid ? PAID_MAX_ITEMS : FREE_MAX_ITEMS;
            var services = buildServices(d.servicesImages || [], d.servicesDescrip || [], maxSvc);
            var items = buildItems(d.itemsImages || [], d.itemsDescrip || [], maxItem);

            var html = d.isPaid
                ? renderPaid(d, services, items, page)
                : renderFree(d, services, items);

            var el = document.getElementById("lp-root");
            el.innerHTML = html;
            el.style.display = "block";
            document.getElementById("lp-loader").style.display = "none";

            // Start canvas animations
            startNeuralCanvas();
            startMatrixCanvas();

            // Bind pagination
            bindPagination(d, items);
        }

        // ── FREE RENDER ───────────────────────────────────────────
        function renderFree(d, services, items) {
            var tpl = (d.template || "").toLowerCase();
            var heroFns = {
                "free1": freeHeroNeural, "free2": freeHeroTerminal,
                "free3": freeHeroHolo, "free4": freeHeroGrid,
                "free5": freeHeroAurora
            };
            var heroFn = heroFns[tpl] || freeHeroNeural;
            return [
                d.expired ? expiredBanner() : "",
                heroFn(d),
                servicesSection(services),
                "<div id='items-section'>" + buildItemsHTML(items, false, 1) + "</div>",
                contactSection(d),
                adBox(),
                footerSection(d),
                poweredBy()
            ].join("");
        }

        // ── PAID RENDER ───────────────────────────────────────────
        function renderPaid(d, services, items, page) {
            var tpl = (d.template || "neo").toLowerCase();
            var heroFns = {
                "neo": paidHeroNeo, "paid1": paidHeroNeo,
                "cyber": paidHeroCyber, "paid2": paidHeroCyber,
                "quantum": paidHeroQuantum, "paid3": paidHeroQuantum,
                "prism": paidHeroPrism, "paid4": paidHeroPrism,
                "matrix": paidHeroMatrix, "paid5": paidHeroMatrix,
                // Legacy 3 templates — map to closest equivalent
                "modern": paidHeroNeo,
                "bold": paidHeroCyber,
                "minimal": paidHeroPrism
            };
            var heroFn = heroFns[tpl] || paidHeroNeo;
            return [
                navHtml(d),
                heroFn(d),
                servicesSection(services),
                "<div id='items-section'>" + buildItemsHTML(items, true, page) + "</div>",
                contactSection(d),
                footerSection(d),
                poweredBy()
            ].join("");
        }

        // ══════════════════════════════════════════════════════════
        // FREE HERO BUILDERS
        // ══════════════════════════════════════════════════════════
        function freeHeroNeural(d) {
            return "<section class='lp-hero hero-neural' id='home'>" +
                "<canvas id='neural-canvas' style='position:absolute;inset:0;width:100%;height:100%;opacity:.35;'></canvas>" +
                "<div class='hero-content' style='position:relative;z-index:2;text-align:center;padding:80px 24px;'>" +
                logoWrap(d.logo) +
                "<div class='hero-eyebrow'>Powered by Intelligence</div>" +
                "<h1 class='hero-h1-glitch'>" + esc(d.name) + "</h1>" +
                (d.regNo ? "<div style='color:rgba(255,255,255,.3);font-size:.75rem;margin-bottom:16px;'>Reg: " + esc(d.regNo) + "</div>" : "") +
                "<div class='cta-row'>" + ctaBtns(d) + "</div>" +
                "</div></section>";
        }

        function freeHeroTerminal(d) {
            return "<section class='lp-hero hero-terminal' id='home'>" +
                "<div class='scanline'></div>" +
                "<div class='hero-content' style='position:relative;z-index:2;text-align:center;padding:80px 24px;'>" +
                logoWrap(d.logo) +
                "<div class='terminal-prefix'>&gt; INITIALIZING ENTITY //</div>" +
                "<h1 class='hero-h1-type'>" + esc(d.name) + "</h1>" +
                "<div class='terminal-suffix'>&gt; STATUS: ONLINE ✓</div>" +
                "<div class='cta-row' style='margin-top:32px;'>" + ctaBtns(d) + "</div>" +
                "</div></section>";
        }

        function freeHeroHolo(d) {
            return "<section class='lp-hero hero-holo' id='home'>" +
                "<div class='holo-ring r1'></div><div class='holo-ring r2'></div><div class='holo-ring r3'></div>" +
                "<div class='hero-content' style='position:relative;z-index:2;text-align:center;padding:80px 24px;'>" +
                logoWrap(d.logo) +
                "<h1 class='hero-h1-holo'>" + esc(d.name) + "</h1>" +
                (d.address ? "<p style='color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:24px;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row'>" + ctaBtns(d) + "</div>" +
                "</div></section>";
        }

        function freeHeroGrid(d) {
            return "<section class='lp-hero hero-grid' id='home'>" +
                "<div class='grid-overlay'></div>" +
                "<div class='hero-content' style='position:relative;z-index:2;text-align:left;padding:80px 40px;max-width:700px;'>" +
                "<div class='hero-eyebrow'>// DIGITAL PRESENCE</div>" +
                logoWrap(d.logo, "margin:0 0 20px;border-radius:12px;") +
                "<h1 class='hero-h1-grid'>" + esc(d.name) + "</h1>" +
                (d.regNo ? "<div style='color:rgba(0,212,255,.5);font-size:.8rem;font-family:Orbitron,sans-serif;margin-bottom:20px;'>REG: " + esc(d.regNo) + "</div>" : "") +
                "<div class='cta-row' style='justify-content:flex-start;'>" + ctaBtns(d) + "</div>" +
                "</div></section>";
        }

        function freeHeroAurora(d) {
            return "<section class='lp-hero hero-aurora' id='home'>" +
                "<div class='aurora-orb ao1'></div><div class='aurora-orb ao2'></div><div class='aurora-orb ao3'></div>" +
                "<div class='hero-content' style='position:relative;z-index:2;text-align:center;padding:90px 24px;'>" +
                logoWrap(d.logo) +
                "<h1 class='hero-h1-aurora'>" + esc(d.name) + "</h1>" +
                (d.address ? "<p style='color:rgba(255,255,255,.55);max-width:480px;margin:12px auto 28px;line-height:1.6;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row'>" + ctaBtns(d) + "</div>" +
                "</div></section>";
        }

        // ══════════════════════════════════════════════════════════
        // PAID HERO BUILDERS
        // ══════════════════════════════════════════════════════════
        function paidHeroNeo(d) {
            return "<section class='lp-hero hero-neo' id='home'>" +
                "<canvas id='neural-canvas' style='position:absolute;inset:0;width:100%;height:100%;opacity:.4;'></canvas>" +
                "<div class='neo-glass' style='position:relative;z-index:2;max-width:800px;width:90%;margin:0 auto;padding:60px;text-align:center;'>" +
                (d.logo ? "<div class='neo-logo-wrap'><img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.parentElement.style.display='none'\"></div>" : "") +
                "<div class='hero-eyebrow'>Next-Generation Digital Solutions</div>" +
                "<h1 class='neo-h1'>" + esc(d.name) + "</h1>" +
                (d.address ? "<p style='color:rgba(255,255,255,.5);margin-bottom:24px;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row'>" + ctaBtns(d, true) + "</div>" +
                "</div></section>";
        }

        function paidHeroCyber(d) {
            return "<section class='lp-hero hero-cyber' id='home'>" +
                "<div class='cyber-left'>" +
                "<div class='cyber-tag'>SYSTEM::ONLINE</div>" +
                "<h1 class='cyber-h1'>" + esc(d.name) + "</h1>" +
                (d.regNo ? "<div class='cyber-reg'>" + esc(d.regNo) + "</div>" : "") +
                (d.address ? "<p style='color:rgba(255,255,255,.5);margin-bottom:28px;line-height:1.6;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row' style='justify-content:flex-start;'>" + ctaBtns(d, true) + "</div>" +
                "</div>" +
                "<div class='cyber-right'>" +
                (d.logo ? "<img src='" + esc(d.logo) + "' alt='logo' class='cyber-logo' onerror=\"this.style.display='none'\">" : "<div class='cyber-placeholder'>⚡</div>") +
                "<div class='cyber-scan-lines'></div>" +
                "</div></section>";
        }

        function paidHeroQuantum(d) {
            return "<section class='lp-hero hero-quantum' id='home'>" +
                "<div class='q-orb q1'></div><div class='q-orb q2'></div><div class='q-orb q3'></div>" +
                "<div class='q-grid'></div>" +
                "<div style='position:relative;z-index:2;max-width:720px;margin:0 auto;padding:90px 32px;text-align:center;'>" +
                (d.logo ? "<div class='q-logo'><img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.parentElement.style.display='none'\"></div>" : "") +
                "<div class='q-badge'>QUANTUM AI SOLUTIONS</div>" +
                "<h1 class='q-h1'>" + esc(d.name) + "</h1>" +
                (d.address ? "<p style='color:rgba(255,255,255,.45);margin:12px 0 28px;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row'>" + ctaBtns(d, true) + "</div>" +
                "</div></section>";
        }

        function paidHeroPrism(d) {
            return "<section class='lp-hero hero-prism' id='home'>" +
                "<div class='prism-bg'></div>" +
                "<div style='position:relative;z-index:2;max-width:760px;margin:0 auto;padding:100px 32px 80px;text-align:center;'>" +
                (d.logo ? "<img src='" + esc(d.logo) + "' alt='logo' class='prism-logo' onerror=\"this.style.display='none'\">" : "") +
                "<h1 class='prism-h1'>" + esc(d.name) + "</h1>" +
                (d.regNo ? "<div style='color:rgba(255,255,255,.3);font-size:.78rem;font-family:Orbitron,sans-serif;margin-bottom:20px;'>" + esc(d.regNo) + "</div>" : "") +
                (d.address ? "<p style='color:rgba(255,255,255,.5);margin-bottom:28px;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row'>" + ctaBtns(d, true) + "</div>" +
                "</div></section>";
        }

        function paidHeroMatrix(d) {
            return "<section class='lp-hero hero-matrix' id='home'>" +
                "<canvas id='matrix-canvas' style='position:absolute;inset:0;width:100%;height:100%;opacity:.25;'></canvas>" +
                "<div style='position:relative;z-index:2;max-width:800px;margin:0 auto;padding:90px 32px;text-align:center;'>" +
                (d.logo ? "<div class='matrix-logo-ring'><img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.parentElement.style.display='none'\"></div>" : "") +
                "<div style='font-family:Orbitron,sans-serif;font-size:.7rem;color:rgba(0,255,100,.6);letter-spacing:3px;margin-bottom:16px;'>INITIALIZING SYSTEM_v2.0</div>" +
                "<h1 class='matrix-h1'>" + esc(d.name) + "</h1>" +
                (d.address ? "<p style='color:rgba(255,255,255,.45);margin:12px 0 28px;'>" + esc(d.address) + "</p>" : "") +
                "<div class='cta-row'>" + ctaBtnsMatrix(d) + "</div>" +
                "</div></section>";
        }

        // ══════════════════════════════════════════════════════════
        // SHARED COMPONENTS
        // ══════════════════════════════════════════════════════════
        function navHtml(d) {
            var links = [
                { href: "#home", label: "Home" },
                { href: "#services", label: "Services" },
                { href: "#items", label: "Products" },
                { href: "#contact", label: "Contact" }
            ];
            return "<nav class='lp-nav'>" +
                "<div class='brand'>" +
                (d.logo ? "<img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.style.display='none'\">" : "") +
                "<span>" + esc(d.name) + "</span></div>" +
                "<button class='nav-toggle' onclick=\"document.getElementById('lp-nav-links').classList.toggle('open')\">&#9776;</button>" +
                "<ul class='lp-nav-links' id='lp-nav-links'>" +
                links.map(function (l) { return "<li><a href='" + l.href + "'>" + l.label + "</a></li>"; }).join("") +
                "</ul></nav>";
        }

        function logoWrap(src, extraStyle) {
            if (!src) return "";
            return "<div class='hero-logo-wrap' style='" + (extraStyle || "") + "'>" +
                "<img src='" + esc(src) + "' alt='logo' class='hero-logo' onerror=\"this.parentElement.style.display='none'\">" +

        function servicesSection(services) {
            if (!services.length) return "";
            var cards = services.map(function (s) {
                var shortDesc = s.desc.length > 100 ? s.desc.substring(0, 100) + "…" : s.desc;
                var moreBtn = s.desc.length > 100
                    ? "<button class='read-more-btn' onclick='openModal(" + JSON.stringify(s.title) + "," + JSON.stringify(s.desc) + ",\"\")'>Read more →</button>"
                    : "";
                return "<div class='svc-card'>" +
                    (s.image ? "<img src='" + esc(s.image) + "' alt='" + esc(s.title) + "' loading='lazy' onerror=\"this.parentElement.innerHTML='<div class=svc-card-ph>⚙</div>'+this.parentElement.innerHTML.replace(this.outerHTML,'')\">" : "<div class='svc-card-ph'>⚙</div>") +
                    "<div class='svc-card-body'><h3>" + esc(s.title) + "</h3>" +
                    (s.desc ? "<p>" + esc(shortDesc) + "</p>" + moreBtn : "") +
                    "</div></div>";
            }).join("");
            return "<section class='lp-section' id='services'>" +
                "<div class='section-eyebrow'>What We Do</div>" +
                "<div class='section-title'>Our Services</div>" +
                "<div class='section-divider'></div>" +
                "<div class='services-grid'>" + cards + "</div></section>";
        }

        function buildItemsHTML(items, isPaid, page) {
            if (!items.length) return "";
            var perPage = isPaid ? PAID_PER_PAGE : FREE_MAX_ITEMS;
            var total = Math.max(1, Math.ceil(items.length / perPage));
            page = Math.max(1, Math.min(page, total));
            var visible = items.slice((page - 1) * perPage, page * perPage);

            var cards = visible.map(function (it) {
                var shortDesc = it.desc.length > 80 ? it.desc.substring(0, 80) + "…" : it.desc;
                var hasDetail = it.desc.length > 80 || it.price;
                var clickAttr = hasDetail
                    ? "onclick='openModal(" + JSON.stringify(it.name) + "," + JSON.stringify(it.desc) + "," +
                    "\"<div style=\\\"color:var(--color-f);font-size:1.3rem;font-weight:700;margin-top:8px;\\\">" + esc(it.price) + "</div>\")'"
                    : "";
                return "<div class='item-card' " + clickAttr + ">" +
                    (it.image ? "<img src='" + esc(it.image) + "' alt='" + esc(it.name) + "' loading='lazy' onerror=\"this.parentElement.querySelector('.item-no-img') && (this.style.display='none')\">" : "") +
                    (!it.image ? "<div class='item-card-ph'>🖼</div>" : "") +
                    "<div class='item-card-body'>" +
                    "<div class='item-name'>" + esc(it.name) + "</div>" +
                    (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") +
                    (it.desc ? "<div class='item-desc-short'>" + esc(shortDesc) + "</div>" : "") +
                    "</div></div>";
            }).join("");

            var pager = "";
            if (total > 1) {
                var btns = "";
                if (page > 1) btns += "<button class='page-btn' data-page='" + (page - 1) + "'>← Prev</button>";
                for (var i = 1; i <= total; i++) {
                    btns += "<button class='page-btn" + (i === page ? " active" : "") + "' data-page='" + i + "'>" + i + "</button>";
                }
                if (page < total) btns += "<button class='page-btn' data-page='" + (page + 1) + "'>Next →</button>";
                pager = "<div class='pagination'>" + btns + "</div>";
            }

            return "<section class='lp-section' id='items'>" +
                "<div class='section-eyebrow'>Browse</div>" +
                "<div class='section-title'>Products &amp; Items</div>" +
                "<div class='section-divider'></div>" +
                "<div class='items-grid'>" + cards + "</div>" +
                pager + "</section>";
        }

        function contactSection(d) {
            var rows = [];
            if (d.phone) rows.push({ cls: "fa-solid", icon: "fa-phone", label: "Phone", val: d.phone, href: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ cls: "fa-brands", icon: "fa-whatsapp", label: "WhatsApp", val: d.whatsapp, href: "https://wa.me/" + d.whatsapp.replace(/\D/g, "") });
            if (d.email) rows.push({ cls: "fa-solid", icon: "fa-envelope", label: "Email", val: d.email, href: "mailto:" + d.email });
            if (d.address) rows.push({ cls: "fa-solid", icon: "fa-location-dot", label: "Address", val: d.address, href: null });
            if (d.url) rows.push({ cls: "fa-solid", icon: "fa-globe", label: "Website", val: d.url, href: d.url });
            if (!rows.length) return "";

        function adBox() {

                "Advertisement Space<br><small>Contact <a href='https://thevictorias.com.ng'>thevictorias.com.ng</a></small></div>";

        function poweredBy() {

                " &nbsp;|&nbsp; <a href='https://thevictorias.com.ng/contact.html' target='_blank'>Get your own page</a></div>";

        // ── PAGINATION BINDING ────────────────────────────────────
        var _currentData = null;
        var _currentItems = null;

        function bindPagination(d, items) {
            _currentData = d;
            _currentItems = items;
            document.querySelectorAll("[data-page]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var pg = parseInt(this.dataset.page);
                    var sec = document.getElementById("items-section");
                    if (sec) {
                        sec.innerHTML = buildItemsHTML(_currentItems, _currentData.isPaid, pg);
                        bindPagination(_currentData, _currentItems);
                        sec.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                });
            });
        }

        // ── DATA BUILDERS ─────────────────────────────────────────
        function buildServices(images, descrips, limit) {
            var total = Math.min(Math.max(images.length, descrips.length), limit);
            var out = [];
            for (var i = 0; i < total; i++) {
                var p = (descrips[i] || "").split("::");
                out.push({ image: images[i] || "", title: p[0] || "Service " + (i + 1), desc: p[1] || "" });
            }
            return out;
        }
        function buildItems(images, descrips, limit) {
            var total = Math.min(Math.max(images.length, descrips.length), limit);
            var out = [];
            for (var i = 0; i < total; i++) {
                var p = (descrips[i] || "").split("::");
                out.push({ image: images[i] || "", name: p[0] || "Item " + (i + 1), price: p[1] || "", desc: p[2] || "" });
            }
            return out;
        }

        // ── CANVAS: NEURAL PARTICLES ──────────────────────────────
        function startNeuralCanvas() {
            var c = document.getElementById("neural-canvas");
            if (!c) return;
            var ctx = c.getContext("2d");
            var dots = [];
            function resize() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
            resize();
            window.addEventListener("resize", resize);
            for (var i = 0; i < 70; i++) {
                dots.push({
                    x: Math.random() * c.width, y: Math.random() * c.height,
                    vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5,
                    r: Math.random() * 1.5 + 1
                });
            }
            function draw() {
                ctx.clearRect(0, 0, c.width, c.height);
                dots.forEach(function (d, i) {
                    d.x += d.vx; d.y += d.vy;
                    if (d.x < 0 || d.x > c.width) d.vx *= -1;
                    if (d.y < 0 || d.y > c.height) d.vy *= -1;
                    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(0,212,255,.7)"; ctx.fill();
                    dots.forEach(function (d2, j) {
                        if (j <= i) return;
                        var dx = d.x - d2.x, dy = d.y - d2.y, dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 120) {
                            ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y);
                            ctx.strokeStyle = "rgba(0,212,255," + (1 - dist / 120) * .3 + ")";
                            ctx.lineWidth = .5; ctx.stroke();
                        }
                    });
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ── CANVAS: MATRIX RAIN ───────────────────────────────────
        function startMatrixCanvas() {
            var c = document.getElementById("matrix-canvas");
            if (!c) return;
            var ctx = c.getContext("2d");
            var drops;
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()";
            function resize() {
                c.width = c.offsetWidth; c.height = c.offsetHeight;
                drops = Array(Math.floor(c.width / 14)).fill(1);
            }
            resize();
            window.addEventListener("resize", resize);
            function draw() {
                ctx.fillStyle = "rgba(0,0,0,.05)"; ctx.fillRect(0, 0, c.width, c.height);
                ctx.fillStyle = "#00ff64"; ctx.font = "13px monospace";
                drops.forEach(function (d, i) {
                    var ch = chars[Math.floor(Math.random() * chars.length)];
                    ctx.fillText(ch, i * 14, d * 14);
                    if (d * 14 > c.height && Math.random() > .975) drops[i] = 0;
                    drops[i]++;
                });
                requestAnimationFrame(draw);
            }
            draw();
        }

        // ── UTILS ─────────────────────────────────────────────────
        function esc(s) {
            return String(s || "")
                .replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }
    </script>
