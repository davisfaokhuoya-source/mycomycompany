<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #09090f;
            --ink2: #111118;
            --ink3: #1a1a24;
            --amber: #E07410;
            --amber2: #f88c20;
            --cream: #f0f0fa;
            --muted: rgba(240, 240, 250, .56);
            --faint: rgba(240, 240, 250, .24);
            --border: rgba(255, 255, 255, .08);
            --a-soft: rgba(224, 116, 16, .10);
            --a-mid: rgba(224, 116, 16, .32);
            --a-glow: rgba(224, 116, 16, .18);
            --radius: 14px;
            --nav-h: 68px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000;
            color: var(--cream);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--amber);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #lp-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .5s;
        }

        #lp-loader.out {
            opacity: 0;
            pointer-events: none;
        }

        .ld-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .08);
            border-top-color: var(--amber);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ld-txt {
            font-size: .75rem;
            color: var(--muted);
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        #lp-root {
            display: none;
        }

        .lp-page {
            width: 100%;
            background: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* NAV */
        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 400;
            height: var(--nav-h);
            background: rgba(9, 9, 15, .92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 48px;
            justify-content: space-between;
            transition: border-color .3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            height: 36px;
            width: 36px;
            border-radius: 9px;
            object-fit: contain;
            border: 1.5px solid var(--a-mid);
        }

        .brand-fallback {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--amber);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: .95rem;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: .9rem;
            color: var(--cream);
        }

        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none;
        }

        .nav-links a {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 500;
            color: var(--muted);
            transition: .2s;
        }

        .nav-links a:hover {
            color: var(--cream);
            background: rgba(255, 255, 255, .06);
            text-decoration: none;
        }

        .nav-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 22px;
            border-radius: 10px;
            font-size: .83rem;
            font-weight: 600;
            background: var(--amber);
            color: #fff;
            transition: .25s;
            white-space: nowrap;
        }

        .nav-cta:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
        }

        @media(max-width:768px) {
            .lp-nav {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-h);
                left: 0;
                right: 0;
                background: var(--ink2);
                flex-direction: column;
                padding: 12px 20px;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-toggle {
                display: block;
            }
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .86rem;
            cursor: pointer;
            border: none;
            transition: all .28s;
            white-space: nowrap;
            font-family: 'Outfit', sans-serif;
        }

        .btn-p {
            background: var(--amber);
            color: #fff;
            box-shadow: 0 8px 28px var(--a-mid);
        }

        .btn-p:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            text-decoration: none;
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .22);
            color: var(--cream);
        }

        .btn-o:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .btn-g {
            background: rgba(255, 255, 255, .06);
            color: var(--cream);
            border: 1px solid var(--border);
        }

        .btn-g:hover {
            background: rgba(255, 255, 255, .1);
            transform: translateY(-2px);
            text-decoration: none;
        }

        /* EYEBROW */
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--amber);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .eyebrow::before {
            content: '';
            width: 20px;
            height: 1.5px;
            background: var(--amber);
        }

        /* CONTENT WIDTHS */
        .content-wrap-svc {
            width: 75%;
            margin: 0 auto;
        }

        .content-wrap-item {
            width: 60%;
            margin: 0 auto;
        }

        @media(max-width:1200px) {
            .content-wrap-svc {
                width: 90%;
            }

            .content-wrap-item {
                width: 80%;
            }
        }

        @media(max-width:768px) {

            .content-wrap-svc,
            .content-wrap-item {
                width: 100%;
                padding: 0 20px;
            }
        }

        /* SECTION */
        .sec {
            padding: 96px 0;
        }

        @media(max-width:768px) {
            .sec {
                padding: 64px 0;
            }
        }

        .sec-hdr {
            margin-bottom: 52px;
        }

        .h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            color: var(--cream);
            letter-spacing: -.02em;
            line-height: 1.08;
            margin-bottom: 12px;
        }

        .lead {
            font-size: .94rem;
            color: var(--muted);
            line-height: 1.78;
        }

        /* SERVICES GRID */
        .svc-grid-paid {
            display: grid;
            gap: 22px;
            grid-template-columns: repeat(4, 1fr);
        }

        .svc-grid-free {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(3, 1fr);
        }

        @media(max-width:1100px) {
            .svc-grid-paid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:900px) {
            .svc-grid-free {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:640px) {

            .svc-grid-paid,
            .svc-grid-free {
                grid-template-columns: 1fr;
            }
        }

        .svc-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            width: 100%;
            transition: transform .32s, border-color .32s, box-shadow .32s;
        }

        .svc-card:hover {
            transform: translateY(-6px);
            border-color: rgba(224, 116, 16, .3);
            box-shadow: 0 20px 48px -16px rgba(0, 0, 0, .6);
        }

        .svc-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .svc-img-ph {
            width: 100%;
            height: 170px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--a-mid);
        }

        .svc-body {
            padding: 18px 20px 22px;
        }

        .svc-body h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 7px;
        }

        .svc-body p {
            font-size: .82rem;
            color: var(--muted);
            line-height: 1.65;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            font-size: .77rem;
            font-weight: 600;
            color: var(--amber);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        /* ITEMS GRID */
        .item-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        @media(max-width:640px) {
            .item-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        @media(max-width:420px) {
            .item-grid {
                grid-template-columns: 1fr;
            }
        }

        .item-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .3s, border-color .3s;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(224, 116, 16, .26);
        }

        .item-img {
            width: 100%;
            height: 158px;
            object-fit: cover;
        }

        .item-img-ph {
            width: 100%;
            height: 158px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--faint);
        }

        .item-body {
            padding: 14px 16px 14px;
        }

        .item-name {
            font-weight: 600;
            font-size: .86rem;
            color: var(--cream);
            margin-bottom: 5px;
        }

        .item-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: .98rem;
            color: var(--amber);
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: .75rem;
            color: var(--muted);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 10px;
        }

        .item-wa-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            padding: 9px 0;
            background: rgba(37, 211, 102, .12);
            border: 1px solid rgba(37, 211, 102, .25);
            border-radius: 8px;
            font-size: .78rem;
            font-weight: 600;
            color: #25d366;
            cursor: pointer;
            transition: .22s;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
        }

        .item-wa-btn:hover {
            background: rgba(37, 211, 102, .22);
            border-color: rgba(37, 211, 102, .45);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .item-wa-btn i {
            font-size: .9rem;
        }

        /* PAGER */
        .pager {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 42px;
            flex-wrap: wrap;
        }

        .pg-btn {
            padding: 9px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            background: var(--ink2);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: .2s;
            font-family: 'Outfit', sans-serif;
        }

        .pg-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .pg-btn.pg-active {
            background: var(--amber);
            border-color: var(--amber);
            color: #fff;
        }

        /* CONTACT */
        .contact-section {
            padding: 96px 48px;
            background: var(--ink);
        }

        @media(max-width:768px) {
            .contact-section {
                padding: 64px 20px;
            }
        }

        .contact-inner {
            max-width: 960px;
            margin: 0 auto;
        }

        .ci-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(3, 1fr);
        }

        @media(max-width:900px) {
            .ci-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:540px) {
            .ci-grid {
                grid-template-columns: 1fr;
            }
        }

        .ci-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: .25s;
            min-width: 0;
        }

        .ci-card:hover {
            border-color: rgba(224, 116, 16, .28);
        }

        .ci-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber);
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .ci-lbl {
            font-size: .66rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .ci-val {
            font-size: .88rem;
            font-weight: 600;
            color: var(--cream);
            word-break: break-all;
            line-height: 1.4;
        }

        /* FOOTER */
        .lp-footer {
            background: #000;
            border-top: 1px solid rgba(255, 255, 255, .05);
            padding: 52px 48px 30px;
            text-align: center;
        }

        @media(max-width:768px) {
            .lp-footer {
                padding: 40px 20px 24px;
            }
        }

        .foot-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--amber);
            margin-bottom: 8px;
        }

        .foot-meta {
            font-size: .76rem;
            color: var(--faint);
            margin-bottom: 3px;
        }

        .foot-copy {
            font-size: .72rem;
            color: var(--faint);
            margin-top: 16px;
        }

        .pwby {
            background: #000;
            color: rgba(255, 255, 255, .3);
            text-align: center;
            padding: 14px 24px;
            font-size: .71rem;
        }

        .pwby a {
            color: var(--amber);
        }

        .adbox {
            border: 1.5px dashed rgba(255, 255, 255, .1);
            border-radius: 13px;
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: .83rem;
            margin: 0 48px 44px;
        }

        @media(max-width:768px) {
            .adbox {
                margin: 0 20px 40px;
            }
        }

        .adbox span {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .expnotice {
            background: rgba(255, 193, 7, .08);
            border: 1px solid rgba(255, 193, 7, .28);
            border-radius: 10px;
            padding: 12px 48px;
            text-align: center;
            color: #ffc107;
            font-size: .83rem;
            margin: 16px 48px;
        }

        @media(max-width:768px) {
            .expnotice {
                padding: 12px 20px;
                margin: 16px 20px;
            }
        }

        /* REVEAL */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .5s, transform .5s;
        }

        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* MODAL */
        #lpModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lpModal>div {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 18px;
            max-width: 520px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 34px;
            position: relative;
        }

        #lpmEy {
            font-size: .63rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 10px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        #lpmT {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--cream);
            margin-bottom: 8px;
            padding-right: 30px;
            line-height: 1.3;
        }

        #lpmP {
            color: var(--amber);
            font-size: 1.08rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        #lpmB {
            color: var(--muted);
            line-height: 1.78;
            font-size: .87rem;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        #lpmWa {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 20px;
            padding: 13px 0;
            background: rgba(37, 211, 102, .12);
            border: 1px solid rgba(37, 211, 102, .3);
            border-radius: 10px;
            font-size: .88rem;
            font-weight: 700;
            color: #25d366;
            cursor: pointer;
            text-decoration: none;
            transition: .22s;
        }

        #lpmWa:hover {
            background: rgba(37, 211, 102, .22);
            text-decoration: none;
        }

        #lpmWa.hidden {
            display: none;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, .07);
            border: none;
            color: var(--cream);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* ANIMATIONS */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }
        }

        @keyframes scanline {
            0% {
                top: -5%;
            }

            100% {
                top: 105%;
            }
        }

        @keyframes floatBg {

            0%,
            100% {
                transform: scale(1) translateY(0);
            }

            50% {
                transform: scale(1.04) translateY(-8px);
            }
        }

        /* ============================================================
           HERO — FULL BG PHOTO + OVERLAY SYSTEM
           Each template has a bg image layer (.hero-bg) covered by
           a colour overlay (.hero-ov) then content on top.
        ============================================================ */
        /* shared hero scaffolding */
        .hero-base {
            min-height: 92vh;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center center;
            animation: floatBg 18s ease-in-out infinite;
        }

        .hero-ov {
            position: absolute;
            inset: 0;
        }

        /* ── T1: Market / General Trading  overlay: deep forest green ── */
        .hero-t1 {
            min-height: 92vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 80px 64px;
        }

        .hero-t1 .hero-bg {
            background-image: url('https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?w=1600&q=80');
        }

        .hero-t1 .hero-ov {
            background: linear-gradient(120deg, rgba(10, 26, 15, .97) 45%, rgba(10, 26, 15, .82) 70%, rgba(10, 26, 15, .5) 100%);
        }

        .hero-t1 .t1-inner {
            position: relative;
            z-index: 3;
            max-width: 580px;
        }

        .hero-t1 .t1-tag {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(255, 210, 50, .1);
            border: 1px solid rgba(255, 210, 50, .3);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .63rem;
            color: #ffd232;
            letter-spacing: .2em;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .hero-t1 h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 5.5vw, 4.4rem);
            font-weight: 900;
            color: #f5f0e8;
            line-height: .97;
            letter-spacing: -.03em;
            margin-bottom: 18px;
        }

        .hero-t1 .t1-sub {
            font-size: .95rem;

            return "<section id='home' class='hero-t8'>" + hbg("")
                + "<div class='t8-stripe'></div>"
                + (d.logo ? "<div class='t8-logo-card'><img src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\"></div>" : "")
                + "<div class='t8-inner'><div class='t8-rule-row'><div class='t8-rule'></div><div class='t8-rule-lbl'>Quality You Can Count On</div></div>"
                + "<h1>" + esc(d.name) + "</h1>"
                + (d.address ? "<p class='t8-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t8-cta'>" + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t8'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "") + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t8o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + "</div></div></section>";
        }
        function heroT9(d) {
            var logoHtml = d.logo ? "<div class='t9-logo'><img src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\"></div>" : "<div class='t9-logo'><span style='font-family:Playfair Display,serif;font-size:1.3rem;color:#5078ff;font-weight:700;'>" + esc((d.name || "B")[0]) + "</span></div>";
            return "<section id='home' class='hero-t9'>" + hbg("")
                + logoHtml
                + "<div class='t9-ticker'><span class='t9-dot'></span>Enroll Today</div>"
                + "<h1>" + esc(d.name) + "</h1><div class='t9-divider'></div>"
                + (d.address ? "<p class='t9-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t9-cta'>" + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t9'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "") + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t9o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + "</div></section>";
        }
        function heroT10(d) {
            var pts = d.name.split(" "); var f = pts.slice(0, -1).join(" ") || d.name; var l = pts.length > 1 ? pts.slice(-1)[0] : "";
            return "<section id='home' class='hero-t10'>" + hbg("")
                + "<div class='t10-grid'></div>"
                + (d.logo ? "<img class='t10-logo-top' src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\">" : "")
                + "<div class='t10-inner'><span class='t10-eyebrow'>Trusted Financial Services</span>"
                + "<h1>" + esc(f) + (l ? " <span>" + esc(l) + "</span>" : "") + "</h1>"
                + (d.address ? "<p class='t10-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t10-cta'>" + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t10'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "") + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t10o'><i class='fa-solid fa-phone'></i> Call</a>" : "") + (d.email ? "<a href='mailto:" + esc(d.email) + "' class='btn btn-t10o'><i class='fa-solid fa-envelope'></i> Email</a>" : "")
                + "</div></div></section>";
        }

        function escItalicLast(name) {
            var pts = esc(name).split(" ");
            if (pts.length < 2) return pts.join(" ");
            return pts.slice(0, -1).join(" ") + " <em>" + pts.slice(-1)[0] + "</em>";
        }

        function svcSection(svcs, isPaid) {
            if (!svcs.length) return "";
            var gridClass = isPaid ? "svc-grid-paid" : "svc-grid-free";
            var cards = svcs.map(function (s) {
                var short = s.desc.length > 110 ? s.desc.substring(0, 108) + "\u2026" : s.desc;
                var more = s.desc.length > 110 ? "<button class='read-more' onclick=\"openLpModal('Service','" + escA(s.title) + "','','" + escA(s.desc) + "')\">Read more <i class='fa-solid fa-arrow-right' style='font-size:.55rem'></i></button>" : "";
                var img = s.image ? "<img class='svc-img' src='" + esc(s.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=svc-img-ph><i class=\\'fa-solid fa-gear\\'></i></div>'\">" : "<div class='svc-img-ph'><i class='fa-solid fa-gear'></i></div>";
                return "<div class='svc-card reveal'>" + img + "<div class='svc-body'><h3>" + esc(s.title) + "</h3><p>" + esc(short) + "</p>" + more + "</div></div>";
            }).join("");
            return "<section class='sec' id='sec-services'><div class='content-wrap-svc'>"
                + "<div class='sec-hdr'><div class='eyebrow'>What We Offer</div><div class='h2'>Our Services</div><div class='lead'>Professional services delivered with consistency and care.</div></div>"
                + "<div class='" + gridClass + "'>" + cards + "</div></div></section>";
        }

        function buildItemWaUrl(it) {
            if (!D || !D.whatsapp) return "";
            var num = String(D.whatsapp || "").replace(/\D/g, "");
            var msg = D.name + " — " + it.name;
            if (it.price) msg += " (" + it.price + ")";
            if (it.desc) msg += "\n" + it.desc;
            msg += "\n\nI would like to order/enquire about this item.";
            return "https://wa.me/" + num + "?text=" + encodeURIComponent(msg);
        }

        function renderItems() {
            var target = document.getElementById("items-target");
            if (!target || !ALL_ITEMS.length) { if (target) target.remove(); return; }
            var per = D.isPaid ? PAID_PER_PAGE : FREE_PER_PAGE;
            var tot = Math.ceil(ALL_ITEMS.length / per);
            ITEMS_PAGE = Math.max(1, Math.min(ITEMS_PAGE, tot || 1));

            function showPage(pg) {
                ITEMS_PAGE = Math.max(1, Math.min(pg, tot || 1));
                var vis = ALL_ITEMS.slice((ITEMS_PAGE - 1) * per, ITEMS_PAGE * per);
                var cards = vis.map(function (it) {
                    var short = it.desc.length > 70 ? it.desc.substring(0, 68) + "\u2026" : it.desc;
                    var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                    var waUrl = buildItemWaUrl(it);
                    var waBtn = waUrl ? "<a href='" + esc(waUrl) + "' target='_blank' class='item-wa-btn' onclick='event.stopPropagation()'><i class='fa-brands fa-whatsapp'></i> Order on WhatsApp</a>" : "";
                    return "<div class='item-card reveal' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "','" + escA(waUrl) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + (short ? "<div class='item-desc'>" + esc(short) + "</div>" : "") + waBtn + "</div></div>";
                }).join("");

                var grid = document.getElementById("items-grid");
                var pgr = document.getElementById("items-pager");
                var pginfo = document.getElementById("items-pg-info");
                if (!grid) return;

                grid.style.transition = "opacity 0.8s ease";
                grid.style.opacity = "0";

                setTimeout(function () {
                    grid.innerHTML = cards;
                    if (pginfo) pginfo.textContent = "Page " + ITEMS_PAGE + " of " + tot;
                    grid.style.opacity = "1";
                    initScrollReveal();
                    clearItemsTimer();
                    startItemsTimer();
                }, 800);
            }

            var itemsTimer = null;

            function clearItemsTimer() {
                if (itemsTimer) { clearTimeout(itemsTimer); itemsTimer = null; }
            }

            function startItemsTimer() {
                if (tot <= 1) return;
                itemsTimer = setTimeout(function () {
                    var next = ITEMS_PAGE >= tot ? 1 : ITEMS_PAGE + 1;
                    showPage(next);
                }, 60000);
            }

            var pager = pagerHtml(tot);
            target.outerHTML = "<section class='sec' id='sec-items'><div class='content-wrap-item'>"
                + "<div class='sec-hdr'><div class='eyebrow'>Browse</div><div class='h2'>Products &amp; Items</div>"
                + "<div class='lead'>Tap any item to view full details or order via WhatsApp.</div>"
                + (tot > 1 ? "<div id='items-pg-info' style='margin-top:8px;font-size:.75rem;color:var(--muted);font-family:JetBrains Mono,monospace;letter-spacing:.1em;'>Page 1 of " + tot + "</div>" : "")
                + "</div>"
                + "<div id='items-grid' class='item-grid' style='transition:opacity 0.8s ease;'></div>"
                + "<div id='items-pager'>" + pager + "</div>"
                + "</div></section>";

            showPage(ITEMS_PAGE);

            setTimeout(function () {
                document.querySelectorAll("[data-pg]").forEach(function (btn) {
                    btn.addEventListener("click", function (e) {
                        e.preventDefault();
                        clearItemsTimer();
                        showPage(parseInt(this.dataset.pg));
                        var url = new URL(window.location);
                        url.searchParams.set("p", ITEMS_PAGE);
                        history.replaceState({}, "", url);
                        var s = document.getElementById("sec-items");
                        if (s) s.scrollIntoView({ behavior: "smooth", block: "start" });
                    });
                });
                startItemsTimer();
            }, 100);
        }

        function pagerHtml(tot) {
            if (tot <= 1) return "";
            var b = "";
            if (ITEMS_PAGE > 1) b += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE - 1) + "'>&larr; Prev</button>";
            for (var i = 1; i <= tot; i++)b += "<button class='pg-btn" + (i === ITEMS_PAGE ? " pg-active" : "") + "' data-pg='" + i + "'>" + i + "</button>";
            if (ITEMS_PAGE < tot) b += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE + 1) + "'>Next &rarr;</button>";
            return "<div class='pager'>" + b + "</div>";
        }

        function contactSection(d) {
            var rows = [];
            if (d.phone) rows.push({ ic: "fa-phone", lb: "Phone", v: d.phone, hr: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ ic: "fa-brands fa-whatsapp", lb: "WhatsApp", v: d.whatsapp, hr: waLink(d.whatsapp) });
            if (d.email) rows.push({ ic: "fa-envelope", lb: "Email", v: d.email, hr: "mailto:" + d.email });
            if (d.address) rows.push({ ic: "fa-location-dot", lb: "Address", v: d.address, hr: null });
            if (d.url) rows.push({ ic: "fa-globe", lb: "Website", v: d.url, hr: d.url });
            if (!rows.length) return "";
            var cards = rows.map(function (r) {
                var cls = r.ic.indexOf("fa-brands") !== -1 ? r.ic : "fa-solid " + r.ic;
                var v = r.hr ? "<a href='" + esc(r.hr) + "' target='_blank' style='color:var(--amber);word-break:break-all;'>" + esc(r.v) + "</a>" : esc(r.v);
                return "<div class='ci-card reveal'><div class='ci-icon'><i class='" + cls + "'></i></div><div style='min-width:0;'><div class='ci-lbl'>" + r.lb + "</div><div class='ci-val'>" + v + "</div></div></div>";
            }).join("");
            return "<section class='contact-section' id='sec-contact'><div class='contact-inner'>"
                + "<div class='sec-hdr'><div class='eyebrow'>Get In Touch</div><div class='h2'>Contact Us</div><div class='lead'>We&rsquo;re here to help.</div></div>"
                + "<div class='ci-grid'>" + cards + "</div></div></section>";
        }

        function footerSec(d) {
            return "<footer class='lp-footer'><div class='foot-name'>" + esc(d.name) + "</div>"
                + (d.regNo ? "<div class='foot-meta'>RC: " + esc(d.regNo) + "</div>" : "")
                + (d.address ? "<div class='foot-meta'>" + esc(d.address) + "</div>" : "")
                + "<div class='foot-copy'>&copy; " + new Date().getFullYear() + " " + esc(d.name) + ". All rights reserved.</div></footer>";
        }

        function navBar(d) {
            var logo = d.logo ? "<img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.style.display='none'\">" : "<div class='brand-fallback'>" + esc((d.name || "B")[0]) + "</div>";
            var cta = (d.whatsapp || d.phone) ? "<a href='" + (d.whatsapp ? waLink(d.whatsapp) : "tel:" + d.phone) + "' class='nav-cta'><i class='fa-brands fa-whatsapp'></i> Contact</a>" : "";
            return "<nav class='lp-nav'>"
                + "<div class='brand'>" + logo + "<span class='brand-name'>" + esc(d.name) + "</span></div>"
                + "<button class='nav-toggle' onclick=\"document.getElementById('nav-links').classList.toggle('open')\"><i class='fa-solid fa-bars'></i></button>"
                + "<ul class='nav-links' id='nav-links'><li><a href='#home'>Home</a></li><li><a href='#sec-services'>Services</a></li><li><a href='#sec-items'>Products</a></li><li><a href='#sec-contact'>Contact</a></li></ul>"
                + cta + "</nav>";
        }

        function adBox() { return "<div class='adbox'><span>&#128226;</span>Advertisement Space<br><small>Contact <a href='https://thevictorias.com.ng'>thevictorias.com.ng</a></small></div>"; }
        function expiredBanner() { return "<div class='expnotice' style='margin:16px 48px;'>&#9888; Paid plan expired &mdash; showing free version. <a href='https://thevictorias.com.ng/contact.html'>Upgrade &rarr;</a></div>"; }
        function poweredBy() { return "<div class='pwby'>Powered by <a href='https://thevictorias.com.ng' target='_blank'>thevictorias.com.ng</a> &nbsp;|&nbsp; <a href='https://thevictorias.com.ng/contact.html' target='_blank'>Get your own page</a></div>"; }

        function modalHTML() {
            return "<div id='lpModal'><div>"
                + "<button class='modal-close' onclick='closeLpModal()'>&times;</button>"
                + "<div id='lpmEy'></div><div id='lpmT'></div><div id='lpmP'></div><p id='lpmB'></p>"
                + "<a id='lpmWa' href='#' target='_blank' class='hidden'><i class='fa-brands fa-whatsapp'></i> Order on WhatsApp</a>"
                + "</div></div>";
        }

        function buildSvc(imgs, descs, limit) { var n = Math.min(Math.max(imgs.length, descs.length), limit), o = []; for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); o.push({ image: imgs[i] || "", title: (p[0] || "Service " + (i + 1)).trim(), desc: (p[1] || "").trim() }); } return o; }
        function buildItem(imgs, descs, limit) { var n = Math.min(Math.max(imgs.length, descs.length), limit), o = []; for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); o.push({ image: imgs[i] || "", name: (p[0] || "Item " + (i + 1)).trim(), price: (p[1] || "").trim(), desc: (p[2] || "").trim() }); } return o; }
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
        function escA(s) { return String(s || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, " "); }

        function initModal() { var m = document.getElementById("lpModal"); if (m) m.addEventListener("click", function (e) { if (e.target === this) closeLpModal(); }); }
        function openLpModal(ey, t, p, b, waUrl) {
            document.getElementById("lpmEy").textContent = ey || "";
            document.getElementById("lpmT").textContent = t || "";
            document.getElementById("lpmP").textContent = p || "";
            document.getElementById("lpmB").textContent = b || "";
            var wa = document.getElementById("lpmWa");
            if (wa) { if (waUrl) { wa.href = waUrl; wa.classList.remove("hidden"); } else { wa.classList.add("hidden"); } }
            var m = document.getElementById("lpModal"); m.style.display = "flex"; document.body.style.overflow = "hidden";
        }
        function closeLpModal() { var m = document.getElementById("lpModal"); if (m) { m.style.display = "none"; document.body.style.overflow = ""; } }
        function initScrollReveal() { var obs = new IntersectionObserver(function (e) { e.forEach(function (x) { if (x.isIntersecting) x.target.classList.add("in"); }); }, { threshold: .1 }); document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { obs.observe(el); }); }
        function initNavScroll() { window.addEventListener("scroll", function () { var nav = document.querySelector(".lp-nav"); if (nav) nav.style.borderBottomColor = window.scrollY > 40 ? "rgba(224,116,16,.18)" : "rgba(255,255,255,.08)"; }); }
        function showError(msg) { document.getElementById("lp-loader").style.display = "none"; document.getElementById("lp-root").style.display = "block"; document.getElementById("lp-page").innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'><div><div style='font-family:Playfair Display,serif;font-size:3.5rem;color:rgba(255,255,255,.06);font-weight:900;'>404</div><p style='color:var(--muted);margin:16px 0 28px;'>" + esc(msg) + "</p><a href='https://thevictorias.com.ng' style='color:var(--amber);font-size:.875rem;'>&larr; The Victorias Ltd</a></div></div>" + poweredBy(); }
    </script>
</body>

</html>
