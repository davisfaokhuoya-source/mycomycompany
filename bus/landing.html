<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --h: #0d0d14;
            --ht: #f0f0fa;
            --f: #E07410;
            --bg: #09090f;
            --card: #15151f;
            --card2: #1c1c2a;
            --bdr: rgba(255, 255, 255, .08);
            --bdr2: rgba(255, 255, 255, .14);
            --txt: rgba(240, 240, 250, .86);
            --txt2: rgba(240, 240, 250, .5);
            --txt3: rgba(240, 240, 250, .32);
            --r: 14px;
            --ease: cubic-bezier(.16, 1, .3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--txt);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased
        }

        img {
            display: block;
            max-width: 100%
        }

        a {
            color: var(--f);
            text-decoration: none
        }

        ::selection {
            background: var(--f);
            color: #fff
        }

        #lp-loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .6s var(--ease)
        }

        #lp-loader.out {
            opacity: 0;
            pointer-events: none
        }

        .ld-ring {
            width: 38px;
            height: 38px;
            border: 2.5px solid rgba(224, 116, 16, .15);
            border-top-color: var(--f);
            border-radius: 50%;
            animation: spin .9s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .ld-txt {
            font-family: "Space Grotesk", sans-serif;
            font-size: .68rem;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--txt3)
        }

        #lp-root {
            display: none
        }

        /* ===== SHARED PRIMITIVES ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .875rem;
            cursor: pointer;
            border: none;
            transition: all .3s var(--ease);
            white-space: nowrap
        }

        .btn-p {
            background: var(--f);
            color: #fff
        }

        .btn-p:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 14px 32px -8px var(--f)
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .22);
            color: var(--ht)
        }

        .btn-o:hover {
            background: rgba(255, 255, 255, .06);
            border-color: rgba(255, 255, 255, .4);
            transform: translateY(-2px)
        }

        .btn-g {
            background: rgba(255, 255, 255, .06);
            color: var(--ht);
            border: 1px solid var(--bdr)
        }

        .btn-g:hover {
            background: rgba(255, 255, 255, .1);
            transform: translateY(-2px)
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .7rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--f);
            font-weight: 700;
            margin-bottom: 18px
        }

        .eyebrow::before {
            content: '';
            width: 18px;
            height: 1.5px;
            background: var(--f)
        }

        .h2 {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 800;
            font-size: clamp(1.9rem, 4vw, 2.65rem);
            color: #fff;
            letter-spacing: -.025em;
            line-height: 1.12;
            margin-bottom: 14px
        }

        .lead {
            font-size: .98rem;
            color: var(--txt2);
            max-width: 540px;
            line-height: 1.75;
            margin-bottom: 56px
        }

        .sec {
            padding: 110px 48px;
            max-width: 1240px;
            margin: 0 auto
        }

        .sec-hdr {
            margin-bottom: 56px
        }

        /* CARD GRID (services) */
        .svc-grid {
            display: grid;
            gap: 22px;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr))
        }

        .svc-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            overflow: hidden;
            transition: transform .4s var(--ease), border-color .4s var(--ease), box-shadow .4s var(--ease);
            position: relative
        }

        .svc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--f), transparent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .5s var(--ease)
        }

        .svc-card:hover::before {
            transform: scaleX(1)
        }

        .svc-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, .18);
            box-shadow: 0 24px 48px -16px rgba(0, 0, 0, .6)
        }

        .svc-img {
            width: 100%;
            height: 188px;
            object-fit: cover;
            filter: saturate(1.05)
        }

        .svc-img-ph {
            width: 100%;
            height: 188px;
            background: var(--card2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: rgba(224, 116, 16, .25)
        }

        .svc-body {
            padding: 24px
        }

        .svc-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--f);
            font-size: .95rem;
            margin-bottom: 16px
        }

        .svc-body h3 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.02rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 9px;
            letter-spacing: -.01em
        }

        .svc-body p {
            font-size: .85rem;
            color: var(--txt2);
            line-height: 1.65
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 13px;
            font-size: .78rem;
            font-weight: 700;
            color: var(--f);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0
        }

        /* NUMBERED LIST (services alt) */
        .svc-list-row {
            display: flex;
            gap: 28px;
            padding: 30px 0;
            border-bottom: 1px solid var(--bdr);
            align-items: flex-start;
            transition: padding-left .3s var(--ease)
        }

        .svc-list-row:hover {
            padding-left: 8px
        }

        .svc-num {
            font-family: "Space Grotesk", sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
            color: transparent;
            -webkit-text-stroke: 1.4px rgba(224, 116, 16, .45);
            min-width: 64px;
            line-height: 1
        }

        .svc-list-row:hover .svc-num {
            -webkit-text-stroke-color: var(--f);
            color: var(--f);
            transition: .3s
        }

        /* MASONRY (services alt) */
        .svc-mas-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr))
        }

        .svc-mas-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: 13px;
            overflow: hidden;
            transition: .3s
        }

        .svc-mas-card:hover {
            border-color: var(--bdr2)
        }

        /* TABS (services alt) */
        .svc-tabs-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 40px
        }

        .svc-tab-btn {
            padding: 10px 18px;
            border-radius: 9px;
            border: 1px solid var(--bdr);
            background: transparent;
            color: var(--txt2);
            font-size: .83rem;
            font-weight: 600;
            cursor: pointer;
            transition: .25s;
            white-space: nowrap
        }

        .svc-tab-btn.active {
            background: var(--f);
            border-color: var(--f);
            color: #fff
        }

        .svc-panel {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 44px;
            align-items: center
        }

        .svc-panel.active {
            display: grid
        }

        /* TIMELINE (services alt) */
        .svc-tl-row {
            display: flex;
            gap: 24px;
            position: relative;
            padding-bottom: 38px
        }

        .svc-tl-dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--f);
            box-shadow: 0 0 0 4px rgba(224, 116, 16, .18);
            flex-shrink: 0;
            margin-top: 5px
        }

        .svc-tl-line {
            width: 2px;
            flex: 1;
            background: var(--bdr);
            margin-top: 4px
        }

        /* ITEMS GRID */
        .item-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr))
        }

        .item-card {
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform .35s var(--ease), border-color .35s var(--ease)
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, .18)
        }

        .item-img {
            width: 100%;
            height: 155px;
            object-fit: cover
        }

        .item-img-ph {
            width: 100%;
            height: 155px;
            background: var(--card2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--txt3)
        }

        .item-body {
            padding: 15px
        }

        .item-name {
            font-weight: 700;
            font-size: .875rem;
            color: #fff;
            margin-bottom: 5px
        }

        .item-price {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 800;
            font-size: .98rem;
            color: var(--f);
            margin-bottom: 5px
        }

        .item-desc {
            font-size: .76rem;
            color: var(--txt2);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical
        }

        /* ITEMS TABLE */
        .item-table {
            border: 1px solid var(--bdr);
            border-radius: 13px;
            overflow: hidden;
            background: var(--card)
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--bdr);
            cursor: pointer;
            transition: background .25s
        }

        .item-row:last-child {
            border-bottom: none
        }

        .item-row:hover {
            background: var(--card2)
        }

        .item-row-thumb {
            width: 50px;
            height: 50px;
            border-radius: 9px;
            object-fit: cover;
            flex-shrink: 0
        }

        .item-row-thumb-ph {
            width: 50px;
            height: 50px;
            border-radius: 9px;
            background: var(--card2);
            flex-shrink: 0
        }

        /* ITEMS CAROUSEL */
        .item-carousel {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            padding-bottom: 16px;
            scroll-snap-type: x mandatory
        }

        .item-carousel::-webkit-scrollbar {
            height: 6px
        }

        .item-carousel::-webkit-scrollbar-thumb {
            background: var(--bdr2);
            border-radius: 3px
        }

        .item-carousel .item-card {
            flex: 0 0 220px;
            scroll-snap-align: start
        }

        /* PAGER */
        .pager {
            display: flex;
            gap: 7px;
            justify-content: center;
            margin-top: 48px;
            flex-wrap: wrap
        }

        .pg-btn {
            min-width: 38px;
            height: 38px;
            padding: 0 13px;
            border-radius: 9px;
            border: 1px solid var(--bdr);
            background: transparent;
            color: var(--txt2);
            font-size: .83rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: .25s
        }

        .pg-btn:hover,
        .pg-btn.active {
            background: var(--f);
            border-color: var(--f);
            color: #fff
        }

        /* CONTACT */
        .ci-grid {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr))
        }

        .ci-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--bdr);
            border-radius: 13px;
            padding: 20px;
            transition: border-color .25s
        }

        .ci-card:hover {
            border-color: var(--bdr2)
        }

        .ci-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--f);
            font-size: 1rem;
            flex-shrink: 0
        }

        .ci-lbl {
            font-size: .66rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--txt3);
            margin-bottom: 3px
        }

        .ci-val {
            font-size: .875rem;
            font-weight: 600;
            color: #fff
        }

        .ci-val a {
            color: #fff
        }

        /* FOOTER */
        .lp-footer {
            background: #000;
            border-top: 1px solid var(--bdr);
            padding: 48px 48px 28px;
            text-align: center
        }

        .foot-name {
            font-family: "Space Grotesk", sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--f);
            margin-bottom: 8px
        }

        .foot-meta {
            font-size: .78rem;
            color: var(--txt3);
            margin-bottom: 3px
        }

        .foot-copy {
            font-size: .76rem;
            color: var(--txt3);
            margin-top: 16px
        }

        .pwby {
            background: #000;
            color: rgba(255, 255, 255, .32);
            text-align: center;
            padding: 13px 24px;
            font-size: .72rem;
            border-top: 1px solid var(--bdr)
        }

        .pwby a {
            color: var(--f)
        }

        .adbox {
            border: 1.5px dashed var(--bdr2);
            border-radius: 13px;
            padding: 36px 20px;
            text-align: center;
            color: var(--txt3);
            font-size: .83rem;
            margin: 0 48px 40px
        }

        .adbox span {
            display: block;
            font-size: 1.6rem;
            margin-bottom: 6px
        }

        .expnotice {
            background: rgba(255, 193, 7, .1);
            border: 1px solid rgba(255, 193, 7, .32);
            border-radius: 11px;
            padding: 13px 24px;
            text-align: center;
            color: #ffc107;
            font-size: .84rem;
            margin: 18px 48px
        }

        /* NAV (paid) */
        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 400;
            height: 72px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(22px) saturate(160%);
            border-bottom: 1px solid var(--bdr);
            transition: box-shadow .3s
        }

        .lp-nav.scrolled {
            box-shadow: 0 8px 32px rgba(0, 0, 0, .4)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px
        }

        .brand img {
            height: 38px;
            width: 38px;
            border-radius: 10px;
            object-fit: contain;
            border: 1.5px solid rgba(224, 116, 16, .4)
        }

        .brand-fallback {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-family: "Space Grotesk", sans-serif
        }

        .brand-name {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            font-size: .95rem;
            color: #fff
        }

        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none
        }

        .nav-links a {
            padding: 9px 15px;
            border-radius: 8px;
            font-size: .83rem;
            font-weight: 500;
            color: var(--txt2);
            transition: .25s
        }

        .nav-links a:hover {
            color: #fff;
            background: rgba(255, 255, 255, .06);
            text-decoration: none
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer
        }

        @media(max-width:900px) {
            .svc-panel {
                grid-template-columns: 1fr !important
            }
        }

        @media(max-width:640px) {

            .sec,
            .lp-nav {
                padding-left: 22px;
                padding-right: 22px
            }

            .sec {
                padding-top: 76px;
                padding-bottom: 76px
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: fixed;
                top: 72px;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, .97);
                padding: 18px;
                gap: 4px;
                border-bottom: 1px solid var(--bdr)
            }

            .nav-links.open {
                display: flex
            }

            .nav-toggle {
                display: block
            }

            .adbox,
            .expnotice {
                margin-left: 22px;
                margin-right: 22px
            }

            .lp-footer {
                padding-left: 22px;
                padding-right: 22px
            }
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(28px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .reveal {
            opacity: 0
        }

        .reveal.in {
            animation: fadeUp .7s var(--ease) both
        }
    </style>
</head>

<body>

    <div id="lp-loader">
        <div class="ld-ring"></div>
        <span class="ld-txt">Loading</span>
    </div>
    <div id="lp-root"></div>

    <script>
        var GW = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";
        var ITEMS_PAGE = 1, ALL_ITEMS = [], ITEMS_PER = 6, D = null;

        (function () {
            var slug = getSlug();
            if (!slug) { showError("No business page specified."); return; }
            fetch(GW, {
                method: "POST", headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getLandingPage", slug: slug })
            })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.success && res.data) boot(res.data);
                    else showError(res.message || "Page not found.");
                })
                .catch(function () { showError("Connection error. Please try again."); });
        })();

        function getSlug() {
            var p = new URLSearchParams(window.location.search);
            return (p.get("slug") || p.get("page") || "").toUpperCase();
        }
        function getPageNum() {
            return parseInt(new URLSearchParams(window.location.search).get("p")) || 1;
        }

        // ── COLOUR ENGINE ──────────────────────────────────────────
        function hexRgb(h) {
            h = String(h || "#0d0d14").replace("#", "");
            if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
            return { r: parseInt(h.substr(0, 2), 16) || 13, g: parseInt(h.substr(2, 2), 16) || 13, b: parseInt(h.substr(4, 2), 16) || 20 };
        }
        function rgbHex(r, g, b) {
            return "#" + [r, g, b].map(function (v) { return ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join("");
        }
        function mix(a, b, t) { var ca = hexRgb(a), cb = hexRgb(b); return rgbHex(ca.r * t + cb.r * (1 - t), ca.g * t + cb.g * (1 - t), ca.b * t + cb.b * (1 - t)); }
        function darken(h, t) { return mix(h, "#000000", 1 - t); }
        function lighten(h, t) { return mix(h, "#ffffff", t); }
        function rgba(h, a) { var c = hexRgb(h); return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }

        function applyPalette(h, ht, f) {
            document.documentElement.style.setProperty("--h", h);
            document.documentElement.style.setProperty("--ht", ht);
            document.documentElement.style.setProperty("--f", f);
            document.documentElement.style.setProperty("--bg", darken(h, .55));
            document.documentElement.style.setProperty("--card", darken(h, .42));
            document.documentElement.style.setProperty("--card2", darken(h, .3));
        }

        // ── BOOT ───────────────────────────────────────────────────
        function boot(d) {
            D = d;
            var h = d.colourHeader || d.colorHeader || "#0d0d14";
            var ht = d.colourHeaderText || d.colorHeaderText || "#f0f0fa";
            var f = d.colourFooter || d.colorFooter || "#E07410";
            applyPalette(h, ht, f);
            document.title = d.name + " | Business";

            var maxSvc = d.isPaid ? 8 : 2, maxItem = d.isPaid ? 30 : 6;
            ITEMS_PER = d.isPaid ? 10 : 6;
            var svcs = buildSvc(d.servicesImages || [], d.servicesDescrip || [], maxSvc);
            ALL_ITEMS = buildItem(d.itemsImages || [], d.itemsDescrip || [], maxItem);
            ITEMS_PAGE = getPageNum();

            var cta = (d.whatsapp || d.phone) ? "<a href='" + (d.whatsapp ? "https://wa.me/" + d.whatsapp.replace(/\D/g, "") : "tel:" + d.phone) + "' class='btn btn-p' style='padding:9px 20px;font-size:.83rem;'><i class='fa-brands fa-whatsapp'></i> Contact</a>" : "";
            return "<nav class='lp-nav' id='lp-nav' style='background:" + rgba(getH(d), .88) + "'>"
                + "<div class='brand'>" + logo + "<span class='brand-name'>" + esc(d.name) + "</span></div>"
                + "<button class='nav-toggle' onclick=\"document.getElementById('nav-links').classList.toggle('open')\"><i class='fa-solid fa-bars'></i></button>"
                + "<ul class='nav-links' id='nav-links'>"
                + "<li><a href='#home'>Home</a></li><li><a href='#sec-services'>Services</a></li>"
                + "<li><a href='#sec-items'>Products</a></li><li><a href='#sec-contact'>Contact</a></li></ul>"
                + cta + "</nav>";
        }

        // ── SERVICES LAYOUTS ──────────────────────────────────────────
        function svcGrid(svcs) {
            if (!svcs.length) return "";
            var cards = svcs.map(function (s, i) {
                var short = s.desc.length > 105 ? s.desc.substring(0, 103) + "…" : s.desc;
                var more = s.desc.length > 105 ? "<button class='read-more' onclick=\"openLpModal('Service','" + escA(s.title) + "','','" + escA(s.desc) + "')\">Read more <i class='fa-solid fa-arrow-right' style='font-size:.6rem'></i></button>" : "";
                var img = s.image ? "<img class='svc-img' src='" + esc(s.image) + "' loading='lazy' onerror=\"this.parentElement.querySelector('.svc-img').remove();this.parentElement.insertAdjacentHTML('afterbegin','<div class=svc-img-ph><i class=\\'fa-solid fa-gear\\'></i></div>')\">" : "<div class='svc-img-ph'><i class='fa-solid fa-gear'></i></div>";
                return "<div class='svc-card reveal d" + Math.min(i, 4) + "'>" + img + "<div class='svc-body'><h3>" + esc(s.title) + "</h3><p>" + esc(short) + "</p>" + more + "</div></div>";
            }).join("");
            return "<section class='sec' id='sec-services'><div class='sec-hdr'><div class='eyebrow'>What We Offer</div><div class='h2'>Our Services</div><div class='lead'>Professional services delivered with consistency and care.</div></div><div class='svc-grid'>" + cards + "</div></section>";
        }
        function svcList(svcs) {
            if (!svcs.length) return "";
            var rows = svcs.map(function (s, i) {
                var short = s.desc.length > 150 ? s.desc.substring(0, 148) + "…" : s.desc;
                var more = s.desc.length > 150 ? "<span onclick=\"openLpModal('Service','" + escA(s.title) + "','','" + escA(s.desc) + "')\" style='color:var(--f);font-weight:700;cursor:pointer;font-size:.8rem;'> Read more →</span>" : "";
                return "<div class='svc-list-row reveal'><div class='svc-num'>" + String(i + 1).padStart(2, "0") + "</div><div style='flex:1;'><h3 style='font-family:Space Grotesk,sans-serif;font-size:1.1rem;color:#fff;margin-bottom:8px;'>" + esc(s.title) + "</h3><p style='font-size:.86rem;color:var(--txt2);'>" + esc(short) + more + "</p></div>"
                    + (s.image ? "<img src='" + esc(s.image) + "' style='width:84px;height:84px;border-radius:11px;object-fit:cover;flex-shrink:0;' loading='lazy' onerror=\"this.style.display='none'\">" : "") + "</div>";
            }).join("");
            return "<section class='sec' id='sec-services'><div class='sec-hdr'><div class='eyebrow'>Capabilities</div><div class='h2'>What We Do</div><div class='lead'>A closer look at our core service lines.</div></div>" + rows + "</section>";
        }
        function svcMasonry(svcs) {
            if (!svcs.length) return "";
            var cards = svcs.map(function (s, i) {
                var short = s.desc.length > 88 ? s.desc.substring(0, 86) + "…" : s.desc;
                var off = (i % 3 === 1) ? "36px" : "0";
                var img = s.image ? "<img src='" + esc(s.image) + "' style='width:100%;height:150px;object-fit:cover;' loading='lazy' onerror=\"this.style.display='none'\">" : "";
                return "<div class='svc-mas-card reveal' style='margin-top:" + off + ";'>" + img + "<div style='padding:20px;'><div class='svc-icon'><i class='fa-solid fa-bolt'></i></div><h3 style='font-family:Space Grotesk,sans-serif;font-size:.98rem;color:#fff;margin-bottom:8px;'>" + esc(s.title) + "</h3><p style='font-size:.82rem;color:var(--txt2);'>" + esc(short) + "</p></div></div>";
            }).join("");
            return "<section class='sec' id='sec-services'><div class='sec-hdr'><div class='eyebrow'>Our Range</div><div class='h2'>Services</div><div class='lead'>Discover everything we bring to the table.</div></div><div class='svc-mas-grid'>" + cards + "</div></section>";
        }
        function svcTabs(svcs) {
            if (!svcs.length) return "";
            var tabs = svcs.map(function (s, i) { return "<button class='svc-tab-btn" + (i === 0 ? " active" : "") + "' id='stb" + i + "' onclick='showSvcTab(" + i + ")'>" + esc(s.title) + "</button>"; }).join("");
            var panels = svcs.map(function (s, i) {
                var img = s.image ? "<img src='" + esc(s.image) + "' style='width:100%;height:280px;object-fit:cover;border-radius:14px;' loading='lazy' onerror=\"this.style.display='none'\">" : "<div style='width:100%;height:280px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:" + rgba(getF(D), .4) + ";'><i class='fa-solid fa-gear'></i></div>";
                return "<div class='svc-panel" + (i === 0 ? " active" : "") + "' id='sp" + i + "'>" + img + "<div><h3 style='font-family:Space Grotesk,sans-serif;font-size:1.5rem;color:#fff;margin-bottom:16px;'>" + esc(s.title) + "</h3><p style='color:var(--txt2);font-size:.9rem;line-height:1.75;'>" + esc(s.desc) + "</p></div></div>";
            }).join("");
            setTimeout(function () {
                window.showSvcTab = function (n) {
                    svcs.forEach(function (_, i) {
                        var p = document.getElementById("sp" + i), b = document.getElementById("stb" + i);
                        if (p) p.classList.toggle("active", i === n);
                        if (b) b.classList.toggle("active", i === n);
                    });
                };
            }, 0);
            return "<section class='sec' id='sec-services'><div class='sec-hdr'><div class='eyebrow'>Explore</div><div class='h2'>Our Services</div><div class='lead'>Click a service to view full details.</div></div><div class='svc-tabs-nav'>" + tabs + "</div>" + panels + "</section>";
        }
        function svcTimeline(svcs) {
            if (!svcs.length) return "";
            var rows = svcs.map(function (s, i) {
                var short = s.desc.length > 120 ? s.desc.substring(0, 118) + "…" : s.desc;
                return "<div class='svc-tl-row reveal'><div style='display:flex;flex-direction:column;align-items:center;flex-shrink:0;'><div class='svc-tl-dot'></div>" + (i < svcs.length - 1 ? "<div class='svc-tl-line'></div>" : "") + "</div><div><h3 style='font-family:Space Grotesk,sans-serif;font-size:1.05rem;color:#fff;margin-bottom:7px;'>" + esc(s.title) + "</h3><p style='font-size:.85rem;color:var(--txt2);max-width:540px;'>" + esc(short) + "</p></div></div>";
            }).join("");
            return "<section class='sec' id='sec-services'><div class='sec-hdr'><div class='eyebrow'>Our Journey of Service</div><div class='h2'>How We Help</div><div class='lead'>A step-by-step look at what we offer.</div></div>" + rows + "</section>";
        }

        // ── ITEMS LAYOUTS (rendered post-DOM-insert, reads data-style) ──
        function renderItems() {
            var target = document.getElementById("items-grid-target");
            if (!target || !ALL_ITEMS.length) return;
            var style = target.dataset.style || "grid";
            var per = D.isPaid ? ITEMS_PER : 6;
            var tot = Math.ceil(ALL_ITEMS.length / per);
            ITEMS_PAGE = Math.max(1, Math.min(ITEMS_PAGE, tot || 1));
            var vis = ALL_ITEMS.slice((ITEMS_PAGE - 1) * per, ITEMS_PAGE * per);

            var inner = "";
            if (style === "table") inner = renderItemsTable(vis);
            else if (style === "carousel") inner = renderItemsCarousel(vis);
            else inner = renderItemsGrid(vis);

            var pager = renderPager(tot);
            target.outerHTML = "<section class='sec' id='sec-items'><div class='sec-hdr'><div class='eyebrow'>Browse</div><div class='h2'>Products &amp; Items</div><div class='lead'>Tap any item to view full details.</div></div>" + inner + pager + "</section>";

            document.querySelectorAll("[data-pg]").forEach(function (btn) {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    ITEMS_PAGE = parseInt(this.dataset.pg);
                    history.replaceState({}, "", "?slug=" + getSlug() + "&p=" + ITEMS_PAGE);
                    reinsertItemsTarget(style);
                    renderItems();
                    document.getElementById("sec-items").scrollIntoView({ behavior: "smooth", block: "start" });
                });
            });
            initScrollReveal();
        }
        function reinsertItemsTarget(style) {
            var sec = document.getElementById("sec-items");
            if (sec) sec.outerHTML = "<div id='items-grid-target' data-style='" + style + "'></div>";
        }
        function renderItemsGrid(items) {
            var cards = items.map(function (it) {
                var short = it.desc.length > 72 ? it.desc.substring(0, 70) + "…" : it.desc;
                var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                return "<div class='item-card reveal' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + (short ? "<div class='item-desc'>" + esc(short) + "</div>" : "") + "</div></div>";
            }).join("");
            return "<div class='item-grid'>" + cards + "</div>";
        }
        function renderItemsTable(items) {
            var rows = items.map(function (it) {
                var img = it.image ? "<img class='item-row-thumb' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-row-thumb-ph></div>'\">" : "<div class='item-row-thumb-ph'></div>";
                return "<div class='item-row' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div style='flex:1;min-width:0;'><div style='font-weight:700;font-size:.88rem;color:#fff;'>" + esc(it.name) + "</div><div style='font-size:.76rem;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>" + esc(it.desc) + "</div></div>" + (it.price ? "<div style='font-family:Space Grotesk,sans-serif;font-weight:800;color:var(--f);font-size:.95rem;flex-shrink:0;'>" + esc(it.price) + "</div>" : "") + "</div>";
            }).join("");
            return "<div class='item-table'>" + rows + "</div>";
        }
        function renderItemsCarousel(items) {
            var cards = items.map(function (it) {
                var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                return "<div class='item-card' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + "</div></div>";
            }).join("");
            return "<div class='item-carousel'>" + cards + "</div>";
        }
        function renderPager(tot) {
            if (tot <= 1) return "";
            var btns = "";
            if (ITEMS_PAGE > 1) btns += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE - 1) + "'>← Prev</button>";
            for (var i = 1; i <= tot; i++)btns += "<button class='pg-btn" + (i === ITEMS_PAGE ? " active" : "") + "' data-pg='" + i + "'>" + i + "</button>";
            if (ITEMS_PAGE < tot) btns += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE + 1) + "'>Next →</button>";
            return "<div class='pager'>" + btns + "</div>";
        }

        // ── CONTACT / FOOTER ─────────────────────────────────────────
        function contactSec(d) {
            var rows = [];
            if (d.phone) rows.push({ ic: "fa-phone", lb: "Phone", v: d.phone, hr: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ ic: "fa-brands fa-whatsapp", lb: "WhatsApp", v: d.whatsapp, hr: "https://wa.me/" + d.whatsapp.replace(/\D/g, "") });
            if (d.email) rows.push({ ic: "fa-envelope", lb: "Email", v: d.email, hr: "mailto:" + d.email });
            if (d.address) rows.push({ ic: "fa-location-dot", lb: "Address", v: d.address, hr: null });
            if (d.url) rows.push({ ic: "fa-globe", lb: "Website", v: d.url, hr: d.url });
            if (!rows.length) return "";
            var cards = rows.map(function (r) {
                var cls = r.ic.indexOf("fa-brands") !== -1 ? r.ic : "fa-solid " + r.ic;
                var v = r.hr ? "<a href='" + esc(r.hr) + "' target='_blank'>" + esc(r.v) + "</a>" : esc(r.v);
                return "<div class='ci-card reveal'><div class='ci-icon'><i class='" + cls + "'></i></div><div><div class='ci-lbl'>" + r.lb + "</div><div class='ci-val'>" + v + "</div></div></div>";
            }).join("");
            return "<section class='sec' id='sec-contact'><div class='sec-hdr'><div class='eyebrow'>Get In Touch</div><div class='h2'>Contact Us</div><div class='lead'>We&rsquo;re here to help.</div></div><div class='ci-grid'>" + cards + "</div></section>";
        }
        function footerSec(d) {
            return "<footer class='lp-footer'><div class='foot-name'>" + esc(d.name) + "</div>"
                + (d.regNo ? "<div class='foot-meta'>RC: " + esc(d.regNo) + "</div>" : "")
                + (d.address ? "<div class='foot-meta'>" + esc(d.address) + "</div>" : "")
                + "<div class='foot-copy'>&copy; " + new Date().getFullYear() + " " + esc(d.name) + ". All rights reserved.</div></footer>";
        }
        function adBox() { return "<div class='adbox'><span>📢</span>Advertisement Space<br><small>Contact <a href='https://thevictorias.com.ng'>thevictorias.com.ng</a></small></div>"; }
        function poweredBy() { return "<div class='pwby'>Powered by <a href='https://thevictorias.com.ng' target='_blank'>thevictorias.com.ng</a> &nbsp;|&nbsp; <a href='https://thevictorias.com.ng/contact.html' target='_blank'>Get your own page</a></div>"; }

        // ── COLOUR ACCESSORS ──────────────────────────────────────────
        function getH(d) { return d.colourHeader || d.colorHeader || "#0d0d14"; }
        function getF(d) { return d.colourFooter || d.colorFooter || "#E07410"; }

        // ── MODAL ──────────────────────────────────────────────────────
        function ensureModal() {
            if (document.getElementById("lpModal")) return;
            var div = document.createElement("div");
            div.innerHTML = "<div id='lpModal' style='display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:20px;'>"
                + "<div style='background:var(--card);border:1px solid var(--bdr2);border-radius:16px;max-width:540px;width:100%;max-height:80vh;overflow-y:auto;padding:34px;position:relative;'>"
                + "<button onclick='closeLpModal()' style='position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:none;color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;'>✕</button>"
                + "<div id='lpmEy' style='font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--f);margin-bottom:8px;font-weight:700;'></div>"
                + "<h3 id='lpmT' style='font-family:Space Grotesk,sans-serif;font-size:1.2rem;color:#fff;margin-bottom:8px;padding-right:30px;'></h3>"
                + "<div id='lpmP' style='color:var(--f);font-size:1.1rem;font-weight:800;margin-bottom:12px;'></div>"
                + "<p id='lpmB' style='color:var(--txt2);line-height:1.7;font-size:.87rem;white-space:pre-wrap;'></p></div></div>";
            document.body.appendChild(div.firstChild);
            document.getElementById("lpModal").addEventListener("click", function (e) { if (e.target === this) closeLpModal(); });
        }
        function openLpModal(ey, t, p, b) {
            ensureModal();
            document.getElementById("lpmEy").textContent = ey || "";
            document.getElementById("lpmT").textContent = t || "";
            document.getElementById("lpmP").textContent = p || "";
            document.getElementById("lpmB").textContent = b || "";
            var m = document.getElementById("lpModal");
            m.style.display = "flex"; document.body.style.overflow = "hidden";
        }
        function closeLpModal() {
            var m = document.getElementById("lpModal");
            if (m) { m.style.display = "none"; document.body.style.overflow = ""; }
        }

        // ── SCROLL REVEAL + NAV SHADOW ─────────────────────────────────
        function initScrollReveal() {
            var obs = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("in"); });
            }, { threshold: .12 });
            document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { obs.observe(el); });
        }
        function initNavScroll() {
            window.addEventListener("scroll", function () {
                var nav = document.getElementById("lp-nav");
                if (nav) nav.classList.toggle("scrolled", window.scrollY > 30);
            });
        }

        // ── BUILDERS / UTILS ───────────────────────────────────────────
        function buildSvc(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), out = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); out.push({ image: imgs[i] || "", title: p[0] || "Service " + (i + 1), desc: p[1] || "" }); }
            return out;
        }
        function buildItem(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), out = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); out.push({ image: imgs[i] || "", name: p[0] || "Item " + (i + 1), price: p[1] || "", desc: p[2] || "" }); }
            return out;
        }
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
        function escA(s) { return String(s || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, " "); }

        function showError(msg) {
            var ldr = document.getElementById("lp-loader");
            if (ldr) ldr.style.display = "none";
            var r = document.getElementById("lp-root");
            r.style.display = "block";
            r.innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'><div><div style='font-family:Space Grotesk,sans-serif;font-size:3.6rem;color:rgba(255,255,255,.1);font-weight:800;'>404</div><p style='color:var(--txt2);margin:16px 0 28px;'>" + esc(msg) + "</p><a href='https://thevictorias.com.ng' style='color:var(--f);font-size:.875rem;'>← The Victorias Ltd</a></div></div>" + poweredBy();
        }
    </script>
</body>

</html>
