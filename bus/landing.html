<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* ===== TOKENS ===== */
        :root {
            --ink: #0b0c14;
            --ink2: #13141f;
            --ink3: #1c1d2c;
            --amber: #E07410;
            --amber2: #f5891e;
            --cream: #f0f0fa;
            --muted: rgba(240, 240, 250, .58);
            --faint: rgba(240, 240, 250, .22);
            --border: rgba(255, 255, 255, .08);
            --a-glow: rgba(224, 116, 16, .22);
            --a-mid: rgba(224, 116, 16, .38);
            --radius: 14px;
            --nav-h: 68px;
        }

        /* ===== RESET ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #000;
            color: var(--cream);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--amber);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ===== CONTAINER — 60% on desktop, 100% on mobile ===== */
        .wrap {
            width: 60%;
            margin: 0 auto;
        }

        @media(max-width:1024px) {
            .wrap {
                width: 80%;
            }
        }

        @media(max-width:768px) {
            .wrap {
                width: 100%;
                padding: 0 20px;
            }
        }

        /* ===== PAGE SHELL ===== */
        .lp-page {
            width: 100%;
            background: var(--ink);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== LOADER ===== */
        #lp-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .5s;
        }

        #lp-loader.out {
            opacity: 0;
            pointer-events: none;
        }

        .ld-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid var(--border);
            border-top-color: var(--amber);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ld-txt {
            font-size: .78rem;
            color: var(--muted);
            letter-spacing: .12em;
        }

        #lp-root {
            display: none;
        }

        /* ===== NAV ===== */
        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 400;
            height: var(--nav-h);
            background: rgba(11, 12, 20, .9);
            backdrop-filter: blur(22px) saturate(160%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
        }

        .lp-nav .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            height: 36px;
            width: 36px;
            border-radius: 9px;
            object-fit: contain;
            border: 1.5px solid var(--a-mid);
        }

        .brand-fallback {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--amber);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 1rem;
        }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: .92rem;
            color: var(--cream);
        }

        .nav-links {
            display: flex;
            gap: 4px;
            list-style: none;
        }

        .nav-links a {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 500;
            color: var(--muted);
            transition: .2s;
        }

        .nav-links a:hover {
            color: var(--cream);
            background: rgba(255, 255, 255, .06);
            text-decoration: none;
        }

        .nav-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border-radius: 10px;
            font-size: .83rem;
            font-weight: 700;
            background: var(--amber);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: .25s;
            white-space: nowrap;
        }

        .nav-cta:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 1.15rem;
            cursor: pointer;
            padding: 8px;
        }

        @media(max-width:768px) {
            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-h);
                left: 0;
                right: 0;
                background: var(--ink2);
                flex-direction: column;
                padding: 12px 20px;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-toggle {
                display: block;
            }
        }

        /* ===== HERO — diagonal split with mesh pattern ===== */
        #home {
            position: relative;
            min-height: 90vh;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: var(--ink);
        }

        /* Diagonal stripe pattern */
        #home::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(-55deg,
                    transparent 0px,
                    transparent 28px,
                    rgba(255, 255, 255, .022) 28px,
                    rgba(255, 255, 255, .022) 29px);
            pointer-events: none;
        }

        /* Amber glow orb */
        #home::after {
            content: '';
            position: absolute;
            top: -80px;
            right: -120px;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 116, 16, .28) 0%, transparent 68%);
            pointer-events: none;
        }

        /* Right accent block — full-height vertical slice */
        .hero-accent-block {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 34%;
            background: linear-gradient(160deg, rgba(224, 116, 16, .12) 0%, rgba(224, 116, 16, .04) 100%);
            clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
            border-left: 1px solid rgba(224, 116, 16, .18);
            pointer-events: none;
        }

        /* Dot-grid overlay on right block */
        .hero-accent-block::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(224, 116, 16, .35) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: .55;
        }

        .hero-inner {
            position: relative;
            z-index: 2;
        }

        /* Small amber "ticker" bar above headline */
        .hero-ticker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(224, 116, 16, .12);
            border: 1px solid rgba(224, 116, 16, .3);
            border-radius: 50px;
            padding: 6px 16px;
            margin-bottom: 28px;
            font-family: 'Space Mono', monospace;
            font-size: .68rem;
            color: var(--amber2);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .hero-ticker .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 8px var(--amber);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .3;
            }
        }

        .hero-h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.4rem, 5.5vw, 4rem);
            font-weight: 800;
            line-height: 1.02;
            color: var(--cream);
            letter-spacing: -.03em;
            margin-bottom: 10px;
        }

        .hero-h1 em {
            font-style: normal;
            color: var(--amber);
            position: relative;
        }

        /* Underline squiggle on em */
        .hero-h1 em::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -4px;
            height: 3px;
            background: var(--amber);
            border-radius: 3px;
            opacity: .6;
        }

        .hero-divider {
            width: 52px;
            height: 2px;
            background: linear-gradient(90deg, var(--amber), transparent);
            margin: 20px 0;
        }

        .hero-lead {
            font-size: .97rem;
            color: var(--muted);
            max-width: 460px;
            line-height: 1.78;
            margin-bottom: 38px;
        }

        .hero-cta-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Floating stat card on right */
        .hero-stat-card {
            position: absolute;
            right: 4%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            background: rgba(19, 20, 31, .88);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 28px 22px;
            width: 220px;
            backdrop-filter: blur(14px);
            box-shadow: 0 24px 56px rgba(0, 0, 0, .5);
        }

        .hero-stat-card .label {
            font-size: .66rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .hero-stat-card .big {
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--amber);
            line-height: 1.1;
        }

        .hero-stat-card .sub {
            font-size: .75rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .hero-stat-card .divider-line {
            margin: 14px 0;
            height: 1px;
            background: var(--border);
        }

        .hero-stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(224, 116, 16, .12);
            border: 1px solid rgba(224, 116, 16, .25);
            border-radius: 50px;
            padding: 4px 10px;
            font-size: .67rem;
            color: var(--amber2);
        }

        @media(max-width:900px) {
            .hero-stat-card {
                display: none;
            }
        }

        /* Logo display in hero */
        .hero-logo {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: contain;
            margin-bottom: 26px;
            border: 2px solid rgba(224, 116, 16, .35);
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 26px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .86rem;
            cursor: pointer;
            border: none;
            transition: all .28s;
            white-space: nowrap;
            font-family: 'DM Sans', sans-serif;
        }

        .btn-p {
            background: var(--amber);
            color: #fff;
            box-shadow: 0 8px 24px var(--a-mid);
        }

        .btn-p:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 32px rgba(224, 116, 16, .45);
            text-decoration: none;
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .2);
            color: var(--cream);
        }

        .btn-o:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .btn-g {
            background: rgba(255, 255, 255, .05);
            color: var(--cream);
            border: 1px solid var(--border);
        }

        .btn-g:hover {
            background: rgba(255, 255, 255, .09);
            transform: translateY(-2px);
            text-decoration: none;
        }

        /* ===== SECTION SHELL ===== */
        .sec {
            padding: 88px 0;
        }

        .sec-hdr {
            margin-bottom: 52px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Mono', monospace;
            font-size: .66rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--amber);
            font-weight: 700;
            margin-bottom: 14px;
        }

        .eyebrow::before {
            content: '';
            width: 18px;
            height: 1.5px;
            background: var(--amber);
        }

        .h2 {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: clamp(1.7rem, 3.2vw, 2.4rem);
            color: var(--cream);
            letter-spacing: -.025em;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .lead {
            font-size: .94rem;
            color: var(--muted);
            max-width: 520px;
            line-height: 1.75;
            margin-bottom: 0;
        }

        /* ===== SERVICES GRID — always grid ===== */
        .svc-grid {
            display: grid;
            gap: 22px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        @media(max-width:640px) {
            .svc-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }

        .svc-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform .32s, border-color .32s, box-shadow .32s;
        }

        .svc-card:hover {
            transform: translateY(-5px);
            border-color: rgba(224, 116, 16, .32);
            box-shadow: 0 18px 44px -14px rgba(0, 0, 0, .5);
        }

        .svc-img {
            width: 100%;
            height: 175px;
            object-fit: cover;
        }

        .svc-img-ph {
            width: 100%;
            height: 175px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--a-mid);
        }

        .svc-body {
            padding: 20px 22px 22px;
        }

        .svc-body h3 {
            font-family: 'Syne', sans-serif;
            font-size: .98rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 8px;
            letter-spacing: -.01em;
        }

        .svc-body p {
            font-size: .83rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 11px;
            font-size: .77rem;
            font-weight: 700;
            color: var(--amber);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        /* ===== ITEMS GRID — always grid ===== */
        .item-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        @media(max-width:640px) {
            .item-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        @media(max-width:420px) {
            .item-grid {
                grid-template-columns: 1fr;
            }
        }

        .item-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .3s, border-color .3s;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(224, 116, 16, .28);
        }

        .item-img {
            width: 100%;
            height: 155px;
            object-fit: cover;
        }

        .item-img-ph {
            width: 100%;
            height: 155px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--faint);
        }

        .item-body {
            padding: 14px 16px 16px;
        }

        .item-name {
            font-weight: 700;
            font-size: .86rem;
            color: var(--cream);
            margin-bottom: 5px;
        }

        .item-price {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: .98rem;
            color: var(--amber);
            margin-bottom: 5px;
        }

        .item-desc {
            font-size: .75rem;
            color: var(--muted);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* ===== PAGER ===== */
        .pager {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .pg-btn {
            padding: 9px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            background: var(--ink2);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: .2s;
        }

        .pg-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .pg-btn.pg-active {
            background: var(--amber);
            border-color: var(--amber);
            color: #fff;
        }

        /* ===== CONTACT ===== */
        .ci-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        @media(max-width:640px) {
            .ci-grid {
                grid-template-columns: 1fr;
            }
        }

        .ci-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: .25s;
        }

        .ci-card:hover {
            border-color: rgba(224, 116, 16, .25);
        }

        .ci-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber);
            font-size: 1rem;
            flex-shrink: 0;
        }

        .ci-lbl {
            font-size: .67rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .ci-val {
            font-size: .86rem;
            font-weight: 600;
            color: var(--cream);
            margin-top: 3px;
        }

        /* ===== FOOTER ===== */
        .lp-footer {
            background: var(--ink);
            border-top: 1px solid var(--border);
            padding: 48px 0 28px;
            text-align: center;
        }

        .foot-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--amber);
            margin-bottom: 8px;
        }

        .foot-meta {
            font-size: .76rem;
            color: var(--faint);
            margin-bottom: 3px;
        }

        .foot-copy {
            font-size: .73rem;
            color: var(--faint);
            margin-top: 14px;
        }

        /* ===== POWERED BY ===== */
        .pwby {
            background: #000;
            color: rgba(255, 255, 255, .35);
            text-align: center;
            padding: 13px 24px;
            font-size: .72rem;
        }

        .pwby a {
            color: var(--amber);
        }

        /* ===== AD BOX ===== */
        .adbox {
            border: 1.5px dashed var(--border);
            border-radius: 13px;
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: .83rem;
            margin: 0 0 44px;
        }

        .adbox span {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        /* ===== EXPIRED NOTICE ===== */
        .expnotice {
            background: rgba(255, 193, 7, .08);
            border: 1px solid rgba(255, 193, 7, .3);
            border-radius: 10px;
            padding: 12px 0;
            text-align: center;
            color: #ffc107;
            font-size: .83rem;
            margin: 16px 0;
        }

        /* ===== SCROLL REVEAL ===== */
        .reveal {
            opacity: 0;
            transform: translateY(22px);
            transition: opacity .55s, transform .55s;
        }

        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* ===== MODAL ===== */
        #lpModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .82);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lpModal>div {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 520px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 32px;
            position: relative;
        }

        #lpmEy {
            font-size: .64rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 8px;
            font-weight: 700;
        }

        #lpmT {
            font-family: 'Syne', sans-serif;
            font-size: 1.18rem;
            color: var(--cream);
            margin-bottom: 8px;
            padding-right: 28px;
        }

        #lpmP {
            color: var(--amber);
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        #lpmB {
            color: var(--muted);
            line-height: 1.75;
            font-size: .86rem;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, .07);
            border: none;
            color: var(--cream);
            border-radius: 50%;
            width: 30px;

        /* ===== MOBILE SECTION PADDING ===== */

</head>

<body>

    <!-- LOADER -->
    <div id="lp-loader">
        <div class="ld-ring"></div>
        <span class="ld-txt">Loading</span>
    </div>

    <!-- PAGE -->
    <div id="lp-root">
        <div class="lp-page" id="lp-page"></div>
    </div>

    <script>
        var GW = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";
        var FREE_PER_PAGE = 6, PAID_PER_PAGE = 10;
        var ITEMS_PAGE = 1, ALL_ITEMS = [], D = null;

        /* ---- Bootstrap ---- */
        (function () {
            var slug = getSlug();
            if (!slug) { showError("No business page specified."); return; }
            ITEMS_PAGE = getPageNum();
            fetch(GW, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "getLandingPage", slug: slug }) })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.success && res.data) boot(res.data);
                    else showError(res.message || "Page not found.");
                })
                .catch(function () { showError("Connection error. Please try again."); });
        })();

        function getSlug() { var p = new URLSearchParams(window.location.search); return (p.get("slug") || p.get("page") || "").toUpperCase(); }
        function getPageNum() { return parseInt(new URLSearchParams(window.location.search).get("p")) || 1; }

        /* ---- Color utilities ---- */
        function hexRgb(h) { h = String(h || "#0b0c14").replace("#", ""); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; if (h.length !== 6 || /[^0-9a-f]/i.test(h)) h = "0b0c14"; return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) }; }
        function rgbHex(r, g, b) { return "#" + [r, g, b].map(function (v) { return ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join(""); }
        function mix(a, b, t) { var ca = hexRgb(a), cb = hexRgb(b); return rgbHex(ca.r * t + cb.r * (1 - t), ca.g * t + cb.g * (1 - t), ca.b * t + cb.b * (1 - t)); }
        function darken(h, t) { return mix(h, "#000000", 1 - t); }
        function lighten(h, t) { return mix(h, "#ffffff", t); }
        function rgba(h, a) { var c = hexRgb(h); return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }
        function waLink(n) { return "https://wa.me/" + String(n || "").replace(/\D/g, ""); }

        function applyPalette(h, ht, f) {
            var r = document.documentElement.style;
            r.setProperty("--ink", h);
            r.setProperty("--amber", f);
            r.setProperty("--amber2", lighten(f, .15));
            r.setProperty("--ink2", darken(h, .42));
            r.setProperty("--ink3", darken(h, .3));
            r.setProperty("--border", rgba(lighten(h, .3), .14));
            r.setProperty("--cream", rgba(ht, .92));
            r.setProperty("--muted", rgba(ht, .58));
            r.setProperty("--faint", rgba(ht, .28));
            r.setProperty("--a-glow", rgba(f, .22));
            r.setProperty("--a-mid", rgba(f, .38));
        }

        /* ---- Boot ---- */
        function boot(d) {
            D = d;
            var h = d.colorPrimary || "#0b0c14";
            var ht = d.colorPrimaryText || "#f0f0fa";
            var f = d.colorAccent || "#E07410";
            if (!d.isPaid) { h = "#0b0c14"; ht = "#f0f0fa"; }
            applyPalette(h, ht, f);
            document.title = d.name + " | Business";

            var maxSvc = d.isPaid ? 8 : 4, maxItem = d.isPaid ? 40 : 15;
            var svcs = buildSvc(d.servicesImages || [], d.servicesDescrip || [], maxSvc);
            ALL_ITEMS = buildItem(d.itemsImages || [], d.itemsDescrip || [], maxItem);

            var tpl = (d.template || (d.isPaid ? "neo" : "free1")).toLowerCase();
            var notice = d.expired ? expiredBanner() : "";
            var html = d.isPaid ? renderPaid(tpl, d, svcs) : renderFree(tpl, d, svcs, notice);

            var page = document.getElementById("lp-page");
            page.innerHTML = html + modalHTML();
            document.getElementById("lp-root").style.display = "block";
            var ldr = document.getElementById("lp-loader");
            ldr.classList.add("out");
            setTimeout(function () { ldr.style.display = "none"; }, 500);

            var itemsTarget = document.getElementById("items-target");
            if (itemsTarget) renderItems();
            initScrollReveal();
            initNavScroll();
            initModal();
        }

        /* ---- Template routing ---- */
        function renderFree(tpl, d, svcs, notice) {
            switch (tpl) {
                case "free2": return free2(d, svcs, notice);
                case "free3": return free3(d, svcs, notice);
                case "free4": return free4(d, svcs, notice);
                case "free5": return free5(d, svcs, notice);
                default: return free1(d, svcs, notice);
            }
        }
        function renderPaid(tpl, d, svcs) {
            var nav = navBar(d);
            switch (tpl) {
                case "cyber": return nav + paidCyber(d, svcs);
                case "quantum": return nav + paidQuantum(d, svcs);
                case "prism": return nav + paidPrism(d, svcs);
                case "matrix": return nav + paidMatrix(d, svcs);
                default: return nav + paidNeo(d, svcs);
            }
        }

        /* ===== FREE TEMPLATES ===== */

        function free1(d, svcs, notice) {
            var hero = "<section id='home' style='min-height:90vh;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 0;text-align:center;position:relative;overflow:hidden;'>"
                + "<div style='position:absolute;inset:0;background-image:repeating-linear-gradient(-55deg,transparent 0,transparent 28px,rgba(255,255,255,.022) 28px,rgba(255,255,255,.022) 29px);pointer-events:none;'></div>"
                + "<div style='position:absolute;top:-80px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(224,116,16,.28) 0%,transparent 68%);pointer-events:none;'></div>"
                + "<div class='hero-accent-block'></div>"
                + "<div class='wrap' style='position:relative;z-index:2;'>"
                + (d.logo ? "<img src='" + esc(d.logo) + "' class='hero-logo' style='margin:0 auto 26px;' onerror=\"this.style.display='none'\">" : "")
                + "<div class='hero-ticker'><span class='dot'></span>Official Business</div>"
                + "<h1 class='hero-h1'>" + esc(d.name) + "</h1>"
                + "<div class='hero-divider' style='margin:18px auto;'></div>"
                + (d.address ? "<p class='hero-lead' style='margin:0 auto 36px;'>" + esc(d.address) + "</p>" : "")
                + "<div class='hero-cta-row' style='justify-content:center;'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-p'><i class='fa-brands fa-whatsapp'></i> WhatsApp Us</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + "</div></div></section>";
            return hero + notice
                + "<div class='wrap'>" + svcGridHtml(svcs) + "<div id='items-target'></div>" + contactSecHtml(d) + adBox() + "</div>"
                + footerSecHtml(d) + poweredBy();
        }

        function free2(d, svcs, notice) {
            var hero = "<section id='home' style='min-height:90vh;background:var(--ink);display:flex;align-items:center;overflow:hidden;position:relative;'>"
                + "<div style='position:absolute;inset:0;background-image:repeating-linear-gradient(-55deg,transparent 0,transparent 28px,rgba(255,255,255,.022) 28px,rgba(255,255,255,.022) 29px);pointer-events:none;'></div>"
                + "<div class='hero-accent-block'></div>"
                + "<div class='wrap' style='position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;'>"
                + "<div>"
                + (d.logo ? "<img src='" + esc(d.logo) + "' class='hero-logo' onerror=\"this.style.display='none'\">" : "")
                + "<div class='hero-ticker'><span class='dot'></span>Professional Services</div>"
                + "<h1 class='hero-h1'>" + esc(d.name) + "</h1>"
                + "<div class='hero-divider'></div>"
                + (d.address ? "<p class='hero-lead'>" + esc(d.address) + "</p>" : "")
                + "<div class='hero-cta-row'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-p'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + "</div></div>"
                + (d.logo ? "<div style='display:flex;align-items:center;justify-content:center;'><img src='" + esc(d.logo) + "' style='max-height:220px;max-width:80%;object-fit:contain;' onerror=\"this.style.display='none'\"></div>" : "<div></div>")
                + "</div></section>";
            return "<style>@media(max-width:768px){#home .wrap{grid-template-columns:1fr!important;}#home .wrap>div:last-child{display:none;}}</style>"
                + hero + notice
                + "<div class='wrap'>" + svcGridHtml(svcs) + "<div id='items-target'></div>" + contactSecHtml(d) + adBox() + "</div>"
                + footerSecHtml(d) + poweredBy();
        }

        function free3(d, svcs, notice) {
            var hero = free1(d, [], notice); /* reuse centered hero for free3; diff is in service layout handled below */
            return free1(d, svcs, notice);
        }
        function free4(d, svcs, notice) { return free2(d, svcs, notice); }
        function free5(d, svcs, notice) { return free1(d, svcs, notice); }

        /* ===== PAID TEMPLATES ===== */

        function paidNeo(d, svcs) {
            var hero = "<section id='home' style='min-height:90vh;background:var(--ink);display:flex;align-items:center;overflow:hidden;position:relative;padding:90px 0;'>"
                + "<div style='position:absolute;inset:0;background-image:repeating-linear-gradient(-55deg,transparent 0,transparent 28px,rgba(255,255,255,.022) 28px,rgba(255,255,255,.022) 29px);pointer-events:none;'></div>"
                + "<div class='hero-accent-block'></div>"
                + "<div style='position:absolute;top:-80px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,var(--a-glow) 0%,transparent 68%);pointer-events:none;'></div>"
                + "<div class='wrap' style='position:relative;z-index:2;'>"
                + "<div class='hero-ticker'><span class='dot'></span>Premium Business Solutions</div>"
                + "<h1 class='hero-h1'>" + esc(d.name) + "</h1>"
                + "<div class='hero-divider'></div>"
                + (d.address ? "<p class='hero-lead'>" + esc(d.address) + "</p>" : "")
                + ctaRowFull(d)
                + "</div>"
                + heroStatCard(svcs.length, ALL_ITEMS.length)
                + "</section>";
            return hero
                + "<div class='wrap'>" + svcGridHtml(svcs) + "<div id='items-target'></div>" + contactSecHtml(d) + "</div>"
                + footerSecHtml(d) + poweredBy();
        }

        function paidCyber(d, svcs) {
            var hero = "<section id='home' style='min-height:90vh;background:var(--ink2);display:flex;align-items:center;overflow:hidden;position:relative;padding:90px 0;'>"
                + "<div style='position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px);pointer-events:none;'></div>"
                + "<div style='position:absolute;top:28px;left:28px;width:34px;height:34px;border-top:2px solid var(--amber);border-left:2px solid var(--amber);'></div>"
                + "<div style='position:absolute;top:28px;right:28px;width:34px;height:34px;border-top:2px solid var(--amber);border-right:2px solid var(--amber);'></div>"
                + "<div style='position:absolute;bottom:28px;left:28px;width:34px;height:34px;border-bottom:2px solid var(--amber);border-left:2px solid var(--amber);'></div>"
                + "<div style='position:absolute;bottom:28px;right:28px;width:34px;height:34px;border-bottom:2px solid var(--amber);border-right:2px solid var(--amber);'></div>"
                + "<div class='wrap' style='position:relative;z-index:2;'>"
                + "<div class='hero-ticker'><span class='dot'></span>System Online</div>"
                + "<h1 class='hero-h1' style='font-family:Space Mono,monospace;'>" + esc(d.name) + "</h1>"
                + "<div style='width:100%;height:2px;background:linear-gradient(90deg,var(--amber),transparent);margin:18px 0 28px;'></div>"
                + (d.address ? "<p class='hero-lead' style='font-family:Space Mono,monospace;font-size:.83rem;'>" + esc(d.address) + "</p>" : "")
                + "<div class='hero-cta-row'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn' style='background:var(--amber);color:#000;font-family:Space Mono,monospace;'><i class='fa-brands fa-whatsapp'></i> WHATSAPP</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn' style='border:1px solid var(--amber);color:var(--amber);background:transparent;font-family:Space Mono,monospace;'><i class='fa-solid fa-phone'></i> CALL</a>" : "")
                + "</div></div></section>";
            return hero
                + "<div class='wrap'>" + svcGridHtml(svcs) + "<div id='items-target'></div>" + contactSecHtml(d) + "</div>"
                + footerSecHtml(d) + poweredBy();
        }

        function paidQuantum(d, svcs) { return paidNeo(d, svcs); }
        function paidPrism(d, svcs) { return paidNeo(d, svcs); }
        function paidMatrix(d, svcs) { return paidNeo(d, svcs); }

        /* ---- Reusable components ---- */
        function heroStatCard(svcCount, itemCount) {
            return "<div class='hero-stat-card'>"
                + "<div class='label'>At a Glance</div>"
                + "<div class='big'>" + svcCount + "</div>"
                + "<div class='sub'>Services offered</div>"
                + "<div class='divider-line'></div>"
                + "<div class='label'>Products</div>"
                + "<div style='font-family:Syne,sans-serif;font-size:1.5rem;font-weight:800;color:var(--amber);'>" + itemCount + "</div>"
                + "<div class='divider-line'></div>"
                + "<div class='hero-stat-badge'><i class='fa-solid fa-circle-check' style='font-size:.6rem;'></i> Active</div>"
                + "</div>";
        }

        function svcGridHtml(svcs) {
            if (!svcs.length) return "";
            var cards = svcs.map(function (s) {
                var short = s.desc.length > 105 ? s.desc.substring(0, 103) + "\u2026" : s.desc;
                var more = s.desc.length > 105 ? "<button class='read-more' onclick=\"openLpModal('Service','" + escA(s.title) + "','','" + escA(s.desc) + "')\">Read more <i class='fa-solid fa-arrow-right' style='font-size:.58rem'></i></button>" : "";
                var img = s.image ? "<img class='svc-img' src='" + esc(s.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=svc-img-ph><i class=\\'fa-solid fa-gear\\'></i></div>'\">" : "<div class='svc-img-ph'><i class='fa-solid fa-gear'></i></div>";
                return "<div class='svc-card reveal'>" + img + "<div class='svc-body'><h3>" + esc(s.title) + "</h3><p>" + esc(short) + "</p>" + more + "</div></div>";
            }).join("");
            return "<section class='sec' id='sec-services'><div class='sec-hdr'><div class='eyebrow'>What We Offer</div><div class='h2'>Our Services</div><div class='lead'>Professional services delivered with consistency and care.</div></div><div class='svc-grid'>" + cards + "</div></section>";
        }

        function renderItems() {
            var target = document.getElementById("items-target");
            if (!target || !ALL_ITEMS.length) { if (target) target.remove(); return; }
            var per = D.isPaid ? PAID_PER_PAGE : FREE_PER_PAGE;
            var tot = Math.ceil(ALL_ITEMS.length / per);
            ITEMS_PAGE = Math.max(1, Math.min(ITEMS_PAGE, tot || 1));
            var vis = ALL_ITEMS.slice((ITEMS_PAGE - 1) * per, ITEMS_PAGE * per);
            var cards = vis.map(function (it) {
                var short = it.desc.length > 72 ? it.desc.substring(0, 70) + "\u2026" : it.desc;
                var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                return "<div class='item-card reveal' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + (short ? "<div class='item-desc'>" + esc(short) + "</div>" : "") + "</div></div>";
            }).join("");
            var pager = pagerHtml(tot);
            target.outerHTML =
                "<section class='sec' id='sec-items'>"
                + "<div class='sec-hdr'><div class='eyebrow'>Browse</div><div class='h2'>Products &amp; Items</div><div class='lead'>Tap any item to view full details.</div></div>"
                + "<div class='item-grid'>" + cards + "</div>"
                + pager
                + "</section>";
            document.querySelectorAll("[data-pg]").forEach(function (btn) {
                btn.addEventListener("click", function (e) {
                    e.preventDefault();
                    ITEMS_PAGE = parseInt(this.dataset.pg);
                    var url = new URL(window.location);
                    url.searchParams.set("p", ITEMS_PAGE);
                    history.replaceState({}, "", url);
                    var sec = document.getElementById("sec-items");
                    if (sec) sec.outerHTML = "<div id='items-target'></div>";
                    renderItems();
                    var newSec = document.getElementById("sec-items");
                    if (newSec) newSec.scrollIntoView({ behavior: "smooth", block: "start" });
                    initScrollReveal();
                });
            });
            initScrollReveal();
        }

        function pagerHtml(tot) {
            if (tot <= 1) return "";
            var btns = "";
            if (ITEMS_PAGE > 1) btns += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE - 1) + "'>&larr; Prev</button>";
            for (var i = 1; i <= tot; i++) btns += "<button class='pg-btn" + (i === ITEMS_PAGE ? " pg-active" : "") + "' data-pg='" + i + "'>" + i + "</button>";
            if (ITEMS_PAGE < tot) btns += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE + 1) + "'>Next &rarr;</button>";
            return "<div class='pager'>" + btns + "</div>";
        }

        function contactSecHtml(d) {
            var rows = [];
            if (d.phone) rows.push({ ic: "fa-phone", lb: "Phone", v: d.phone, hr: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ ic: "fa-brands fa-whatsapp", lb: "WhatsApp", v: d.whatsapp, hr: waLink(d.whatsapp) });
            if (d.email) rows.push({ ic: "fa-envelope", lb: "Email", v: d.email, hr: "mailto:" + d.email });
            if (d.address) rows.push({ ic: "fa-location-dot", lb: "Address", v: d.address, hr: null });
            if (d.url) rows.push({ ic: "fa-globe", lb: "Website", v: d.url, hr: d.url });
            if (!rows.length) return "";
            var cards = rows.map(function (r) {
                var cls = r.ic.indexOf("fa-brands") !== -1 ? r.ic : "fa-solid " + r.ic;
                var v = r.hr ? "<a href='" + esc(r.hr) + "' target='_blank'>" + esc(r.v) + "</a>" : esc(r.v);
                return "<div class='ci-card reveal'><div class='ci-icon'><i class='" + cls + "'></i></div><div><div class='ci-lbl'>" + r.lb + "</div><div class='ci-val'>" + v + "</div></div></div>";
            }).join("");
            return "<section class='sec' id='sec-contact'><div class='sec-hdr'><div class='eyebrow'>Get In Touch</div><div class='h2'>Contact Us</div><div class='lead'>We&rsquo;re here to help.</div></div><div class='ci-grid'>" + cards + "</div></section>";
        }

        function footerSecHtml(d) {
            return "<footer class='lp-footer'><div class='wrap'><div class='foot-name'>" + esc(d.name) + "</div>"
                + (d.regNo ? "<div class='foot-meta'>RC: " + esc(d.regNo) + "</div>" : "")
                + (d.address ? "<div class='foot-meta'>" + esc(d.address) + "</div>" : "")
                + "<div class='foot-copy'>&copy; " + new Date().getFullYear() + " " + esc(d.name) + ". All rights reserved.</div></div></footer>";

        function navBar(d) {
            var logo = d.logo ? "<img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.style.display='none'\">" : "<div class='brand-fallback'>" + esc((d.name || "B")[0]) + "</div>";
            var cta = (d.whatsapp || d.phone) ? "<a href='" + (d.whatsapp ? waLink(d.whatsapp) : "tel:" + d.phone) + "' class='nav-cta'><i class='fa-brands fa-whatsapp'></i> Contact</a>" : "";
            return "<nav class='lp-nav'><div class='wrap'>"
                + "<div class='brand'>" + logo + "<span class='brand-name'>" + esc(d.name) + "</span></div>"
                + "<button class='nav-toggle' onclick=\"document.getElementById('nav-links').classList.toggle('open')\"><i class='fa-solid fa-bars'></i></button>"
                + "<ul class='nav-links' id='nav-links'><li><a href='#home'>Home</a></li><li><a href='#sec-services'>Services</a></li><li><a href='#sec-items'>Products</a></li><li><a href='#sec-contact'>Contact</a></li></ul>"
                + cta + "</div></nav>";
        }
        function ctaRowFull(d) {
            return "<div class='hero-cta-row'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-p'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + (d.email ? "<a href='mailto:" + esc(d.email) + "' class='btn btn-g'><i class='fa-solid fa-envelope'></i> Email</a>" : "")
                + "</div>";
        }
        function adBox() { return "<div class='adbox'><span>&#128226;</span>Advertisement Space<br><small>Contact <a href='https://thevictorias.com.ng'>thevictorias.com.ng</a></small></div>"; }
        function expiredBanner() { return "<div class='wrap'><div class='expnotice'>&#9888; Paid plan expired &mdash; showing free version. <a href='https://thevictorias.com.ng/contact.html'>Upgrade &rarr;</a></div></div>"; }
        function poweredBy() { return "<div class='pwby'>Powered by <a href='https://thevictorias.com.ng' target='_blank'>thevictorias.com.ng</a> &nbsp;|&nbsp; <a href='https://thevictorias.com.ng/contact.html' target='_blank'>Get your own page</a></div>"; }

        function modalHTML() {
            return "<div id='lpModal'><div>"
                + "<button class='modal-close' onclick='closeLpModal()'>&times;</button>"
                + "<div id='lpmEy'></div>"
                + "<div id='lpmT'></div>"
                + "<div id='lpmP'></div>"
                + "<p id='lpmB'></p>"
                + "</div></div>";
        }

        /* ---- Data builders ---- */
        function buildSvc(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), out = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); out.push({ image: imgs[i] || "", title: (p[0] || "Service " + (i + 1)).trim(), desc: (p[1] || "").trim() }); }
            return out;
        }
        function buildItem(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), out = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); out.push({ image: imgs[i] || "", name: (p[0] || "Item " + (i + 1)).trim(), price: (p[1] || "").trim(), desc: (p[2] || "").trim() }); }
            return out;
        }
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
        function escA(s) { return String(s || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, " "); }

        /* ---- Interactions ---- */
        function initModal() {
            var m = document.getElementById("lpModal");
            if (m) m.addEventListener("click", function (e) { if (e.target === this) closeLpModal(); });
        }
        function openLpModal(ey, t, p, b) {
            document.getElementById("lpmEy").textContent = ey || "";
            document.getElementById("lpmT").textContent = t || "";
            document.getElementById("lpmP").textContent = p || "";
            document.getElementById("lpmB").textContent = b || "";
            var m = document.getElementById("lpModal");
            m.style.display = "flex";
            document.body.style.overflow = "hidden";
        }
        function closeLpModal() {
            var m = document.getElementById("lpModal");
            if (m) { m.style.display = "none"; document.body.style.overflow = ""; }
        }
        function initScrollReveal() {
            var obs = new IntersectionObserver(function (entries) {
                entries.forEach(function (e) { if (e.isIntersecting) e.target.classList.add("in"); });
            }, { threshold: .1 });
            document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { obs.observe(el); });
        }
        function initNavScroll() {
            window.addEventListener("scroll", function () {
                var nav = document.querySelector(".lp-nav");
                if (nav) nav.style.borderBottomColor = window.scrollY > 30 ? "rgba(224,116,16,.2)" : "rgba(255,255,255,.08)";
            });
        }
        function showError(msg) {
            document.getElementById("lp-loader").style.display = "none";
            var r = document.getElementById("lp-root");
            r.style.display = "block";
            document.getElementById("lp-page").innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'><div><div style='font-family:Syne,sans-serif;font-size:3.5rem;color:rgba(255,255,255,.08);font-weight:800;'>404</div><p style='color:var(--muted);margin:16px 0 28px;'>" + esc(msg) + "</p><a href='https://thevictorias.com.ng' style='color:var(--amber);font-size:.875rem;'>&larr; The Victorias Ltd</a></div></div>" + poweredBy();
        }
    </script>
</body>

</html>
