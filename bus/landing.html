<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #09090f;
            --ink2: #111118;
            --ink3: #1a1a24;
            --amber: #E07410;
            --amber2: #f88c20;
            --cream: #f0f0fa;
            --muted: rgba(240, 240, 250, .56);
            --faint: rgba(240, 240, 250, .24);
            --border: rgba(255, 255, 255, .08);
            --a-soft: rgba(224, 116, 16, .10);
            --a-mid: rgba(224, 116, 16, .32);
            --a-glow: rgba(224, 116, 16, .18);
            --radius: 14px;
            --nav-h: 68px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #000;
            color: var(--cream);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            color: var(--amber);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* LOADER */
        #lp-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity .5s;
        }

        #lp-loader.out {
            opacity: 0;
            pointer-events: none;
        }

        .ld-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .08);
            border-top-color: var(--amber);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .ld-txt {
            font-size: .75rem;
            color: var(--muted);
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        #lp-root {
            display: none;
        }

        /* PAGE */
        .lp-page {
            width: 100%;
            background: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* NAV */
        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 400;
            height: var(--nav-h);
            background: rgba(9, 9, 15, .92);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 48px;
            justify-content: space-between;
            transition: border-color .3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            height: 36px;
            width: 36px;
            border-radius: 9px;
            object-fit: contain;
            border: 1.5px solid var(--a-mid);
        }

        .brand-fallback {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: var(--amber);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: .95rem;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: .9rem;
            color: var(--cream);
        }

        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none;
        }

        .nav-links a {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 500;
            color: var(--muted);
            transition: .2s;
        }

        .nav-links a:hover {
            color: var(--cream);
            background: rgba(255, 255, 255, .06);
            text-decoration: none;
        }

        .nav-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 22px;
            border-radius: 10px;
            font-size: .83rem;
            font-weight: 600;
            background: var(--amber);
            color: #fff;
            transition: .25s;
            white-space: nowrap;
        }

        .nav-cta:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
            text-decoration: none;
        }

        .nav-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--cream);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
        }

        @media(max-width:768px) {
            .lp-nav {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: var(--nav-h);
                left: 0;
                right: 0;
                background: var(--ink2);
                flex-direction: column;
                padding: 12px 20px;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.open {
                display: flex;
            }

            .nav-toggle {
                display: block;
            }
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: .86rem;
            cursor: pointer;
            border: none;
            transition: all .28s;
            white-space: nowrap;
            font-family: 'Outfit', sans-serif;
        }

        .btn-p {
            background: var(--amber);
            color: #fff;
            box-shadow: 0 8px 28px var(--a-mid);
        }

        .btn-p:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 14px 36px rgba(224, 116, 16, .4);
            text-decoration: none;
        }

        .btn-o {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, .22);
            color: var(--cream);
        }

        .btn-o:hover {
            background: rgba(255, 255, 255, .06);
            transform: translateY(-2px);
            text-decoration: none;
        }

        .btn-g {
            background: rgba(255, 255, 255, .06);
            color: var(--cream);
            border: 1px solid var(--border);
        }

        .btn-g:hover {
            background: rgba(255, 255, 255, .1);
            transform: translateY(-2px);
            text-decoration: none;
        }

        /* EYEBROW */
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--amber);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .eyebrow::before {
            content: '';
            width: 20px;
            height: 1.5px;
            background: var(--amber);
        }

        /* CONTENT WRAP: services = 75%, items = 60% */
        .content-wrap-svc {
            width: 75%;
            margin: 0 auto;
        }

        .content-wrap-item {
            width: 60%;
            margin: 0 auto;
        }

        @media(max-width:1200px) {
            .content-wrap-svc {
                width: 90%;
            }

            .content-wrap-item {
                width: 80%;
            }
        }

        @media(max-width:768px) {

            .content-wrap-svc,
            .content-wrap-item {
                width: 100%;
                padding: 0 20px;
            }
        }

        /* SECTION */
        .sec {
            padding: 96px 0;
        }

        @media(max-width:768px) {
            .sec {
                padding: 64px 0;
            }
        }

        .sec-hdr {
            margin-bottom: 52px;
        }

        .h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            color: var(--cream);
            letter-spacing: -.02em;
            line-height: 1.08;
            margin-bottom: 12px;
        }

        .lead {
            font-size: .94rem;
            color: var(--muted);
            line-height: 1.78;
        }

        /* SERVICES GRID: 4 per row paid / 3 per row free, centered */
        .svc-grid-paid {
            display: grid;
            gap: 22px;
            grid-template-columns: repeat(4, 1fr);
        }

        .svc-grid-free {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(3, 1fr);
        }

        @media(max-width:1100px) {
            .svc-grid-paid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:900px) {
            .svc-grid-free {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:640px) {

            .svc-grid-paid,
            .svc-grid-free {
                grid-template-columns: 1fr;
            }
        }

        .svc-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            width: 100%;
            transition: transform .32s, border-color .32s, box-shadow .32s;
        }

        .svc-card:hover {
            transform: translateY(-6px);
            border-color: rgba(224, 116, 16, .3);
            box-shadow: 0 20px 48px -16px rgba(0, 0, 0, .6);
        }

        .svc-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .svc-img-ph {
            width: 100%;
            height: 170px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: var(--a-mid);
        }

        .svc-body {
            padding: 18px 20px 22px;
        }

        .svc-body h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 7px;
        }

        .svc-body p {
            font-size: .82rem;
            color: var(--muted);
            line-height: 1.65;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            font-size: .77rem;
            font-weight: 600;
            color: var(--amber);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        /* ITEMS GRID */
        .item-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        @media(max-width:640px) {
            .item-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
        }

        @media(max-width:420px) {
            .item-grid {
                grid-template-columns: 1fr;
            }
        }

        .item-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: transform .3s, border-color .3s;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: rgba(224, 116, 16, .26);
        }

        .item-img {
            width: 100%;
            height: 158px;
            object-fit: cover;
        }

        .item-img-ph {
            width: 100%;
            height: 158px;
            background: var(--ink3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--faint);
        }

        .item-body {
            padding: 14px 16px 18px;
        }

        .item-name {
            font-weight: 600;
            font-size: .86rem;
            color: var(--cream);
            margin-bottom: 5px;
        }

        .item-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: .98rem;
            color: var(--amber);
            margin-bottom: 4px;
        }

        .item-desc {
            font-size: .75rem;
            color: var(--muted);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* PAGER */
        .pager {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 42px;
            flex-wrap: wrap;
        }

        .pg-btn {
            padding: 9px 16px;
            border-radius: 8px;
            font-size: .82rem;
            font-weight: 600;
            background: var(--ink2);
            border: 1px solid var(--border);
            color: var(--muted);
            cursor: pointer;
            transition: .2s;
            font-family: 'Outfit', sans-serif;
        }

        .pg-btn:hover {
            border-color: var(--amber);
            color: var(--amber);
        }

        .pg-btn.pg-active {
            background: var(--amber);
            border-color: var(--amber);
            color: #fff;
        }

        /* CONTACT */
        .contact-section {
            padding: 96px 48px;
            background: var(--ink);
        }

        @media(max-width:768px) {
            .contact-section {
                padding: 64px 20px;
            }
        }

        .contact-inner {
            max-width: 960px;
            margin: 0 auto;
        }

        .ci-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(3, 1fr);
        }

        @media(max-width:900px) {
            .ci-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:540px) {
            .ci-grid {
                grid-template-columns: 1fr;
            }
        }

        .ci-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 22px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: .25s;
            min-width: 0;
        }

        .ci-card:hover {
            border-color: rgba(224, 116, 16, .28);
        }

        .ci-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(224, 116, 16, .12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--amber);
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .ci-lbl {
            font-size: .66rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3px;
        }

        .ci-val {
            font-size: .88rem;
            font-weight: 600;
            color: var(--cream);
            word-break: break-all;
            line-height: 1.4;
        }

        /* FOOTER */
        .lp-footer {
            background: #000;
            border-top: 1px solid rgba(255, 255, 255, .05);
            padding: 52px 48px 30px;
            text-align: center;
        }

        @media(max-width:768px) {
            .lp-footer {
                padding: 40px 20px 24px;
            }
        }

        .foot-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--amber);
            margin-bottom: 8px;
        }

        .foot-meta {
            font-size: .76rem;
            color: var(--faint);
            margin-bottom: 3px;
        }

        .foot-copy {
            font-size: .72rem;
            color: var(--faint);
            margin-top: 16px;
        }

        .pwby {
            background: #000;
            color: rgba(255, 255, 255, .3);
            text-align: center;
            padding: 14px 24px;
            font-size: .71rem;
        }

        .pwby a {
            color: var(--amber);
        }

        /* AD BOX */
        .adbox {
            border: 1.5px dashed rgba(255, 255, 255, .1);
            border-radius: 13px;
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
            font-size: .83rem;
            margin: 0 48px 44px;
        }

        @media(max-width:768px) {
            .adbox {
                margin: 0 20px 40px;
            }
        }

        .adbox span {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        /* EXPIRED */
        .expnotice {
            background: rgba(255, 193, 7, .08);
            border: 1px solid rgba(255, 193, 7, .28);
            border-radius: 10px;
            padding: 12px 48px;
            text-align: center;
            color: #ffc107;
            font-size: .83rem;
            margin: 16px 48px;
        }

        @media(max-width:768px) {
            .expnotice {
                padding: 12px 20px;
                margin: 16px 20px;
            }
        }

        /* SCROLL REVEAL */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .5s, transform .5s;
        }

        .reveal.in {
            opacity: 1;
            transform: none;
        }

        /* MODAL */
        #lpModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lpModal>div {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: 18px;
            max-width: 520px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 34px;
            position: relative;
        }

        #lpmEy {
            font-size: .63rem;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--amber);
            margin-bottom: 10px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        #lpmT {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--cream);
            margin-bottom: 8px;
            padding-right: 30px;
            line-height: 1.3;
        }

        #lpmP {
            color: var(--amber);
            font-size: 1.08rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        #lpmB {
            color: var(--muted);
            line-height: 1.78;
            font-size: .87rem;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, .07);
            border: none;
            color: var(--cream);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* ANIMATIONS */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 8px var(--amber);
            }

            50% {
                opacity: .3;
                box-shadow: 0 0 2px var(--amber);
            }
        }

        @keyframes floatY {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes ticker {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes scanline {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }

        /* ================================================
           HERO TEMPLATE 1 — MARKET (Warm Market Stall)
           Fixed palette: deep green + gold
           SME type: general market / trading business
        ================================================ */
        .hero-t1 {
            min-height: 92vh;
            background: #0a1a0f;
            display: flex;
            align-items: center;
            padding: 80px 64px;
            position: relative;
            overflow: hidden;
        }

        .hero-t1::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255, 210, 50, .025) 60px, rgba(255, 210, 50, .025) 61px),
                repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255, 210, 50, .025) 60px, rgba(255, 210, 50, .025) 61px);
        }

        .hero-t1 .t1-accent {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 42%;
            background: linear-gradient(160deg, rgba(255, 210, 50, .12) 0%, rgba(255, 165, 0, .06) 50%, transparent 100%);
            border-left: 1px solid rgba(255, 210, 50, .14);
        }

        .hero-t1 .t1-accent::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 210, 50, .22) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: .35;
        }

        .hero-t1 .t1-logo-panel {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 42%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .hero-t1 .t1-logo-panel img {
            max-height: 220px;
            max-width: 58%;
            object-fit: contain;
        }

        .hero-t1 .t1-inner {
            position: relative;
            z-index: 3;
            max-width: 580px;
        }

        .hero-t1 .t1-tag {
            display: inline-block;
            padding: 5px 14px;
            background: rgba(255, 210, 50, .1);
            border: 1px solid rgba(255, 210, 50, .28);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .63rem;
            color: #ffd232;
            letter-spacing: .2em;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .hero-t1 h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 5.5vw, 4.2rem);
            font-weight: 900;
            color: #f5f0e8;
            line-height: .97;
            letter-spacing: -.03em;
            margin-bottom: 18px;
        }

        .hero-t1 .t1-sub {
            font-size: .95rem;
            color: rgba(245, 240, 232, .58);

<body>
    <div id="lp-loader">
        <div class="ld-ring"></div><span class="ld-txt">Loading</span>
    </div>
    <div id="lp-root">
        <div class="lp-page" id="lp-page"></div>
    </div>

    <script>
        var GW = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";
        var FREE_PER_PAGE = 10, PAID_PER_PAGE = 10;
        var FREE_MAX_SVC = 3, PAID_MAX_SVC = 4;
        var FREE_MAX_ITEMS = 15, PAID_MAX_ITEMS = 40;
        var ITEMS_PAGE = 1, ALL_ITEMS = [], D = null;

        (function () {
            var slug = getSlug();
            if (!slug) { showError("No business page specified."); return; }
            ITEMS_PAGE = getPageNum();
            fetch(GW, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "getLandingPage", slug: slug }) })
                .then(function (r) { return r.json(); })
                .then(function (res) {
                    if (res.success && res.data) boot(res.data);
                    else showError(res.message || "Page not found.");
                }).catch(function () { showError("Connection error."); });
        })();

        function getSlug() { var p = new URLSearchParams(window.location.search); return (p.get("slug") || p.get("page") || "").toUpperCase(); }
        function getPageNum() { return parseInt(new URLSearchParams(window.location.search).get("p")) || 1; }

        /* colour utils */
        function hexRgb(h) { h = String(h || "#09090f").replace("#", ""); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; if (h.length !== 6 || /[^0-9a-f]/i.test(h)) h = "09090f"; return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) }; }
        function rgbHex(r, g, b) { return "#" + [r, g, b].map(function (v) { return ("0" + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2); }).join(""); }
        function mix(a, b, t) { var ca = hexRgb(a), cb = hexRgb(b); return rgbHex(ca.r * t + cb.r * (1 - t), ca.g * t + cb.g * (1 - t), ca.b * t + cb.b * (1 - t)); }
        function darken(h, t) { return mix(h, "#000000", 1 - t); }
        function lighten(h, t) { return mix(h, "#ffffff", t); }
        function rgba(h, a) { var c = hexRgb(h); return "rgba(" + c.r + "," + c.g + "," + c.b + "," + a + ")"; }
        function waLink(n) { return "https://wa.me/" + String(n || "").replace(/\D/g, ""); }

        function applyPalette(h, ht, f) {
            /* For paid: use user colours. Free: palette is fixed per template in CSS. */
            var r = document.documentElement.style;
            r.setProperty("--ink", h);
            r.setProperty("--amber", f);
            r.setProperty("--amber2", lighten(f, .15));
            r.setProperty("--ink2", darken(h, .42));
            r.setProperty("--ink3", darken(h, .3));
            r.setProperty("--border", rgba(lighten(h, .3), .14));
            r.setProperty("--cream", rgba(ht, .92));
            r.setProperty("--muted", rgba(ht, .56));
            r.setProperty("--faint", rgba(ht, .24));
            r.setProperty("--a-soft", rgba(f, .10));
            r.setProperty("--a-mid", rgba(f, .32));
            r.setProperty("--a-glow", rgba(f, .18));
        }

        function boot(d) {
            D = d;
            /* Paid = user colours; free = defaults (each template has its own fixed palette via CSS) */
            var h = d.isPaid ? (d.colorPrimary || "#09090f") : "#09090f";
            var ht = d.isPaid ? (d.colorPrimaryText || "#f0f0fa") : "#f0f0fa";
            var f = d.isPaid ? (d.colorAccent || "#E07410") : "#E07410";
            applyPalette(h, ht, f);
            document.title = d.name + " | Business";

            var maxSvc = d.isPaid ? PAID_MAX_SVC : FREE_MAX_SVC;
            var maxItem = d.isPaid ? PAID_MAX_ITEMS : FREE_MAX_ITEMS;
            var svcs = buildSvc(d.servicesImages || [], d.servicesDescrip || [], maxSvc);
            ALL_ITEMS = buildItem(d.itemsImages || [], d.itemsDescrip || [], maxItem);

            var tpl = (d.template || (d.isPaid ? "t6" : "t1")).toLowerCase();
            var notice = d.expired ? expiredBanner() : "";
            var html = d.isPaid ? renderPaid(tpl, d, svcs) : renderFree(tpl, d, svcs, notice);

            var page = document.getElementById("lp-page");
            page.innerHTML = html + modalHTML();
            document.getElementById("lp-root").style.display = "block";
            var ldr = document.getElementById("lp-loader");
            ldr.classList.add("out");
            setTimeout(function () { ldr.style.display = "none"; }, 500);

            if (document.getElementById("items-target")) renderItems();
            initScrollReveal();
            initNavScroll();
            initModal();
        }

        /* template dispatch — all 10 available to both free and paid */
        var TEMPLATE_IDS = ["t1", "t2", "t3", "t4", "t5", "t6", "t7", "t8", "t9", "t10"];

        function renderFree(tpl, d, svcs, notice) {
            return heroFn(tpl)(d, svcs) + notice + svcSection(svcs, false) + "<div id='items-target'></div>" + contactSection(d) + adBox() + footerSec(d) + poweredBy();
        }
        function renderPaid(tpl, d, svcs) {
            return navBar(d) + heroFn(tpl)(d, svcs) + svcSection(svcs, true) + "<div id='items-target'></div>" + contactSection(d) + footerSec(d) + poweredBy();
        }

        function heroFn(tpl) {
            var map = {
                t1: heroT1, t2: heroT2, t3: heroT3, t4: heroT4, t5: heroT5,
                t6: heroT6, t7: heroT7, t8: heroT8, t9: heroT9, t10: heroT10
            };
            return map[tpl] || heroT1;
        }

        /* ── HERO T1: Market / Trading ── */
        function heroT1(d) {
            return "<section id='home' class='hero-t1'>"
                + "<div class='t1-accent'></div>"
                + (d.logo ? "<div class='t1-logo-panel'><img src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\"></div>" : "")
                + "<div class='t1-inner'>"
                + "<div class='t1-tag'>Open for Business</div>"
                + "<h1>" + esc(d.name) + "</h1>"
                + (d.address ? "<p class='t1-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t1-cta'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t1'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t1o'><i class='fa-solid fa-phone'></i> Call Us</a>" : "")
                + "</div></div></section>";
        }

        /* ── HERO T2: Boutique / Fashion ── */
        function heroT2(d) {
            var logoHtml = d.logo
                ? "<div class='t2-logo'><img src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\"></div>"
                : "<div class='t2-logo'><span style='font-family:Playfair Display,serif;font-size:1.4rem;color:#d4a278;font-weight:700;'>" + esc((d.name || "B")[0]) + "</span></div>";
            return "<section id='home' class='hero-t2'>"
                + "<div class='t2-ring1'></div><div class='t2-ring2'></div><div class='t2-glow'></div>"
                + logoHtml
                + "<div class='t2-tag'>Fashion &amp; Style</div>"
                + "<h1>" + esc(d.name) + "</h1>"
                + "<div class='t2-divider'></div>"
                + (d.address ? "<p class='t2-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t2-cta'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t2'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t2o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + "</div></section>";
        }

        /* ── HERO T3: Tech / Electronics ── */
        function heroT3(d) {
            return "<section id='home' class='hero-t3'>"
                + "<div class='t3-scanline'></div><div class='t3-vline'></div>"
                + (d.logo ? "<div class='t3-logo-card'><img src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\"></div>" : "")
                + "<div class='t3-inner'>"
                + "<div class='t3-sys'><span class='t3-dot'></span><span class='t3-txt'>System Online — " + esc(d.name) + "</span></div>"
                + "<h1>" + esc(d.name) + "</h1><div class='t3-bar'></div>"

                + "<div class='t3-cta'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t3'><i class='fa-brands fa-whatsapp'></i> CONNECT</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t3o'><i class='fa-solid fa-phone'></i> CALL</a>" : "")
                + (d.email ? "<a href='mailto:" + esc(d.email) + "' class='btn btn-t3o'><i class='fa-solid fa-envelope'></i> MAIL</a>" : "")
                + "</div></div></section>";
        }

        /* ── HERO T4: Food / Restaurant ── */
        function heroT4(d, svcs) {
            var svcN = svcs.length, itemN = ALL_ITEMS.length;
            return "<section id='home' class='hero-t4'>"
                + "<div class='t4-bg-num'>&#8364;</div>"
                + "<div class='t4-glow'></div>"
                + (d.logo ? "<img class='t4-top-logo' src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\">" : "")
                + "<div class='t4-inner'>"
                + "<div class='t4-rule'><div class='t4-rule-line'></div><div class='t4-rule-lbl'>Serving You Daily</div></div>"
                + "<h1><em>" + esc(d.name) + "</em></h1>"
                + "<div class='t4-stat-bar'>"
                + "<div class='t4-stat'><div class='n'>" + svcN + "</div><div class='l'>Menu Types</div></div>"
                + "<div class='t4-stat'><div class='n'>" + itemN + "</div><div class='l'>Items</div></div>"

        /* ── HERO T6: Logistics / Transport ── */
        function heroT6(d) {

                + "<div class='t6-pill'><span class='t6-dot'></span>Fast &amp; Reliable Delivery</div>"

                + "<div class='t6-cta'>"

        /* ── HERO T8: Construction / Hardware ── */

                + "<div class='t8-inner'>"
                + "<div class='t8-rule-row'><div class='t8-rule'></div><div class='t8-rule-lbl'>Quality You Can Count On</div></div>"
                + "<h1>" + esc(d.name).replace(/ /, " <em>") + (d.name.indexOf(" ") !== -1 ? "</em>" : "") + "</h1>"
                + (d.address ? "<p class='t8-sub'>" + esc(d.address) + "</p>" : "")

                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-t8o'><i class='fa-solid fa-phone'></i> Call</a>" : "")

        /* ── HERO T9: School / Education ── */
        function heroT9(d) {
            var logoHtml = d.logo
                ? "<div class='t9-logo'><img src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\"></div>"
                : "<div class='t9-logo'><span style='font-family:Playfair Display,serif;font-size:1.3rem;color:#5078ff;font-weight:700;'>" + esc((d.name || "B")[0]) + "</span></div>";
            return "<section id='home' class='hero-t9'>"
                + "<div class='t9-glow'></div>"
                + logoHtml
                + "<div class='t9-ticker'><span class='t9-dot'></span>Enroll Today</div>"
                + "<h1>" + esc(d.name) + "</h1>"
                + "<div class='t9-divider'></div>"
                + (d.address ? "<p class='t9-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t9-cta'>"

        /* ── HERO T10: Financial / POS ── */
        function heroT10(d) {
            var parts = d.name.split(" ");
            var first = parts.slice(0, -1).join(" ") || d.name;
            var last = parts.length > 1 ? parts.slice(-1)[0] : "";
            return "<section id='home' class='hero-t10'>"
                + "<div class='t10-bg'></div><div class='t10-grid'></div>"
                + (d.logo ? "<img class='t10-logo-top' src='" + esc(d.logo) + "' onerror=\"this.style.display='none'\">" : "")
                + "<div class='t10-inner'>"
                + "<span class='t10-eyebrow'>Trusted Financial Services</span>"
                + "<h1>" + esc(first) + (last ? " <span>" + esc(last) + "</span>" : "") + "</h1>"
                + (d.address ? "<p class='t10-sub'>" + esc(d.address) + "</p>" : "")
                + "<div class='t10-cta'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-t10'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")

                + (d.email ? "<a href='mailto:" + esc(d.email) + "' class='btn btn-t10o'><i class='fa-solid fa-envelope'></i> Email</a>" : "")
                + "</div></div></section>";
        }

        /* ── SHARED COMPONENTS ── */
        function escSplit(name) {
            /* Italicise last word */
            var parts = esc(name).split(" ");
            if (parts.length < 2) return parts.join(" ");
            return parts.slice(0, -1).join(" ") + " <em>" + parts.slice(-1)[0] + "</em>";
        }

        function ctaFull(d) {
            return "<div style='display:flex;gap:12px;flex-wrap:wrap;'>"
                + (d.whatsapp ? "<a href='" + waLink(d.whatsapp) + "' class='btn btn-p'><i class='fa-brands fa-whatsapp'></i> WhatsApp</a>" : "")
                + (d.phone ? "<a href='tel:" + esc(d.phone) + "' class='btn btn-o'><i class='fa-solid fa-phone'></i> Call</a>" : "")
                + (d.email ? "<a href='mailto:" + esc(d.email) + "' class='btn btn-g'><i class='fa-solid fa-envelope'></i> Email</a>" : "")
                + "</div>";
        }

        function svcSection(svcs, isPaid) {
            if (!svcs.length) return "";
            var gridClass = isPaid ? "svc-grid-paid" : "svc-grid-free";
            var cards = svcs.map(function (s) {
                var short = s.desc.length > 110 ? s.desc.substring(0, 108) + "\u2026" : s.desc;
                var more = s.desc.length > 110 ? "<button class='read-more' onclick=\"openLpModal('Service','" + escA(s.title) + "','','" + escA(s.desc) + "')\">Read more <i class='fa-solid fa-arrow-right' style='font-size:.55rem'></i></button>" : "";
                var img = s.image ? "<img class='svc-img' src='" + esc(s.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=svc-img-ph><i class=\\'fa-solid fa-gear\\'></i></div>'\">" : "<div class='svc-img-ph'><i class='fa-solid fa-gear'></i></div>";
                return "<div class='svc-card reveal'>" + img + "<div class='svc-body'><h3>" + esc(s.title) + "</h3><p>" + esc(short) + "</p>" + more + "</div></div>";
            }).join("");
            return "<section class='sec' id='sec-services'>"
                + "<div class='content-wrap-svc'>"
                + "<div class='sec-hdr'><div class='eyebrow'>What We Offer</div><div class='h2'>Our Services</div><div class='lead'>Professional services delivered with consistency and care.</div></div>"
                + "<div class='" + gridClass + "'>" + cards + "</div>"
                + "</div></section>";
        }

        function renderItems() {
            var target = document.getElementById("items-target");
            if (!target || !ALL_ITEMS.length) { if (target) target.remove(); return; }
            var per = D.isPaid ? PAID_PER_PAGE : FREE_PER_PAGE;
            var tot = Math.ceil(ALL_ITEMS.length / per);
            ITEMS_PAGE = Math.max(1, Math.min(ITEMS_PAGE, tot || 1));
            var vis = ALL_ITEMS.slice((ITEMS_PAGE - 1) * per, ITEMS_PAGE * per);
            var cards = vis.map(function (it) {
                var short = it.desc.length > 70 ? it.desc.substring(0, 68) + "\u2026" : it.desc;
                var img = it.image ? "<img class='item-img' src='" + esc(it.image) + "' loading='lazy' onerror=\"this.outerHTML='<div class=item-img-ph><i class=\\'fa-solid fa-box\\'></i></div>'\">" : "<div class='item-img-ph'><i class='fa-solid fa-box'></i></div>";
                return "<div class='item-card reveal' onclick=\"openLpModal('Product','" + escA(it.name) + "','" + escA(it.price) + "','" + escA(it.desc) + "')\">" + img + "<div class='item-body'><div class='item-name'>" + esc(it.name) + "</div>" + (it.price ? "<div class='item-price'>" + esc(it.price) + "</div>" : "") + (short ? "<div class='item-desc'>" + esc(short) + "</div>" : "") + "</div></div>";
            }).join("");
            var pager = pagerHtml(tot);
            target.outerHTML = "<section class='sec' id='sec-items'><div class='content-wrap-item'>"
                + "<div class='sec-hdr'><div class='eyebrow'>Browse</div><div class='h2'>Products &amp; Items</div><div class='lead'>Tap any item to view full details.</div></div>"
                + "<div class='item-grid'>" + cards + "</div>" + pager + "</div></section>";
            document.querySelectorAll("[data-pg]").forEach(function (btn) {
                btn.addEventListener("click", function (e) {
                    e.preventDefault(); ITEMS_PAGE = parseInt(this.dataset.pg);
                    var url = new URL(window.location); url.searchParams.set("p", ITEMS_PAGE); history.replaceState({}, "", url);
                    var s = document.getElementById("sec-items"); if (s) s.outerHTML = "<div id='items-target'></div>";
                    renderItems(); setTimeout(function () { var s2 = document.getElementById("sec-items"); if (s2) s2.scrollIntoView({ behavior: "smooth", block: "start" }); }, 100); initScrollReveal();
                });
            });
            initScrollReveal();
        }

        function pagerHtml(tot) {
            if (tot <= 1) return "";
            var b = "";
            if (ITEMS_PAGE > 1) b += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE - 1) + "'>&larr; Prev</button>";
            for (var i = 1; i <= tot; i++) b += "<button class='pg-btn" + (i === ITEMS_PAGE ? " pg-active" : "") + "' data-pg='" + i + "'>" + i + "</button>";
            if (ITEMS_PAGE < tot) b += "<button class='pg-btn' data-pg='" + (ITEMS_PAGE + 1) + "'>Next &rarr;</button>";
            return "<div class='pager'>" + b + "</div>";
        }

        function contactSection(d) {
            var rows = [];
            if (d.phone) rows.push({ ic: "fa-phone", lb: "Phone", v: d.phone, hr: "tel:" + d.phone });
            if (d.whatsapp) rows.push({ ic: "fa-brands fa-whatsapp", lb: "WhatsApp", v: d.whatsapp, hr: waLink(d.whatsapp) });
            if (d.email) rows.push({ ic: "fa-envelope", lb: "Email", v: d.email, hr: "mailto:" + d.email });
            if (d.address) rows.push({ ic: "fa-location-dot", lb: "Address", v: d.address, hr: null });
            if (d.url) rows.push({ ic: "fa-globe", lb: "Website", v: d.url, hr: d.url });
            if (!rows.length) return "";
            var cards = rows.map(function (r) {
                var cls = r.ic.indexOf("fa-brands") !== -1 ? r.ic : "fa-solid " + r.ic;
                var v = r.hr ? "<a href='" + esc(r.hr) + "' target='_blank' style='color:var(--amber);word-break:break-all;'>" + esc(r.v) + "</a>" : esc(r.v);
                return "<div class='ci-card reveal'><div class='ci-icon'><i class='" + cls + "'></i></div><div style='min-width:0;'><div class='ci-lbl'>" + r.lb + "</div><div class='ci-val'>" + v + "</div></div></div>";
            }).join("");
            return "<section class='contact-section' id='sec-contact'><div class='contact-inner'>"
                + "<div class='sec-hdr'><div class='eyebrow'>Get In Touch</div><div class='h2'>Contact Us</div><div class='lead'>We&rsquo;re here to help.</div></div>"
                + "<div class='ci-grid'>" + cards + "</div>"
                + "</div></section>";
        }

        function footerSec(d) {
            return "<footer class='lp-footer'><div class='foot-name'>" + esc(d.name) + "</div>"
                + (d.regNo ? "<div class='foot-meta'>RC: " + esc(d.regNo) + "</div>" : "")
                + (d.address ? "<div class='foot-meta'>" + esc(d.address) + "</div>" : "")
                + "<div class='foot-copy'>&copy; " + new Date().getFullYear() + " " + esc(d.name) + ". All rights reserved.</div></footer>";
        }

        function navBar(d) {
            var logo = d.logo ? "<img src='" + esc(d.logo) + "' alt='logo' onerror=\"this.style.display='none'\">" : "<div class='brand-fallback'>" + esc((d.name || "B")[0]) + "</div>";
            var cta = (d.whatsapp || d.phone) ? "<a href='" + (d.whatsapp ? waLink(d.whatsapp) : "tel:" + d.phone) + "' class='nav-cta'><i class='fa-brands fa-whatsapp'></i> Contact</a>" : "";
            return "<nav class='lp-nav'>"
                + "<div class='brand'>" + logo + "<span class='brand-name'>" + esc(d.name) + "</span></div>"
                + "<button class='nav-toggle' onclick=\"document.getElementById('nav-links').classList.toggle('open')\"><i class='fa-solid fa-bars'></i></button>"
                + "<ul class='nav-links' id='nav-links'><li><a href='#home'>Home</a></li><li><a href='#sec-services'>Services</a></li><li><a href='#sec-items'>Products</a></li><li><a href='#sec-contact'>Contact</a></li></ul>"
                + cta + "</nav>";
        }

        function adBox() { return "<div class='adbox'><span>&#128226;</span>Advertisement Space<br><small>Contact <a href='https://thevictorias.com.ng'>thevictorias.com.ng</a></small></div>"; }
        function expiredBanner() { return "<div class='expnotice' style='margin:16px 48px;'>&#9888; Paid plan expired &mdash; showing free version. <a href='https://thevictorias.com.ng/contact.html'>Upgrade &rarr;</a></div>"; }
        function poweredBy() { return "<div class='pwby'>Powered by <a href='https://thevictorias.com.ng' target='_blank'>thevictorias.com.ng</a> &nbsp;|&nbsp; <a href='https://thevictorias.com.ng/contact.html' target='_blank'>Get your own page</a></div>"; }
        function modalHTML() {
            return "<div id='lpModal'><div>"
                + "<button class='modal-close' onclick='closeLpModal()'>&times;</button>"
                + "<div id='lpmEy'></div><div id='lpmT'></div><div id='lpmP'></div><p id='lpmB'></p>"
                + "</div></div>";
        }

        function buildSvc(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), o = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); o.push({ image: imgs[i] || "", title: (p[0] || "Service " + (i + 1)).trim(), desc: (p[1] || "").trim() }); }
            return o;
        }
        function buildItem(imgs, descs, limit) {
            var n = Math.min(Math.max(imgs.length, descs.length), limit), o = [];
            for (var i = 0; i < n; i++) { var p = (descs[i] || "").split("::"); o.push({ image: imgs[i] || "", name: (p[0] || "Item " + (i + 1)).trim(), price: (p[1] || "").trim(), desc: (p[2] || "").trim() }); }
            return o;
        }

        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
        function escA(s) { return String(s || "").replace(/'/g, "&#39;").replace(/"/g, "&quot;").replace(/\n/g, " "); }

        function initModal() { var m = document.getElementById("lpModal"); if (m) m.addEventListener("click", function (e) { if (e.target === this) closeLpModal(); }); }
        function openLpModal(ey, t, p, b) { document.getElementById("lpmEy").textContent = ey || ""; document.getElementById("lpmT").textContent = t || ""; document.getElementById("lpmP").textContent = p || ""; document.getElementById("lpmB").textContent = b || ""; var m = document.getElementById("lpModal"); m.style.display = "flex"; document.body.style.overflow = "hidden"; }
        function closeLpModal() { var m = document.getElementById("lpModal"); if (m) { m.style.display = "none"; document.body.style.overflow = ""; } }
        function initScrollReveal() { var obs = new IntersectionObserver(function (e) { e.forEach(function (x) { if (x.isIntersecting) x.target.classList.add("in"); }); }, { threshold: .1 }); document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { obs.observe(el); }); }
        function initNavScroll() { window.addEventListener("scroll", function () { var nav = document.querySelector(".lp-nav"); if (nav) nav.style.borderBottomColor = window.scrollY > 40 ? "rgba(224,116,16,.18)" : "rgba(255,255,255,.08)"; }); }
        function showError(msg) { document.getElementById("lp-loader").style.display = "none"; document.getElementById("lp-root").style.display = "block"; document.getElementById("lp-page").innerHTML = "<div style='min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;'><div><div style='font-family:Playfair Display,serif;font-size:3.5rem;color:rgba(255,255,255,.06);font-weight:900;'>404</div><p style='color:var(--muted);margin:16px 0 28px;'>" + esc(msg) + "</p><a href='https://thevictorias.com.ng' style='color:var(--amber);font-size:.875rem;'>&larr; The Victorias Ltd</a></div></div>" + poweredBy(); }
    </script>
