<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Business Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --color-h: #0a0a1a;
            --color-ht: #e0e0ff;
            --color-f: #00d4ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            color: #e0e0ff;
            background: #050510;
            overflow-x: hidden;
            line-height: 1.7;
        }

        /* Loader */
        #lp-loader {
            position: fixed;
            inset: 0;
            background: #050510;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .lp-spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(0, 212, 255, .15);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Main Content */
        #lp-root {
            display: none;
        }

        .lp-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 78px;
            padding: 0 40px;
            background: rgba(5, 5, 20, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
        }

        .brand img {
            height: 48px;
            width: 48px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid rgba(0, 212, 255, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: rgba(224, 224, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--color-f);
        }

        /* Hero - Consistent across templates */
        .lp-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--color-h), #0f1b2e);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
            text-align: center;
        }

        .hero-content h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(3rem, 9vw, 5.5rem);
            font-weight: 700;
            line-height: 1.05;
            margin-bottom: 24px;
            color: #fff;
        }

        .section-eyebrow {
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(0, 212, 255, 0.8);
            margin-bottom: 12px;
        }

        /* Sections - Hidden until navigated */
        .lp-section {
            padding: 120px 40px;
            max-width: 1240px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .lp-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-family: "Space Grotesk", sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
        }

        .section-divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(to right, var(--color-f), transparent);
            margin-bottom: 60px;
        }

        /* Cards - Fixed & Professional */
        .services-grid,
        .items-grid {
            display: grid;
            gap: 32px;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .svc-card,
        .item-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 212, 255, 0.18);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .svc-card:hover,
        .item-card:hover {
            transform: translateY(-12px);
            border-color: var(--color-f);
            box-shadow: 0 25px 60px rgba(0, 212, 255, 0.2);
        }

        .svc-card img,
        .item-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
        }

        .card-body {
            padding: 32px;
        }

        .card-body h3 {
            font-size: 1.35rem;
            margin-bottom: 12px;
        }

        .desc-short {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more-btn {
            color: var(--color-f);
            background: none;
            border: none;
            cursor: pointer;
            margin-top: 12px;
            font-weight: 600;
        }

        /* Contact & Footer */
        .contact-grid {
            display: grid;
            gap: 28px;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        }

        .contact-item {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid rgba(0, 212, 255, 0.15);
            padding: 28px;
            border-radius: 16px;
        }

        .lp-footer {
            padding: 80px 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(0, 212, 255, 0.15);
        }

        .powered-by {
            background: #000;
            padding: 16px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 78px;
                left: 0;
                right: 0;
                background: rgba(5, 5, 20, 0.98);
                padding: 30px;
            }

            .nav-links.open {
                display: flex;
            }

            .lp-section {
                padding: 80px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Loader -->
    <div id="lp-loader">
        <div class="lp-spinner"></div>
        <p>LOADING EXPERIENCE…</p>
    </div>

    <div id="lp-root"></div>

    <script>
        const GATEWAY_URL = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";

        function getSlug() {
            const params = new URLSearchParams(window.location.search);
            return (params.get("slug") || params.get("page") || "").toUpperCase();
        }

        async function loadPage() {
            const slug = getSlug();
            if (!slug) return renderError("No business page specified.");

            try {
                const res = await fetch(GATEWAY_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "getLandingPage", slug })
                });
                const data = await res.json();
                if (data.success) renderFullPage(data.data);
                else renderError(data.message || "Page not found");
            } catch (e) {
                renderError("Connection error");
            }
        }

        function renderFullPage(d) {
            document.getElementById("lp-loader").style.display = "none";
            const root = document.getElementById("lp-root");
            root.style.display = "block";

            // Set colors
            document.documentElement.style.setProperty("--color-h", d.colourHeader || "#0a0a1a");
            document.documentElement.style.setProperty("--color-ht", d.colourHeaderText || "#e0e0ff");
            document.documentElement.style.setProperty("--color-f", d.colourFooter || "#00d4ff");

            const services = buildServices(d.servicesImages || [], d.servicesDescrip || []);
            const items = buildItems(d.itemsImages || [], d.itemsDescrip || []);

            const html = `
                ${navHTML(d)}
                ${heroHTML(d)}
                ${servicesSection(services)}
                ${itemsSection(items, d.isPaid)}
                ${contactSection(d)}
                ${footerHTML(d)}
                ${poweredBy()}
            `;

            root.innerHTML = html;
            initNavigation();
        }

        function navHTML(d) {
            return `
                <nav class="lp-nav">
                    <div class="brand">
                        ${d.logo ? `<img src="${esc(d.logo)}" alt="logo">` : ''}
                        <span>${esc(d.name)}</span>
                    </div>
                    <ul class="nav-links" id="nav-links">
                        <li><a href="#home" class="active">Home</a></li>
                        <li><a href="#services">Services</a></li>
                        <li><a href="#items">Products</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </nav>`;
        }

        function heroHTML(d) {
            return `
                <section class="lp-hero" id="home">
                    <div class="hero-content">
                        ${d.logo ? `<img src="${esc(d.logo)}" style="height:130px; margin-bottom:32px; filter: drop-shadow(0 20px 40px rgba(0,212,255,0.4));" alt="logo">` : ''}
                        <div class="section-eyebrow">EXCELLENCE • INTEGRITY • RESULTS</div>
                        <h1>${esc(d.name)}</h1>
                        ${d.address ? `<p style="max-width:700px; margin:0 auto 40px; font-size:1.2rem; color:rgba(255,255,255,0.85);">${esc(d.address)}</p>` : ''}
                        <div class="cta-row" style="margin-top:40px;">
                            ${d.whatsapp ? `<a href="https://wa.me/${d.whatsapp.replace(/\D/g, '')}" class="btn btn-primary"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : ''}
                            ${d.phone ? `<a href="tel:${esc(d.phone)}" class="btn btn-outline"><i class="fa-solid fa-phone"></i> Call Us</a>` : ''}
                        </div>
                    </div>
                </section>`;
        }

        function servicesSection(services) {
            if (!services.length) return '';
            const cards = services.map(s => `
                <div class="svc-card">
                    ${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title)}">` : '<div style="height:230px;background:#111;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#333;">⚙</div>'}
                    <div class="card-body">
                        <h3>${esc(s.title)}</h3>
                        <p class="desc-short">${esc(s.desc || '')}</p>
                        ${s.desc && s.desc.length > 180 ? `<button class="read-more-btn" onclick="toggleReadMore(this)">Read more →</button>` : ''}
                    </div>
                </div>
            `).join('');

            return `
                <section class="lp-section" id="services">
                    <div class="section-eyebrow">WHAT WE OFFER</div>
                    <div class="section-title">Our Services</div>
                    <div class="section-divider"></div>
                    <div class="services-grid">${cards}</div>
                </section>`;
        }

        function itemsSection(items, isPaid) {
            if (!items.length) return '';
            const cards = items.map(it => `
                <div class="item-card">
                    ${it.image ? `<img src="${esc(it.image)}" alt="${esc(it.name)}">` : '<div style="height:230px;background:#111;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#333;">📦</div>'}
                    <div class="card-body">
                        <h3>${esc(it.name)}</h3>
                        ${it.price ? `<div style="color:var(--color-f);font-weight:700;font-size:1.3rem;margin:8px 0;">${esc(it.price)}</div>` : ''}
                        <p class="desc-short">${esc(it.desc || '')}</p>
                    </div>
                </div>
            `).join('');

            return `
                <section class="lp-section" id="items">
                    <div class="section-eyebrow">OUR COLLECTION</div>
                    <div class="section-title">Products &amp; Services</div>
                    <div class="section-divider"></div>
                    <div class="items-grid">${cards}</div>
                </section>`;
        }

        function contactSection(d) {
            return `
                <section class="lp-section" id="contact">
                    <div class="section-eyebrow">GET IN TOUCH</div>
                    <div class="section-title">Contact Us</div>
                    <div class="section-divider"></div>
                    <div class="contact-grid">
                        ${d.phone ? `<div class="contact-item"><i class="fa-solid fa-phone"></i><div><strong>Phone</strong><br>${esc(d.phone)}</div></div>` : ''}
                        ${d.whatsapp ? `<div class="contact-item"><i class="fa-brands fa-whatsapp"></i><div><strong>WhatsApp</strong><br>${esc(d.whatsapp)}</div></div>` : ''}
                        ${d.email ? `<div class="contact-item"><i class="fa-solid fa-envelope"></i><div><strong>Email</strong><br>${esc(d.email)}</div></div>` : ''}
                        ${d.address ? `<div class="contact-item"><i class="fa-solid fa-location-dot"></i><div><strong>Address</strong><br>${esc(d.address)}</div></div>` : ''}
                    </div>
                </section>`;
        }

        function footerHTML(d) {
            return `
                <footer class="lp-footer">
                    <div style="font-size:1.6rem;font-weight:700;color:var(--color-f);margin-bottom:16px;">${esc(d.name)}</div>
                    ${d.regNo ? `<p>Reg. No: ${esc(d.regNo)}</p>` : ''}
                    <p>&copy; ${new Date().getFullYear()} All Rights Reserved</p>
                </footer>`;
        }

        function poweredBy() {
            return `<div class="powered-by">Powered by <a href="https://thevictorias.com.ng" target="_blank">The Victorias Ltd</a></div>`;
        }

        function renderError(msg) {
            document.getElementById("lp-loader").style.display = "none";
            document.getElementById("lp-root").innerHTML = `<div style="padding:120px 40px;text-align:center;"><h2>${msg}</h2></div>`;
            document.getElementById("lp-root").style.display = "block";
        }

        function esc(str) {
            return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function toggleReadMore(btn) {
            const card = btn.closest('.svc-card, .item-card');
            const short = card.querySelector('.desc-short');
            if (short) short.style.display = short.style.display === 'none' ? '-webkit-box' : 'none';
            btn.textContent = btn.textContent.includes('more') ? 'Show less ↑' : 'Read more →';
        }

        function initNavigation() {
            const links = document.querySelectorAll('.nav-links a');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = document.querySelector(link.getAttribute('href'));
                    if (target) {
                        links.forEach(l => l.classList.remove('active'));
                        link.classList.add('active');
                        target.scrollIntoView({ behavior: 'smooth' });
                        target.classList.add('visible');
                    }
                });
            });

            // Reveal sections on scroll
            const sections = document.querySelectorAll('.lp-section');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.2 });
            sections.forEach(sec => observer.observe(sec));
        }

        function buildServices(images, descrips) {
            const out = [];
            const len = Math.max(images.length, descrips.length);
            for (let i = 0; i < len; i++) {
                const parts = (descrips[i] || "").split("::");
                out.push({ image: images[i] || "", title: parts[0] || `Service ${i + 1}`, desc: parts[1] || "" });
            }
            return out;
        }

        function buildItems(images, descrips) {
            const out = [];
            const len = Math.max(images.length, descrips.length);
            for (let i = 0; i < len; i++) {
                const parts = (descrips[i] || "").split("::");
                out.push({ image: images[i] || "", name: parts[0] || `Item ${i + 1}`, price: parts[1] || "", desc: parts[2] || "" });
            }
            return out;
        }

        // Start
        window.onload = loadPage;
    </script>
</body>

</html>
