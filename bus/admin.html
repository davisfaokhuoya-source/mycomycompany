<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Business Pages — Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            font-size: 14px;
        }

        :root {
            --primary: #E07410;
            --dark: #1a1a2e;
            --success: #28a745;
            --danger: #dc3545;
            --border: #ddd;
        }

        .app {
            display: grid;
            grid-template-rows: 56px 1fr;
            min-height: 100vh;
        }

        .topbar {
            background: var(--dark);
            color: #fff;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
        }

        .topbar h1 {
            font-size: 1rem;
            font-weight: 600;
        }

        .topbar .badge {
            background: var(--primary);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: .75rem;
        }

        .main {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .08);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-body {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-grid.cols3 {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .form-full {
            grid-column: 1/-1;
        }

        label {
            display: block;
            font-size: .8rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: .3px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-size: .9rem;
            outline: none;
            transition: .2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: .875rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: .2s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-dark {
            background: var(--dark);
            color: #fff;
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-sm {
            padding: 5px 12px;
            font-size: .8rem;
        }

        .btn:hover {
            opacity: .88;
            transform: translateY(-1px);
        }

        .action-row {
            display: flex;
            gap: 6px;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: .875rem;
            color: #888;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: .875rem;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .alert-danger {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .dynamic-row {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .slug-display {
            font-family: monospace;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1.5px dashed var(--border);
        }

        @media(max-width:640px) {

            .form-grid,
            .form-grid.cols3 {
                grid-template-columns: 1fr;
            }

            .main {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="topbar">
            <h1><i class="fa-solid fa-store"></i> Business Pages Manager</h1>
            <span class="badge">Admin</span>
            <span style="margin-left:auto;font-size:.8rem;opacity:.6">thevictorias.com.ng</span>
        </div>

        <div class="main">
            <div id="alert-area"></div>

            <!-- TABS -->
            <div class="tabs">
                <div class="tab active" onclick="switchTab('list')">All Pages</div>
                <div class="tab" onclick="switchTab('create')">+ Create Page</div>
            </div>

            <!-- LIST TAB -->
            <div id="tab-list">
                <div class="card">
                    <div class="card-header">
                        <h2>Business Pages</h2>
                        <div style="display:flex;gap:8px;align-items:center">
                            <select id="filter-paid" onchange="loadPages()"
                                style="padding:6px 10px;border-radius:6px;border:1.5px solid var(--border)">
                                <option value="">All</option>
                                <option value="paid">Paid</option>
                                <option value="free">Free</option>
                            </select>
                            <button class="btn btn-dark btn-sm" onclick="loadPages()"><i class="fa-solid fa-rotate"></i>
                                Refresh</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Business</th>
                                        <th>Slug / URL</th>
                                        <th>Tier</th>
                                        <th>Expires</th>
                                        <th>Template</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="pages-tbody">
                                    <tr>
                                        <td colspan="6" style="text-align:center;color:#aaa;padding:40px"><i
                                                class="fa-solid fa-spinner spin"></i> Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div id="list-pagination" style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"></div>
                    </div>
                </div>
            </div>

            <!-- CREATE TAB -->
            <div id="tab-create" style="display:none">
                <div class="card">
                    <div class="card-header">
                        <h2>Create Business Page</h2>
                    </div>
                    <div class="card-body">
                        <!-- Basic Info -->
                        <div class="form-grid">
                            <div>
                                <label>Business Name *</label>
                                <input type="text" id="f-name" placeholder="e.g. Acme Foods Ltd"
                                    oninput="previewSlug()">
                                <div class="hint">Slug will be auto-derived</div>
                            </div>
                            <div>
                                <label>Slug Preview</label>
                                <div class="slug-display" id="slug-preview">—</div>
                            </div>
                            <!-- Other basic fields -->
                            <div><label>Phone</label><input type="text" id="f-phone"></div>
                            <div><label>WhatsApp</label><input type="text" id="f-whatsapp"></div>
                            <div><label>Email</label><input type="email" id="f-email"></div>
                            <div><label>Website URL</label><input type="text" id="f-url"></div>
                            <div class="form-full"><label>Address</label><input type="text" id="f-address"></div>
                            <div><label>Logo URL</label><input type="text" id="f-logo"></div>
                            <div><label>Reg. Number</label><input type="text" id="f-regno"></div>
                        </div>

                        <hr style="margin:24px 0">
                        <h3>Services</h3>
                        <div id="services-container"></div>
                        <button type="button" class="btn btn-dark btn-sm" onclick="addServiceRow()"><i
                                class="fa-solid fa-plus"></i> Add Service</button>

                        <hr style="margin:24px 0">
                        <h3>Products / Items</h3>
                        <div id="items-container"></div>
                        <button type="button" class="btn btn-dark btn-sm" onclick="addItemRow()"><i
                                class="fa-solid fa-plus"></i> Add Item</button>

                        <hr style="margin:24px 0">
                        <h3>Tier & Appearance</h3>
                        <div class="form-grid cols3">
                            <div>
                                <label>Tier</label>
                                <select id="f-paid" onchange="togglePaidFields()">
                                    <option value="0">Free</option>
                                    <option value="1">Paid</option>
                                </select>
                            </div>
                            <div>
                                <label>Template</label>
                                <select id="f-template">
                                    <optgroup label="FREE TEMPLATES">
                                        <option value="free1">Neural Glow</option>
                                        <option value="free2">Terminal</option>
                                        <option value="free3">Hologram</option>
                                        <option value="free4">Data Grid</option>
                                        <option value="free5">Aurora</option>
                                    </optgroup>
                                    <optgroup label="PAID TEMPLATES">
                                        <option value="neo">Neo</option>
                                        <option value="cyber">Cyber</option>
                                        <option value="quantum">Quantum</option>
                                        <option value="prism">Prism</option>
                                        <option value="matrix">Matrix</option>
                                    </optgroup>
                                </select>
                            </div>
                            <div>
                                <label>Expiry Date (Paid)</label>
                                <input type="date" id="f-expires">
                            </div>
                        </div>

                        <div class="btn-row">
                            <button class="btn btn-primary" onclick="createPage()" id="btn-create">
                                <i class="fa-solid fa-plus"></i> Create Page
                            </button>
                            <button class="btn btn-dark" onclick="switchTab('list')">Cancel</button>
                        </div>
                        <div id="create-result"></div>
                    </div>
                </div>
            </div>

            <!-- EDIT MODAL -->
            <div id="edit-modal"
                style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;overflow-y:auto">
                <div style="max-width:720px;margin:40px auto;padding:0 16px">
                    <div class="card">
                        <div class="card-header">
                            <h2>Edit Page: <span id="edit-slug-label"></span></h2>
                            <button class="btn btn-sm" onclick="closeEdit()" style="background:#eee;color:#333"><i
                                    class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="card-body">
                            <div class="form-grid">
                                <div><label>Business Name</label><input type="text" id="e-name"></div>
                                <div><label>Phone</label><input type="text" id="e-phone"></div>
                                <div><label>WhatsApp</label><input type="text" id="e-whatsapp"></div>
                                <div><label>Email</label><input type="text" id="e-email"></div>
                                <div class="form-full"><label>Address</label><input type="text" id="e-address"></div>
                                <div><label>Logo URL</label><input type="text" id="e-logo"></div>
                                <div><label>Reg No</label><input type="text" id="e-regno"></div>
                                <div><label>Website</label><input type="text" id="e-url"></div>
                            </div>

                            <h3 style="margin:20px 0 10px">Services</h3>
                            <div id="edit-services-container"></div>
                            <button type="button" class="btn btn-dark btn-sm" onclick="addEditServiceRow()"><i
                                    class="fa-solid fa-plus"></i> Add Service</button>

                            <h3 style="margin:20px 0 10px">Items</h3>
                            <div id="edit-items-container"></div>
                            <button type="button" class="btn btn-dark btn-sm" onclick="addEditItemRow()"><i
                                    class="fa-solid fa-plus"></i> Add Item</button>

                            <div class="form-grid" style="margin-top:20px">
                                <div><label>Template</label><select id="e-template" onchange="updateTemplateHint()">
                                        <optgroup label="FREE">
                                            <option value="free1">Neural Glow</option>
                                            <option value="free2">Terminal</option>
                                            <option value="free3">Hologram</option>
                                            <option value="free4">Data Grid</option>
                                            <option value="free5">Aurora</option>
                                        </optgroup>
                                        <optgroup label="PAID">
                                            <option value="neo">Neo</option>
                                            <option value="cyber">Cyber</option>
                                            <option value="quantum">Quantum</option>
                                            <option value="prism">Prism</option>
                                            <option value="matrix">Matrix</option>
                                        </optgroup>
                                    </select></div>
                                <div><label>Expiry Date</label><input type="date" id="e-expires"></div>
                                <div class="form-full"><label>Colours (header|text|footer)</label><input type="text"
                                        id="e-colours" placeholder="#1a1a2e|#ffffff|#E07410"></div>
                            </div>

                            <div class="btn-row">
                                <button class="btn btn-primary" onclick="saveEdit()" id="btn-save"><i
                                        class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                                <button class="btn" style="background:#eee;color:#333"
                                    onclick="closeEdit()">Cancel</button>
                            </div>
                            <div id="edit-result"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ── CONFIG ───────────────────────────────────────────────────
        var GATEWAY = "https://script.google.com/macros/s/AKfycbwcCgpVYQmIILB7OrNaLfEco1P8fdVxU_8RNpo92AFDPQ2VqIi8U99edSMOiVyzm_WGQQ/exec";
        var ADMIN_TOKEN = sessionStorage.getItem("biz_admin_token") || promptToken();

        function promptToken() {
            var t = prompt("Enter admin token:");
            if (t) sessionStorage.setItem("biz_admin_token", t);
            return t || "";
        }

        // ── API ──────────────────────────────────────────────────────
        function api(action, body) {
            return fetch(GATEWAY, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(Object.assign({
                    system: "business",
                    action: action,
                    token: ADMIN_TOKEN
                }, body))
            }).then(r => r.json());
        }

        // ── TABS ─────────────────────────────────────────────────────
        function switchTab(tab) {
            document.getElementById("tab-list").style.display = tab === "list" ? "block" : "none";
            document.getElementById("tab-create").style.display = tab === "create" ? "block" : "none";
            document.querySelectorAll(".tab").forEach((t, i) => {
                t.classList.toggle("active", (i === 0 && tab === "list") || (i === 1 && tab === "create"));
            });
            if (tab === "list") loadPages();
        }

        // ── UTILS ────────────────────────────────────────────────────
        function esc(s) {
            return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function showAlert(msg, type) {
            var el = document.getElementById("alert-area");
            el.innerHTML = `<div class='alert alert-${type}'>${esc(msg)}</div>`;
            setTimeout(() => el.innerHTML = "", 5000);
        }

        function deriveSlug(name) {
            return String(name).toUpperCase()
                .replace(/\s+/g, "-").replace(/[^A-Z0-9\-]/g, "")
                .replace(/-+/g, "-").replace(/^-|-$/g, "").substring(0, 30);
        }

        function previewSlug() {
            var name = document.getElementById("f-name").value;
            var slug = deriveSlug(name);
            document.getElementById("slug-preview").textContent = slug || "—";
        }

        function val(id) { return document.getElementById(id).value.trim(); }

        // ── DYNAMIC ROWS ─────────────────────────────────────────────
        function addServiceRow(containerId = "services-container") {
            const container = document.getElementById(containerId);
            const div = document.createElement("div");
            div.className = "dynamic-row";
            div.innerHTML = `
                <div class="form-grid">
                    <div>
                        <label>Image URL</label>
                        <input type="text" placeholder="https://example.com/image.jpg">
                    </div>
                    <div>
                        <label>Title</label>
                        <input type="text" placeholder="Service Title">
                    </div>
                    <div class="form-full">
                        <label>Description</label>
                        <textarea rows="2" placeholder="Service description..."></textarea>
                    </div>
                </div>
                <div style="text-align:right; margin-top:8px;">
                    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.dynamic-row').remove()">
                        <i class="fa-solid fa-trash"></i> Remove
                    </button>
                </div>
            `;
            container.appendChild(div);
        }

        function addItemRow(containerId = "items-container") {
            const container = document.getElementById(containerId);
            const div = document.createElement("div");
            div.className = "dynamic-row";
            div.innerHTML = `
                <div class="form-grid">
                    <div>
                        <label>Image URL</label>
                        <input type="text" placeholder="https://example.com/image.jpg">
                    </div>
                    <div>
                        <label>Name</label>
                        <input type="text" placeholder="Product Name">
                    </div>
                    <div>
                        <label>Price</label>
                        <input type="text" placeholder="₦25,000">
                    </div>
                    <div class="form-full">
                        <label>Description</label>
                        <textarea rows="2" placeholder="Product description..."></textarea>
                    </div>
                </div>
                <div style="text-align:right; margin-top:8px;">
                    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.dynamic-row').remove()">
                        <i class="fa-solid fa-trash"></i> Remove
                    </button>
                </div>
            `;
            container.appendChild(div);
        }

        // Edit versions
        function addEditServiceRow() { addServiceRow("edit-services-container"); }
        function addEditItemRow() { addItemRow("edit-items-container"); }

        // Collect Data
        function collectServices(containerId) {
            const rows = document.querySelectorAll(`#${containerId} .dynamic-row`);
            const arr = [];
            rows.forEach(row => {
                const inputs = row.querySelectorAll("input, textarea");
                if (inputs.length >= 2) {
                    const title = inputs[1].value.trim();
                    const desc = inputs[2] ? inputs[2].value.trim() : "";
                    if (title) arr.push(`${title}::${desc}`);
                }
            });
            return arr.join("|");
        }

        function collectItems(containerId) {
            const rows = document.querySelectorAll(`#${containerId} .dynamic-row`);
            const arr = [];
            rows.forEach(row => {
                const inputs = row.querySelectorAll("input, textarea");
                if (inputs.length >= 3) {
                    const name = inputs[1].value.trim();
                    const price = inputs[2].value.trim();
                    const desc = inputs[3] ? inputs[3].value.trim() : "";
                    if (name) arr.push(`${name}::${price}::${desc}`);
                }
            });
            return arr.join("|");
        }

        // ── CREATE PAGE ──────────────────────────────────────────────
        function togglePaidFields() {
            const isPaid = document.getElementById("f-paid").value === "1";
            // You can extend this for color fields if needed
        }

        function createPage() {
            const name = val("f-name");
            if (!name) return showAlert("Business name is required", "danger");

            const btn = document.getElementById("btn-create");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner spin"></i> Creating...`;

            api("createPage", {
                name: name,
                phone: val("f-phone"),
                whatsapp: val("f-whatsapp"),
                email: val("f-email"),
                address: val("f-address"),
                logo: val("f-logo"),
                regNo: val("f-regno"),
                url: val("f-url"),
                servicesImages: "",           // You can extend later for image collection
                servicesDescrip: collectServices("services-container"),
                itemsImages: "",
                itemsDescrip: collectItems("items-container"),
                isPaid: document.getElementById("f-paid").value === "1",
                template: val("f-template"),
                expires: val("f-expires"),
                colours: "",
                accentColour: "#E07410"
            }).then(res => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-plus"></i> Create Page`;
                if (res.success) {
                    document.getElementById("create-result").innerHTML = `
                        <div class='alert alert-success'>
                            ✅ Page created successfully!<br>
                            <a href="https://thevictorias.com.ng/bus/${esc(res.slug?.toLowerCase())}" target="_blank">
                                View Page →
                            </a>
                        </div>`;
                    // Clear form
                    document.getElementById("services-container").innerHTML = "";
                    document.getElementById("items-container").innerHTML = "";
                } else {
                    document.getElementById("create-result").innerHTML = `<div class='alert alert-danger'>❌ ${esc(res.message)}</div>`;
                }
            }).catch(() => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-plus"></i> Create Page`;
            });
        }

        // ── LIST PAGES ───────────────────────────────────────────────
        var currentPage = 1;

        function loadPages(pg) {
            currentPage = pg || 1;
            const tbody = document.getElementById("pages-tbody");
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#aaa"><i class="fa-solid fa-spinner spin"></i> Loading…</td></tr>`;

            api("listPages", { page: currentPage, filter: document.getElementById("filter-paid").value })
                .then(res => {
                    if (!res.success) {
                        tbody.innerHTML = `<tr><td colspan="6" style="color:#c00;padding:20px">${esc(res.message)}</td></tr>`;
                        return;
                    }
                    if (!res.data || res.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#aaa;padding:40px">No pages found.</td></tr>`;
                        return;
                    }

                    tbody.innerHTML = res.data.map(p => {
                        const slug = String(p.cTrackingNo || "").toLowerCase();
                        const isPaid = p.isPaid === true || String(p.isPaid).toUpperCase() === "TRUE";
                        const tierBadge = isPaid ? `<span class="badge-paid">Paid</span>` : `<span class="badge-free">Free</span>`;

                        return `<tr>
                        <td><strong>${esc(p.cName || "—")}</strong></td>
                        <td><a href="https://thevictorias.com.ng/bus/${esc(slug)}" target="_blank" class="preview-link">${esc(slug)}</a></td>
                        <td>${tierBadge}</td>
                        <td>${esc(p.Expires ? p.Expires.split("T")[0] : "—")}</td>
                        <td>${esc(p.cTemplate || "—")}</td>
                        <td class="action-row">
                            <button class="btn btn-dark btn-sm" onclick='openEdit(${JSON.stringify(p)})'><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deletePage('${esc(p.cTrackingNo)}', '${esc(p.cName)}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
                    }).join("");
                })
                .catch(e => showAlert("Connection error", "danger"));
        }

        // ── EDIT FUNCTIONS ───────────────────────────────────────────
        var editSlug = "";

        function openEdit(p) {
            editSlug = String(p.cTrackingNo || "").toUpperCase();
            document.getElementById("edit-slug-label").textContent = editSlug;

            document.getElementById("e-name").value = p.cName || "";
            document.getElementById("e-phone").value = p.cPhoneNo || "";
            document.getElementById("e-whatsapp").value = p.cWhatsapp || "";
            document.getElementById("e-email").value = p.cEmail || "";
            document.getElementById("e-address").value = p.cAddress || "";
            document.getElementById("e-logo").value = p.cLogo || "";
            document.getElementById("e-regno").value = p.cRegNo || "";
            document.getElementById("e-url").value = p.cURL || "";
            document.getElementById("e-template").value = p.cTemplate || "neo";
            document.getElementById("e-expires").value = p.Expires ? String(p.Expires).split("T")[0] : "";
            document.getElementById("e-colours").value = p.cColours || "";

            // Clear previous dynamic rows
            document.getElementById("edit-services-container").innerHTML = "";
            document.getElementById("edit-items-container").innerHTML = "";

            document.getElementById("edit-modal").style.display = "block";
        }

        function updateTemplateHint() {
            // Optional hint
        }

        function closeEdit() {
            document.getElementById("edit-modal").style.display = "none";
            editSlug = "";
        }

        function saveEdit() {
            if (!editSlug) return;
            const btn = document.getElementById("btn-save");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner spin"></i> Saving...`;

            api("updatePage", {
                slug: editSlug,
                name: val("e-name"),
                phone: val("e-phone"),
                whatsapp: val("e-whatsapp"),
                email: val("e-email"),
                address: val("e-address"),
                logo: val("e-logo"),
                regNo: val("e-regno"),
                url: val("e-url"),
                template: val("e-template"),
                expires: val("e-expires"),
                servicesDescrip: collectServices("edit-services-container"),
                itemsDescrip: collectItems("edit-items-container"),
                colours: val("e-colours")
            }).then(res => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Save Changes`;
                document.getElementById("edit-result").innerHTML = res.success
                    ? `<div class='alert alert-success'>✅ ${esc(res.message)}</div>`
                    : `<div class='alert alert-danger'>❌ ${esc(res.message)}</div>`;

                if (res.success) setTimeout(() => { closeEdit(); loadPages(currentPage); }, 1500);
            }).catch(() => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Save Changes`;
            });
        }

        // ── TOGGLE & DELETE ──────────────────────────────────────────
        function togglePaid(slug, currentlyPaid) {
            if (!confirm(currentlyPaid ? "Downgrade to Free?" : "Upgrade to Paid?")) return;
            api("togglePaid", { slug }).then(res => {
                showAlert(res.message, res.success ? "success" : "danger");
                loadPages(currentPage);
            });
        }

        function deletePage(slug, name) {
            if (!confirm(`Delete page for ${name}?`)) return;
            api("deletePage", { slug }).then(res => {
                showAlert(res.message, res.success ? "success" : "danger");
                if (res.success) loadPages(currentPage);
            });
        }

        // ── INIT ─────────────────────────────────────────────────────
        window.onload = () => {
            loadPages();
            // Add one empty row by default in create form
            setTimeout(() => {
                addServiceRow();
                addItemRow();
            }, 800);
        };
    </script>
</body>

</html>
