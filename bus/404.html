<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #E07410;
        }
    </style>
</head>

<body>
    <h1>Redirecting to Business Page...</h1>
    <p>Please wait...</p>

    <script>
        const path = window.location.pathname;
        const match = path.match(/\/bus\/([^/?#]+)/i);

        if (match) {
            const slug = match[1];
            window.location.replace(`/bus/landing.html?slug=${encodeURIComponent(slug)}`);
        } else {
            window.location.replace('/bus/landing.html');
        }
    </script>
</body>

</html>
