<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>

<body>
    <script>
        const path = window.location.pathname;

        // Extract slug from /bus/anything
        const match = path.match(/\/bus\/([^/?#]+)/i);

        if (match) {
            const slug = match[1];
            // Redirect to landing.html with query parameter
            window.location.replace(`/bus/landing.html?slug=${slug}`);
        } else {
            // Fallback
            window.location.replace('/bus/landing.html');
        }
    </script>
</body>

</html>
