<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Generator — The Victorias Ltd</title>
    <script type="module" crossorigin src="/docgen/assets/index-DHnkVpHz.js"></script>
    <link rel="stylesheet" crossorigin href="/docgen/assets/index-y1lIBduY.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Client Document Generator</h1>
        <p class="muted">Every document below is built client-side with the <code>docx</code> package, then either downloaded or saved straight into the client's Drive folder.</p>
      </header>

      <form id="docgenForm">
        <div class="grid">
          <label>
            Document Type
            <select id="docType" required>
              <option value="serviceAgreement">Service Agreement</option>
              <option value="proposal">Proposal</option>
              <option value="onboarding">Onboarding Document</option>
            </select>
          </label>

          <label>
            Client ID
            <input id="clientId" type="text" placeholder="e.g. CL-00231" required />
          </label>

          <label>
            Company Name
            <input id="companyName" type="text" placeholder="e.g. Acme Nigeria Ltd" required />
          </label>

          <label>
            Contact Name
            <input id="contactName" type="text" placeholder="e.g. Adaeze Okoro" />
          </label>

          <label>
            Tier / Package
            <input id="tierLabel" type="text" value="Growth Ops" />
          </label>

          <label>
            Currency
            <select id="currency">
              <option value="NGN">NGN</option>
              <option value="USD">USD</option>
            </select>
          </label>

          <label>
            Base Price (₦ / mo)
            <input id="basePrice" type="number" value="450000" min="0" />
          </label>

          <label class="highlight">
            Custom Price Override (optional)
            <input id="customPrice" type="number" placeholder="Leave blank to use base price" min="0" />
          </label>
        </div>

        <div class="actions">
          <button type="button" id="btnDownload">⬇ Download .docx</button>
          <button type="button" id="btnSaveDrive" class="secondary">☁ Save to Client Folder</button>
        </div>

        <p id="status" class="status"></p>
      </form>
    </div>

  </body>
</html>
