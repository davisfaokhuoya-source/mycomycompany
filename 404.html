<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 80px 20px;
            background: #f8f9fa;
            color: #333;
        }

        h1 {
            color: #E07410;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.1rem;
            margin: 20px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f0f0f0;
            border-top: 5px solid #E07410;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <h1>Redirecting to Business Page...</h1>
    <p>Please wait a moment</p>

    <script>
        const path = window.location.pathname;

        // Extract slug from /bus/ANYTHING
        const match = path.match(/\/bus\/([^/?#]+)/i);

        if (match && match[1]) {
            const slug = match[1];
            // Redirect to landing.html with slug parameter
            window.location.replace(`/bus/landing.html?slug=${encodeURIComponent(slug)}`);
        } else {
            // Fallback
            window.location.replace('/bus/landing.html');
        }
    </script>
</body>

</html>
